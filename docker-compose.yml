# ═══════════════════════════════════════════════════════════════
# digi-gastro — Produktion (Coolify / Hetzner)
#
# WICHTIG für Migration vom Jinja2-Stack:
#  - Service-Namen & Volume-Namen IDENTISCH zum alten Compose
#    (db/pgbouncer/web/cron, Volumes pgdata + uploads) → die bestehenden
#    Hetzner-Volumes mit KUNDENDATEN werden weiterverwendet. Niemals
#    `docker compose down -v` ausführen!
#  - Das alte `uploads`-Volume liegt jetzt unter /app/public/uploads.
#  - redis entfällt (Next.js nutzt kein Redis). Das alte redisdata-Volume
#    bleibt ungenutzt auf dem Server liegen — kein Datenverlust.
#
# Erforderliche Umgebungsvariablen (in Coolify setzen):
#   AUTH_SECRET, ADMIN_PASSWORD
# Optionale:
#   NEXT_PUBLIC_BASE_URL (Build-Arg, Default https://digi-gastro.de)
#   COOKIE_SECURE=1 (HTTPS), AUTOHEAL_TOKEN
# ═══════════════════════════════════════════════════════════════

services:

  db:
    image: postgres:16-alpine
    container_name: digi_gastro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: digi_gastro
      POSTGRES_USER: gastro_user
      POSTGRES_PASSWORD: gastro_secret
      TZ: Europe/Berlin
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
      -c work_mem=4MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c log_min_duration_statement=1000
      -c log_connections=off
      -c log_disconnections=off
      -c autovacuum=on
      -c autovacuum_max_workers=3
      -c autovacuum_vacuum_scale_factor=0.1
      -c autovacuum_analyze_scale_factor=0.05
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c default_statistics_target=100
      -c max_wal_size=2GB
      -c min_wal_size=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastro_user -d digi_gastro"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: digi_gastro_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: gastro_user
      DB_PASSWORD: gastro_secret
      DB_NAME: digi_gastro
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "50"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      SERVER_IDLE_TIMEOUT: "300"
      AUTH_TYPE: plain
    ports:
      - "127.0.0.1:6432:5432"

  # ── Auto-Migration: Delta IDEMPOTENT vor jedem Web-Start ──
  # (ADD COLUMN IF NOT EXISTS → mehrfaches Ausführen harmlos, keine Datenverluste)
  # SQL ist direkt eingebettet — kein Datei-Mount, keine Pfad-Fallstricke unter Coolify.
  migrate:
    image: postgres:16-alpine
    container_name: digi_gastro_migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: gastro_secret
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "[migrate] warte auf DB ..."
        i=0
        until pg_isready -h db -U gastro_user -d digi_gastro -q; do
          i=$$((i+1))
          if [ $$i -gt 30 ]; then echo "[migrate] FEHLER: DB nicht erreichbar"; exit 1; fi
          sleep 2
        done
        psql -v ON_ERROR_STOP=1 -h db -U gastro_user -d digi_gastro <<'SQL'
        ALTER TABLE products    ADD COLUMN IF NOT EXISTS variants text DEFAULT '[]';
        ALTER TABLE products    ADD COLUMN IF NOT EXISTS extras   text DEFAULT '[]';
        ALTER TABLE order_items ADD COLUMN IF NOT EXISTS extras   varchar;
        ALTER TABLE event_combo_items ADD COLUMN IF NOT EXISTS excluded_product_ids varchar DEFAULT '[]';
        ALTER TABLE tenants     ADD COLUMN IF NOT EXISTS chat_enabled boolean DEFAULT false;
        ALTER TABLE tenants     ADD COLUMN IF NOT EXISTS kds_enabled boolean DEFAULT false;
        ALTER TABLE tenants     ADD COLUMN IF NOT EXISTS kds_super_group_ids text DEFAULT '[]';
        ALTER TABLE tenants     ADD COLUMN IF NOT EXISTS kds_service_types text DEFAULT '["kohle"]';
        CREATE TABLE IF NOT EXISTS chat_messages (
          id          SERIAL PRIMARY KEY,
          tenant_slug VARCHAR NOT NULL REFERENCES tenants(slug) ON DELETE CASCADE,
          device_id   VARCHAR(64) NOT NULL,
          nickname    VARCHAR(40) NOT NULL,
          body        VARCHAR(500) NOT NULL,
          is_admin    BOOLEAN NOT NULL DEFAULT false,
          is_deleted  BOOLEAN NOT NULL DEFAULT false,
          created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
        );
        CREATE INDEX IF NOT EXISTS idx_chatmsg_tenant_id ON chat_messages(tenant_slug, id);
        CREATE TABLE IF NOT EXISTS chat_bans (
          id          SERIAL PRIMARY KEY,
          tenant_slug VARCHAR NOT NULL REFERENCES tenants(slug) ON DELETE CASCADE,
          device_id   VARCHAR(64) NOT NULL,
          nickname    VARCHAR(40),
          reason      VARCHAR,
          banned_by   VARCHAR,
          created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          CONSTRAINT uq_chatban_tenant_device UNIQUE (tenant_slug, device_id)
        );
        CREATE INDEX IF NOT EXISTS idx_chatban_tenant ON chat_bans(tenant_slug);
        CREATE TABLE IF NOT EXISTS announcements (
          id          SERIAL PRIMARY KEY,
          key         VARCHAR UNIQUE,
          title       VARCHAR(120) NOT NULL,
          body        VARCHAR(1000) NOT NULL,
          icon        VARCHAR(40),
          is_active   BOOLEAN NOT NULL DEFAULT true,
          position    INT DEFAULT 0,
          created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
        );
        CREATE TABLE IF NOT EXISTS announcement_views (
          id              SERIAL PRIMARY KEY,
          announcement_id INT NOT NULL REFERENCES announcements(id) ON DELETE CASCADE,
          device_id       VARCHAR(64) NOT NULL,
          tenant_slug     VARCHAR NOT NULL,
          seen_at         TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          CONSTRAINT uq_annview_ann_device UNIQUE (announcement_id, device_id)
        );
        CREATE INDEX IF NOT EXISTS idx_annview_device ON announcement_views(device_id);
        INSERT INTO announcements (key, title, body, icon, position)
        SELECT 'chat-launch',
               'Neu: Gast-Chat 🎉',
               'Deine Gäste können sich jetzt direkt über die Speisekarte miteinander unterhalten — mobile-first im Chat unten rechts. Du hast volle Kontrolle: Im neuen Tab „Chat" im Dashboard kannst du Nachrichten löschen und störende Gäste anhand der Geräte-ID sperren oder wieder entsperren. Der Chat wird pro Restaurant zentral freigeschaltet.',
               'forum', 0
        WHERE NOT EXISTS (SELECT 1 FROM announcements WHERE key = 'chat-launch');
        CREATE TABLE IF NOT EXISTS ad_banners (
          id              SERIAL PRIMARY KEY,
          tenant_slug     VARCHAR NOT NULL REFERENCES tenants(slug) ON DELETE CASCADE,
          company_name    VARCHAR NOT NULL,
          title           VARCHAR NOT NULL,
          subtitle        VARCHAR,
          image_url       TEXT,
          target_url      TEXT,
          placement       VARCHAR NOT NULL DEFAULT 'menu_mid',
          status          VARCHAR NOT NULL DEFAULT 'active',
          start_at        TIMESTAMPTZ,
          end_at          TIMESTAMPTZ,
          priority        INT NOT NULL DEFAULT 0,
          impressions     INT NOT NULL DEFAULT 0,
          clicks          INT NOT NULL DEFAULT 0,
          created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()
        );
        CREATE INDEX IF NOT EXISTS idx_adbanner_tenant_status ON ad_banners(tenant_slug, status, priority);
        CREATE TABLE IF NOT EXISTS vouchers (
          id              SERIAL PRIMARY KEY,
          code            VARCHAR NOT NULL UNIQUE,
          tenant_slug     VARCHAR NOT NULL REFERENCES tenants(slug) ON DELETE CASCADE,
          discount_type   VARCHAR NOT NULL DEFAULT 'percent',
          discount_value  INT NOT NULL DEFAULT 0,
          status          VARCHAR NOT NULL DEFAULT 'active',
          used_table      VARCHAR,
          used_at         TIMESTAMPTZ,
          created_by      VARCHAR,
          created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()
        );
        CREATE INDEX IF NOT EXISTS idx_voucher_tenant_status ON vouchers(tenant_slug, status);
        SQL
        echo "[migrate] DB-Delta OK"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://digi-gastro.de}
    container_name: digi_gastro_web
    restart: unless-stopped
    # PID1 = tini (reapt Zombies, leitet Signale weiter) + begrenzte
    # Graceful-Shutdown-Zeit, damit Deploys nicht 30s pro Container hängen.
    init: true
    stop_grace_period: 10s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://gastro_user:gastro_secret@pgbouncer:5432/digi_gastro
      AUTH_SECRET: ${AUTH_SECRET:?Bitte AUTH_SECRET in Coolify setzen}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Bitte ADMIN_PASSWORD in Coolify setzen}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://digi-gastro.de}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      AUTOHEAL_TOKEN: ${AUTOHEAL_TOKEN:-autoheal-secret-2026}
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Europe/Berlin
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    volumes:
      # Kundendaten (Logos, Produktbilder, …) — gleiches Volume wie vorher.
      # Legacy-Struktur im Volume: <root>/uploads/<kategorie>/… — daher
      # Start-Skript unten, das Symlinks auf die richtige Ebene legt.
      - uploads:/app/public/uploads
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8090:3000"
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "[web] Upload-Struktur pruefen ..."
        if [ -d /app/public/uploads/uploads ]; then
          for d in /app/public/uploads/uploads/*; do
            [ -e "$$d" ] || continue
            n=$$(basename "$$d")
            if [ ! -e "/app/public/uploads/$$n" ]; then
              ln -s "$$d" "/app/public/uploads/$$n"
              echo "[web] symlink: $$n"
            fi
          done
        fi
        exec node server.js
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 25s

  # ── Cron: Auto-Heal alle 5 Minuten (Node-Variante des alten Python-Cron) ──
  cron:
    image: node:20-alpine
    container_name: digi_gastro_cron
    restart: unless-stopped
    init: true
    stop_grace_period: 5s
    depends_on:
      web:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      CRON_WEB_URL: "http://web:3000"
      AUTOHEAL_TOKEN: ${AUTOHEAL_TOKEN:-autoheal-secret-2026}
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "digi-gastro Cron gestartet (alle 5 Min -> $$CRON_WEB_URL/api/auto-heal)"
        trap 'exit 0' TERM INT
        while true; do
          wget -qO- "$${CRON_WEB_URL}/api/auto-heal?token=$${AUTOHEAL_TOKEN}" \
            >/dev/null 2>&1 && echo "[Cron] Auto-Heal ok" || echo "[Cron] Auto-Heal Fehler"
          sleep 300 & wait $$!
        done
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  # ── Play World: Realtime-Server (Colyseus) ──
  # Für Live-Multiplayer (Kart-Arena). Erreichbar im Browser über eine
  # eigene Domain (z. B. games.digi-gastro.de -> Port 2567, WebSocket).
  games:
    build:
      context: ./games
      dockerfile: Dockerfile
    container_name: digi_gastro_games
    restart: unless-stopped
    environment:
      PORT: "2567"
      TZ: Europe/Berlin
    expose:
      - "2567"
    # Öffentlich über den Coolify-Traefik-Proxy unter /games (WSS).
    # Das Frontend verbindet standardmäßig wss://<host>/games (same-origin).
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=yc12gd4qtxlgawd2p2fta57t"
      - "traefik.http.middlewares.dg-games-strip.stripprefix.prefixes=/games"
      - "traefik.http.services.dg-games.loadbalancer.server.port=2567"
      - "traefik.http.routers.dg-games-http.entrypoints=http"
      - "traefik.http.routers.dg-games-http.rule=(Host(`digi-gastro.de`) || Host(`www.digi-gastro.de`)) && PathPrefix(`/games`)"
      - "traefik.http.routers.dg-games-http.middlewares=dg-games-strip"
      - "traefik.http.routers.dg-games-http.service=dg-games"
      - "traefik.http.routers.dg-games-https.entrypoints=https"
      - "traefik.http.routers.dg-games-https.rule=(Host(`digi-gastro.de`) || Host(`www.digi-gastro.de`)) && PathPrefix(`/games`)"
      - "traefik.http.routers.dg-games-https.tls=true"
      - "traefik.http.routers.dg-games-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dg-games-https.middlewares=dg-games-strip"
      - "traefik.http.routers.dg-games-https.service=dg-games"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
