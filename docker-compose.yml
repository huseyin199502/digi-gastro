# ──────────────────────────────────────────────────────────────────
# digi-gastro – Production Docker Stack (Coolify-compatible)
# ──────────────────────────────────────────────────────────────────

services:

  db:
    image: postgres:16-alpine
    container_name: digi_gastro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: digi_gastro
      POSTGRES_USER: gastro_user
      POSTGRES_PASSWORD: gastro_secret
      TZ: Europe/Berlin
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command: >
      postgres
      -c max_connections=400
      -c shared_buffers=256MB
      -c work_mem=4MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c log_min_duration_statement=1000
      -c log_connections=off
      -c log_disconnections=off
      -c autovacuum=on
      -c autovacuum_max_workers=3
      -c autovacuum_naptime=60s
      -c autovacuum_vacuum_scale_factor=0.1
      -c autovacuum_analyze_scale_factor=0.05
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c default_statistics_target=100
      -c max_wal_size=2GB
      -c min_wal_size=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastro_user -d digi_gastro"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digi_gastro_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://gastro_user:gastro_secret@db:5432/digi_gastro
      UPLOAD_DIR: /app/data/uploads
      PYTHONUNBUFFERED: "1"
      PORT: "8000"
      WORKERS: "4"
      TZ: Europe/Berlin
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8090:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: digi_gastro_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  redisdata:
    driver: local
