# ──────────────────────────────────────────────────────────────────
# digi-gastro – Local Docker Stack
#
# Usage:
#   docker compose up --build        # first run / after code changes
#   docker compose up -d             # start in background
#   docker compose logs -f web       # stream app logs
#   docker compose down              # stop & remove containers
#   docker compose down -v           # stop + wipe all volumes (fresh start)
# ──────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL database ────────────────────────────────────────
  db:
    image: postgres:16-alpine          # small, stable, production-grade
    container_name: digi_gastro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       digi_gastro
      POSTGRES_USER:     gastro_user
      POSTGRES_PASSWORD: gastro_secret   # change before going to prod!
      TZ:                Europe/Berlin   # Zeitzone für korrekte Uhrzeiten in Logs
      # ── Performance Tuning für 100+ gleichzeitige Gäste ──
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=256MB
      -c work_mem=4MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c log_min_duration_statement=1000
      -c log_connections=off
      -c log_disconnections=off
      -c autovacuum=on
      -c autovacuum_max_workers=3
      -c autovacuum_naptime=60s
      -c autovacuum_vacuum_scale_factor=0.1
      -c autovacuum_analyze_scale_factor=0.05
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c default_statistics_target=100
      -c max_wal_size=2GB
      -c min_wal_size=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data  # named volume → survives restarts
      - /etc/timezone:/etc/timezone:ro    # Host-Zeitzone (Hetzner DE)
      - /etc/localtime:/etc/localtime:ro  # Host-Localtime (Hetzner DE)
    ports:
      - "127.0.0.1:5432:5432"                      # expose locally only (invisible to public internet)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastro_user -d digi_gastro"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI application ────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digi_gastro_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy     # wait until Postgres is truly ready
      redis:
        condition: service_started     # Redis is optional, but start it first if available
    environment:
      # ── Database ──────────────────────────────────────────────
      DATABASE_URL: postgresql://gastro_user:gastro_secret@db:5432/digi_gastro

      # ── Persistent upload directory (mounted as volume below) ─
      UPLOAD_DIR: /app/data/uploads

      # ── App tuning ────────────────────────────────────────────
      PYTHONUNBUFFERED: "1"
      PORT: "8000"
      TZ: Europe/Berlin                 # Zeitzone für korrekte Uhrzeiten in Logs

      # ── Redis (Cache + Lock + Pub/Sub) ───────────────────────
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/data              # logos & images survive rebuilds
      - /etc/timezone:/etc/timezone:ro    # Host-Zeitzone (Hetzner DE)
      - /etc/localtime:/etc/localtime:ro  # Host-Localtime (Hetzner DE)
    ports:
      - "8090:8000"                    # → http://localhost:8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Redis cache + lock + pub/sub ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: digi_gastro_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"           # expose locally only (invisible to public internet)
    volumes:
      - redisdata:/data                 # AOF/RDB persistence survives restarts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ── Named volumes (managed by Docker) ──────────────────────────
volumes:
  pgdata:
    driver: local          # Postgres data
  uploads:
    driver: local          # Tenant logos & product images
  redisdata:               # Redis AOF/RDB snapshots
    driver: local