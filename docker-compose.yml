# ──────────────────────────────────────────────────────────────────
# digi-gastro – Production Docker Stack (Skaliert für 100+ Tenants)
#
# Usage:
#   docker compose up --build        # first run / after code changes
#   docker compose up -d             # start in background
#   docker compose logs -f web       # stream app logs
#   docker compose down              # stop & remove containers
#   docker compose down -v           # stop + wipe all volumes (fresh start)
# ──────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL database ────────────────────────────────────────
  db:
    image: postgres:16-alpine          # small, stable, production-grade
    container_name: digi_gastro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       digi_gastro
      POSTGRES_USER:     gastro_user
      POSTGRES_PASSWORD: gastro_secret   # change before going to prod!
      TZ:                Europe/Berlin   # Zeitzone für korrekte Uhrzeiten in Logs
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c work_mem=4MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c log_min_duration_statement=1000
      -c log_connections=off
      -c log_disconnections=off
      -c autovacuum=on
      -c autovacuum_max_workers=3
      -c autovacuum_naptime=60s
      -c autovacuum_vacuum_scale_factor=0.1
      -c autovacuum_analyze_scale_factor=0.05
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c default_statistics_target=100
      -c max_wal_size=2GB
      -c min_wal_size=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastro_user -d digi_gastro"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── PgBouncer: Connection Pooling ──────────────────────────────
  # KRITISCH für 100+ Tenants / 5000+ Gäste:
  # - PostgreSQL max_connections=200 → ohne Pooler erschöpft bei ~300 Clients
  # - PgBouncer hält 50 persistente DB-Verbindungen offen und multiplexed
  #   Hunderte von Client-Verbindungen darüber (Transaction-Pooling)
  # - 4 Uvicorn-Worker × 50 Pool = 200 → passt in max_connections=200
  # - Latenz-Reduktion: keine Connection-Setup-Zeit pro Request
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: digi_gastro_pgbouncer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: gastro_user
      DB_PASSWORD: gastro_secret
      DB_NAME: digi_gastro
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      SERVER_IDLE_TIMEOUT: 300
      AUTH_TYPE: trust
      ADMIN_USERS: gastro_user
    ports:
      - "127.0.0.1:6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U gastro_user"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── FastAPI application (Multi-Worker) ─────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digi_gastro_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    environment:
      # ── Database via PgBouncer (Transaction Pooling) ───────────
      # PgBouncer auf Port 6432 (intern 5432) statt direkt auf DB
      DATABASE_URL: postgresql://gastro_user:gastro_secret@pgbouncer:5432/digi_gastro
      UPLOAD_DIR: /app/data/uploads
      PYTHONUNBUFFERED: "1"
      PORT: "8000"
      WORKERS: "4"
      TZ: Europe/Berlin
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8090:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Arq Background Worker ──────────────────────────────────────
  # Verarbeitet asynchrone Tasks: POS-Webhook, Service-Notifications
  # Entlastet die Web-Worker von blockierenden I/O-Operationen
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digi_gastro_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gastro_user:gastro_secret@pgbouncer:5432/digi_gastro
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TZ: Europe/Berlin
    volumes:
      - uploads:/app/data:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    command: ["arq", "worker.WorkerSettings"]

  # ── Redis cache + lock + pub/sub + queue ───────────────────────
  redis:
    image: redis:7-alpine
    container_name: digi_gastro_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ── Named volumes (managed by Docker) ──────────────────────────
volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  redisdata:
    driver: local