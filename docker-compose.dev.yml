# digi-gastro Next.js stack — LOKALE ENTWICKLUNG (PostgreSQL auf 5433)
# Produktion siehe docker-compose.yml (Coolify/Hetzner).
#
# Legacy-Dump einspielen:
#   docker cp digi-gastro-backup.dump digi_gastro_next_db:/tmp/backup.dump
#   docker exec digi_gastro_next_db pg_restore -U gastro_user -d digi_gastro --no-owner --no-privileges /tmp/backup.dump

services:
  db:
    image: postgres:16-alpine
    container_name: digi_gastro_next_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: digi_gastro
      POSTGRES_USER: gastro_user
      POSTGRES_PASSWORD: gastro_secret
      TZ: Europe/Berlin
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastro_user -d digi_gastro"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local
