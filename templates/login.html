<!DOCTYPE html>
<html class="dark" lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ restaurant_name }} - Admin Login</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="digi-gastro Login">
    <meta name="theme-color" content="#C9A84C">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/images/favicon-16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/images/icon-192.png">
    <link rel="preload" href="/static/css/tailwind-built.css?v=4" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/static/css/tailwind-built.css?v=4"></noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
    </noscript>
    <link rel="stylesheet" href="/static/css/design_system.css?v=18">
    <style>
        @view-transition { navigation: auto; }
        :root { --color-primary: #10b981; --color-primary-rgb: 16 185 129; }
        html { overscroll-behavior: none; }
        body { background-color: var(--bg-obsidian); color: #f3f4f6; font-family: var(--font-sans); }
        @media (max-width: 640px) {
            input[type="text"], input[type="email"], input[type="tel"], input[type="number"],
            input[type="password"], input[type="search"], input[type="url"], textarea, select {
                font-size: 16px !important;
            }
        }
        /* Staff PIN field — animated reveal */
        #staff-section { overflow: hidden; transition: max-height 0.3s ease, opacity 0.3s ease; max-height: 0; opacity: 0; }
        #staff-section.visible { max-height: 400px; opacity: 1; }
        /* Mode toggle */
        .mode-toggle { display: flex; gap: 0; margin-bottom: 1.5rem; border-radius: 0.75rem; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .mode-btn { flex: 1; padding: 0.75rem; text-align: center; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s; background: transparent; color: #71717a; border: none; min-height: 44px; }
        .mode-btn.active { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    </style>
</head>
<body class="flex items-center justify-center min-h-[100dvh] p-4 relative overflow-y-auto no-image-save"
      oncontextmenu="return false;" ondragstart="return false;" oncopy="return false;" oncut="return false;"
      style="padding-top: max(1rem, env(safe-area-inset-top)); padding-bottom: max(1rem, env(safe-area-inset-bottom)); padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right));">
    
    <div class="fixed inset-0 grid-bg opacity-30 pointer-events-none z-0"></div>
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[1000px] h-[350px] radial-glow pointer-events-none z-0"></div>
    
    <div class="w-full max-w-md glass-panel rounded-2xl p-6 sm:p-8 shadow-2xl relative z-10 overflow-hidden">
        <div class="absolute -right-20 -top-20 w-48 h-48 bg-primary/5 rounded-full blur-3xl"></div>
        
        <div class="text-center mb-6">
            <div class="inline-flex p-3.5 bg-emerald-500/10 rounded-2xl border border-emerald-500/20 mb-4 shadow-lg shadow-emerald-500/5 hover-lift">
                <img alt="digi-gastro logo" class="header-logo h-10 w-10 object-cover rounded-lg" src="/static/images/digigastrologo.jpeg" decoding="async" fetchpriority="high">
            </div>
            <h2 class="text-2xl font-black text-white tracking-tight font-display bg-gradient-to-r from-white via-zinc-200 to-zinc-400 bg-clip-text text-transparent">Login</h2>
            <p class="text-xs text-zinc-400 mt-2 font-medium tracking-wide uppercase">{{ restaurant_name }} Management</p>
        </div>

        {% if error %}
        <div class="mb-5 bg-red-950/20 border border-red-500/20 rounded-xl p-4 text-red-300 text-sm flex items-start gap-3">
            <span class="material-symbols-outlined text-red-400 text-sm mt-0.5">error</span>
            <span class="font-medium leading-relaxed">{{ error }}</span>
        </div>
        {% endif %}

        <!-- Mode Toggle: Chef vs Kellner -->
        <div class="mode-toggle">
            <button type="button" class="mode-btn active" id="mode-chef" onclick="switchMode('chef')">
                <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;">admin_panel_settings</span>
                Chef
            </button>
            <button type="button" class="mode-btn" id="mode-staff" onclick="switchMode('staff')">
                <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;">badge</span>
                Kellner
            </button>
        </div>

        <!-- CHEF LOGIN (E-Mail + Passwort) -->
        <form action="/admin/login" method="POST" class="space-y-5" id="chef-form">
            {% if redirect %}
            <input type="hidden" name="redirect" value="{{ redirect }}">
            {% endif %}
            <div>
                <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">E-Mail Adresse</label>
                <input class="w-full input-premium focus:border-primary placeholder:text-zinc-600 text-base transition-all" name="email" type="email" autocomplete="email" inputmode="email" enterkeyhint="next" placeholder="demo@digi-gastro.de" required value="{{ email if email else '' }}">
            </div>
            <div>
                <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Passwort</label>
                <input class="w-full input-premium focus:border-primary placeholder:text-zinc-600 text-base transition-all" name="password" type="password" autocomplete="current-password" enterkeyhint="go" placeholder="••••••••" required>
            </div>
            <button class="btn-premium btn-premium-primary py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 w-full text-sm mt-2 transition-all" type="submit">
                <span class="material-symbols-outlined text-[18px]">login</span>
                Einloggen
            </button>
        </form>

        <!-- KELLNER LOGIN (E-Mail → Mitarbeiter wählen + PIN) -->
        <form action="/admin/login" method="POST" class="space-y-5 hidden" id="staff-form">
            <input type="hidden" name="staff_login" value="1">
            <div>
                <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Restaurant E-Mail</label>
                <input class="w-full input-premium focus:border-primary placeholder:text-zinc-600 text-base transition-all" id="staff-email" name="email" type="email" autocomplete="email" inputmode="email" enterkeyhint="next" placeholder="restaurant@email.de" required value="{{ email if email else '' }}">
                <button type="button" onclick="loadStaff()" class="mt-2 w-full text-xs font-bold text-emerald-400 hover:text-emerald-300 transition py-2 min-h-[44px]">
                    <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;">search</span>
                    Mitarbeiter laden
                </button>
            </div>
            
            <div id="staff-section">
                <div>
                    <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Mitarbeiter</label>
                    <select id="staff-select" name="staff_name" class="w-full input-premium text-base" disabled>
                        <option value="">— Erst Restaurant E-Mail eingeben —</option>
                    </select>
                </div>
                <div class="mt-4">
                    <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">4-stellige PIN</label>
                    <input class="w-full input-premium focus:border-primary placeholder:text-zinc-600 text-base text-center font-mono text-2xl tracking-[0.5em] transition-all" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" enterkeyhint="go" placeholder="••••" required disabled>
                </div>
                <button class="btn-premium btn-premium-primary py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 w-full text-sm mt-5 transition-all" type="submit">
                    <span class="material-symbols-outlined text-[18px]">login</span>
                    Einloggen
                </button>
            </div>
        </form>

        <div class="mt-6 pt-5 border-t border-zinc-800/60 text-center">
            <a href="/digi-gastro-admin/login" class="text-xs text-zinc-500 hover:text-emerald-400 font-bold uppercase tracking-widest transition-colors py-2 inline-block">
                Partner Login
            </a>
        </div>
    </div>

    <script>
        function switchMode(mode) {
            const chefBtn = document.getElementById('mode-chef');
            const staffBtn = document.getElementById('mode-staff');
            const chefForm = document.getElementById('chef-form');
            const staffForm = document.getElementById('staff-form');
            
            if (mode === 'chef') {
                chefBtn.classList.add('active');
                staffBtn.classList.remove('active');
                chefForm.classList.remove('hidden');
                staffForm.classList.add('hidden');
            } else {
                staffBtn.classList.add('active');
                chefBtn.classList.remove('active');
                staffForm.classList.remove('hidden');
                chefForm.classList.add('hidden');
            }
        }

        async function loadStaff() {
            const email = document.getElementById('staff-email').value.trim();
            if (!email) { alert('Bitte Restaurant E-Mail eingeben'); return; }
            
            const select = document.getElementById('staff-select');
            const section = document.getElementById('staff-section');
            const pinInput = document.querySelector('#staff-form input[name=pin]');
            
            select.innerHTML = '<option value="">Lade Mitarbeiter...</option>';
            select.disabled = true;
            
            try {
                const resp = await fetch('/api/staff-by-email?email=' + encodeURIComponent(email));
                if (!resp.ok) {
                    select.innerHTML = '<option value="">— Restaurant nicht gefunden —</option>';
                    section.classList.remove('visible');
                    return;
                }
                const data = await resp.json();
                if (!data.staff || data.staff.length === 0) {
                    select.innerHTML = '<option value="">— Keine Mitarbeiter angelegt —</option>';
                    section.classList.remove('visible');
                    return;
                }
                select.innerHTML = '<option value="">— Mitarbeiter wählen —</option>' +
                    data.staff.map(s => `<option value="${s.name}">${s.name} (${s.role})</option>`).join('');
                select.disabled = false;
                pinInput.disabled = false;
                section.classList.add('visible');
            } catch (e) {
                select.innerHTML = '<option value="">— Fehler beim Laden —</option>';
                section.classList.remove('visible');
            }
        }
    </script>
    <script>
        // Service Worker Registration — vereinfacht (kein auto-reload mehr!)
        // Der controllerchange auto-reload hat eine endlose Reload-Schleife verursacht.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then((registration) => {
                        console.log('[PWA] SW registriert:', registration.scope);
                    })
                    .catch((err) => console.warn('[PWA] SW fehlgeschlagen:', err));
                // KEIN controllerchange Listener mehr — kein auto-reload!
            });
        }
    </script>
</body>
</html>
