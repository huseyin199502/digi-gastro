<!DOCTYPE html>
<html class="dark" lang="de">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>{{ restaurant_name }} - Admin Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Premium Design System -->
    <link rel="stylesheet" href="/static/css/design_system.css">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981', /* Premium Emerald */
                        charcoal: '#0b0c10',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: var(--bg-obsidian);
            color: #f3f4f6;
            font-family: var(--font-sans);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative overflow-hidden">
    
    <!-- Visual background enhancements -->
    <div class="fixed inset-0 grid-bg opacity-30 pointer-events-none z-0"></div>
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[350px] radial-glow pointer-events-none z-0"></div>
    
    <div class="w-full max-w-md glass-panel rounded-2xl p-8 shadow-2xl relative z-10 overflow-hidden">
        <!-- Ambient corner glow -->
        <div class="absolute -right-20 -top-20 w-48 h-48 bg-primary/5 rounded-full blur-3xl"></div>
        
        <div class="text-center mb-8">
            <div class="inline-flex p-3.5 bg-emerald-500/10 rounded-2xl border border-emerald-500/20 mb-4 shadow-lg shadow-emerald-500/5 hover-lift">
                <img alt="digi-gastro logo" class="h-10 w-10 object-cover rounded-lg" src="/static/images/digigastrologo.jpeg" onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&q=80&w=300'">
            </div>
            <h2 class="text-2xl font-black text-white tracking-tight font-display bg-gradient-to-r from-white via-zinc-200 to-zinc-400 bg-clip-text text-transparent">Admin Login</h2>
            <p class="text-xs text-zinc-400 mt-2 font-medium tracking-wide uppercase">{{ restaurant_name }} Management Panel</p>
        </div>

        {% if error %}
        <div class="mb-5 bg-red-950/20 border border-red-500/20 rounded-xl p-4 text-red-300 text-xs flex items-start gap-3">
            <span class="material-symbols-outlined text-red-400 text-sm mt-0.5">error</span>
            <span class="font-medium leading-relaxed">{{ error }}</span>
        </div>
        {% endif %}

        <form action="/{{ slug }}/admin/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2" for="email">E-Mail Adresse</label>
                <input class="w-full input-premium focus:border-primary placeholder:text-zinc-600 text-sm transition-all" id="email" name="email" type="email" placeholder="demo@digi-gastro.de" required>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2" for="password">Passwort</label>
                <input class="w-full input-premium focus:border-primary placeholder:text-zinc-600 text-sm transition-all" id="password" name="password" type="password" placeholder="••••••••" required>
            </div>

            <button class="btn-premium btn-premium-primary py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 w-full text-sm mt-2 transition-all" type="submit">
                <span class="material-symbols-outlined text-[18px]">login</span>
                Einloggen
            </button>
        </form>

        <div class="mt-8 pt-5 border-t border-zinc-800/60 text-center text-[10px] text-zinc-500 font-bold uppercase tracking-widest">
            digi-gastro Admin Panel
        </div>
    </div>
</body>
</html>
