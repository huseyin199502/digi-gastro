<!DOCTYPE html>
<html class="dark" lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ restaurant_name }} - Admin Login</title>

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="digi-gastro Login">
    <meta name="theme-color" content="#C9A84C">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/images/favicon-16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/images/icon-192.png">

    <!-- Tailwind CSS -->
    <!-- Tailwind CSS — locally built, replaces Play CDN (~3 MB JS → 72 KB CSS) -->
    <link rel="preload" href="/static/css/tailwind-built.css?v=3" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/static/css/tailwind-built.css?v=3"></noscript>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Premium Design System -->
    <link rel="stylesheet" href="/static/css/design_system.css?v=17">

    <style>
        /* Login page uses emerald as primary (was set via CDN tailwind.config before).
           Override CSS variables here to keep login visual identity after CDN removal. */
        :root {
            --color-primary: #10b981;
            --color-primary-rgb: 16 185 129;
        }
        /* iOS Overscroll-Bounce Prevention */
        html {
            overscroll-behavior: none;
        }
        body {
            background-color: var(--bg-obsidian);
            color: #f3f4f6;
            font-family: var(--font-sans);
        }

        /* ── Mobile (≤640px): prevent iOS auto-zoom on input focus ── */
        @media (max-width: 640px) {
            input[type="text"],
            input[type="email"],
            input[type="tel"],
            input[type="number"],
            input[type="password"],
            input[type="search"],
            input[type="url"],
            textarea,
            select {
                font-size: 16px !important;
            }
        }

        /* ── Small phone (≤480px): lighter blur for performance ── */
        @media (max-width: 480px) {
            .glass-panel {
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
            }
            .shadow-2xl {
                box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.5) !important;
            }
        }

        /* ── Reduced motion ── */
        @media (prefers-reduced-motion: reduce) {
            .hover-lift {
                transition: none !important;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative overflow-y-auto"
      style="padding-top: max(1rem, env(safe-area-inset-top)); padding-bottom: max(1rem, env(safe-area-inset-bottom)); padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right));">
    
    <!-- Visual background enhancements -->
    <div class="fixed inset-0 grid-bg opacity-30 pointer-events-none z-0"></div>
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[1000px] h-[350px] radial-glow pointer-events-none z-0"></div>
    
    <div class="w-full max-w-md glass-panel rounded-2xl p-6 sm:p-8 shadow-2xl relative z-10 overflow-hidden">
        <!-- Ambient corner glow -->
        <div class="absolute -right-20 -top-20 w-48 h-48 bg-primary/5 rounded-full blur-3xl"></div>
        
        <div class="text-center mb-8">
            <div class="inline-flex p-3.5 bg-emerald-500/10 rounded-2xl border border-emerald-500/20 mb-4 shadow-lg shadow-emerald-500/5 hover-lift">
                <img alt="digi-gastro logo" class="h-10 w-10 object-cover rounded-lg" src="/static/images/digigastrologo.jpeg" decoding="async" fetchpriority="high" onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&q=80&w=300'">
            </div>
            <h2 class="text-2xl font-black text-white tracking-tight font-display bg-gradient-to-r from-white via-zinc-200 to-zinc-400 bg-clip-text text-transparent">Admin Login</h2>
            <p class="text-xs text-zinc-400 mt-2 font-medium tracking-wide uppercase">{{ restaurant_name }} Management Panel</p>
        </div>

        {% if error %}
        <div class="mb-5 bg-red-950/20 border border-red-500/20 rounded-xl p-4 text-red-300 text-sm flex items-start gap-3">
            <span class="material-symbols-outlined text-red-400 text-sm mt-0.5">error</span>
            <span class="font-medium leading-relaxed">{{ error }}</span>
        </div>
        {% endif %}

        <!-- PWA Standalone Notice (auto-shown via JS when running as installed app) -->
        <div id="pwa-login-notice" class="hidden mb-5 bg-emerald-950/20 border border-emerald-500/30 rounded-xl p-3.5 text-emerald-200 text-xs flex items-start gap-2.5">
            <span class="material-symbols-outlined text-emerald-400 text-sm mt-0.5">info</span>
            <span class="leading-relaxed"><strong class="text-emerald-100">App-Modus erkannt.</strong> Die installierte App verwaltet ihren eigenen Login-Speicher. Bitte einmalig anmelden — danach bleibst du dauerhaft eingeloggt.</span>
        </div>

        <form action="/admin/login" method="POST" class="space-y-5">
            {% if redirect %}
            <input type="hidden" name="redirect" value="{{ redirect }}">
            {% endif %}
            <div>
                <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2" for="email">E-Mail Adresse</label>
                <input class="w-full input-premium focus:border-primary placeholder:text-zinc-600 text-base transition-all" id="email" name="email" type="email" placeholder="demo@digi-gastro.de" required value="{{ email if email else '' }}">
            </div>

            <div>
                <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2" for="password">Passwort</label>
                <input class="w-full input-premium focus:border-primary placeholder:text-zinc-600 text-base transition-all" id="password" name="password" type="password" placeholder="••••••••" required>
            </div>

            <button class="btn-premium btn-premium-primary py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 w-full text-sm mt-2 transition-all" type="submit">
                <span class="material-symbols-outlined text-[18px]">login</span>
                Einloggen
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-zinc-800/60 text-center">
            <a href="/digi-gastro-admin/login" class="text-xs text-zinc-500 hover:text-emerald-400 font-bold uppercase tracking-widest transition-colors py-2 inline-block">
                Partner Login
            </a>
        </div>
    </div>

    <script>
        // PWA Standalone Detection — show notice if user opened login page from installed app.
        (function () {
            const isStandalone =
                window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true ||
                new URLSearchParams(window.location.search).has('pwa');
            if (!isStandalone) return;
            const notice = document.getElementById('pwa-login-notice');
            if (notice) notice.classList.remove('hidden');
        })();
    </script>
    <!-- PWA Service Worker Registrierung -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then((reg) => console.log('[PWA] SW registriert:', reg.scope))
                    .catch((err) => console.warn('[PWA] SW fehlgeschlagen:', err));
            });
        }
    </script>
</body>
</html>
