<!DOCTYPE html>
<html class="dark" lang="de">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>SaaS Onboarding Center - digi-gastro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #e5e2e1;
            font-family: 'Inter', sans-serif;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-4">

    <div class="bg-[#1a1a1a] border border-[#262626] rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
        <div class="border-b border-[#262626] px-6 py-4 flex items-center justify-between bg-zinc-900/40">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <span class="material-symbols-outlined text-[#deff9a]">storefront</span>
                Neues Restaurant registrieren (SaaS Onboarding)
            </h3>
            <a href="/digi-gastro-admin" class="text-on-surface-variant hover:text-white transition-colors flex items-center gap-1 text-xs">
                <span class="material-symbols-outlined text-sm">arrow_back</span> Dashboard
            </a>
        </div>
        
        <form action="/admin/onboarding" method="POST" class="p-6 space-y-4">
            {% if error %}
            <div class="p-4 bg-red-950/40 border border-red-900/30 rounded-xl flex items-start gap-3 text-red-300 text-xs">
                <span class="material-symbols-outlined text-[18px] text-red-400">error</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}
            
            <div>
                <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Restaurant-Name</label>
                <input type="text" name="name" required placeholder="z. B. Golden Lounge" class="w-full bg-[#0a0a0a] border border-[#262626] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#deff9a] focus:ring-1 focus:ring-[#deff9a] transition-colors" oninput="generateSlug(this.value)">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Eindeutiger URL-Slug</label>
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-xs text-on-surface-variant">/</span>
                    <input type="text" name="slug" id="slugInput" required placeholder="goldenlounge" class="w-full bg-[#0a0a0a] border border-[#262626] rounded-xl pl-6 pr-4 py-3 text-sm text-[#deff9a] focus:outline-none focus:border-[#deff9a] focus:ring-1 focus:ring-[#deff9a] transition-colors" oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9-]/g, '')">
                </div>
                <p class="text-[10px] text-on-surface-variant mt-2 leading-normal">
                    Das Restaurant wird erreichbar sein unter: digi-gastro.de/<span id="slugPreview" class="text-[#deff9a]/80 font-semibold">goldenlounge</span>
                </p>
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Administrator E-Mail</label>
                <input type="email" name="email" required placeholder="chef@restaurant.de" class="w-full bg-[#0a0a0a] border border-[#262626] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#deff9a] focus:ring-1 focus:ring-[#deff9a] transition-colors">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Passwort</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-[#0a0a0a] border border-[#262626] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#deff9a] focus:ring-1 focus:ring-[#deff9a] transition-colors">
            </div>
            
            <div class="pt-2">
                <button type="submit" class="bg-[#deff9a] text-[#0a0a0a] hover:bg-[#c9e88b] active:scale-95 transition-all duration-150 rounded-xl py-3.5 font-bold flex items-center justify-center gap-2 w-full text-sm shadow-[0_4px_20px_rgba(222,255,154,0.15)]">
                    <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">add_circle</span>
                    Restaurant-Account anlegen & Onboarding starten
                </button>
            </div>
        </form>
    </div>

    <script>
        function generateSlug(text) {
            const slug = text.trim()
                .toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '') // Remove non-alphanumeric except spaces/hyphens
                .replace(/\s+/g, '-')        // Replace spaces with hyphens
                .replace(/-+/g, '-');        // Remove duplicates
            
            const slugInput = document.getElementById('slugInput');
            slugInput.value = slug;
            document.getElementById('slugPreview').textContent = slug || 'goldenlounge';
        }

        const slugInput = document.getElementById('slugInput');
        if (slugInput) {
            slugInput.addEventListener('input', function() {
                const val = this.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '') || 'goldenlounge';
                document.getElementById('slugPreview').textContent = val;
            });
        }
    </script>
</body>
</html>
