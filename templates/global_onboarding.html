<!DOCTYPE html>
<html class="dark" lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SaaS Onboarding Center - digi-gastro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Premium Design System -->
    <link rel="stylesheet" href="/static/css/design_system.css">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981', /* Premium Emerald */
                        charcoal: '#0b0c10',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: var(--bg-obsidian);
            color: #f3f4f6;
            font-family: var(--font-sans);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-obsidian text-zinc-100 antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Visual background enhancements -->
    <div class="fixed inset-0 grid-bg opacity-30 pointer-events-none z-0"></div>
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[350px] radial-glow pointer-events-none z-0"></div>

    <div class="glass-panel rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden relative z-10">
        <!-- Ambient corner glow -->
        <div class="absolute -right-20 -top-20 w-48 h-48 bg-primary/5 rounded-full blur-3xl"></div>

        <div class="border-b border-zinc-800/80 px-6 py-4 flex items-center justify-between bg-zinc-900/40">
            <h3 class="text-lg font-bold text-white flex items-center gap-2 font-display">
                <span class="material-symbols-outlined text-primary">storefront</span>
                Neues Restaurant registrieren
            </h3>
            <a href="/digi-gastro-admin" class="text-zinc-400 hover:text-white transition-colors flex items-center gap-1 text-xs font-bold uppercase tracking-wider">
                <span class="material-symbols-outlined text-sm font-black">arrow_back</span> Dashboard
            </a>
        </div>
        
        <form action="/admin/onboarding" method="POST" class="p-6 space-y-4">
            {% if error %}
            <div class="p-4 bg-red-950/20 border border-red-500/20 rounded-xl flex items-start gap-3 text-red-300 text-xs">
                <span class="material-symbols-outlined text-[18px] text-red-400">error</span>
                <span class="font-medium leading-relaxed">{{ error }}</span>
            </div>
            {% endif %}
            
            <div>
                <label class="block text-[11px] font-bold text-zinc-450 uppercase tracking-wider mb-2">Restaurant-Name</label>
                <input type="text" name="name" required placeholder="z. B. Golden Lounge" class="w-full input-premium focus:border-primary placeholder:text-zinc-650 text-sm transition-all" oninput="generateSlug(this.value)">
            </div>
            
            <div>
                <label class="block text-[11px] font-bold text-zinc-455 uppercase tracking-wider mb-2">Eindeutiger URL-Slug</label>
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-xs text-zinc-500">/</span>
                    <input type="text" name="slug" id="slugInput" required placeholder="goldenlounge" class="w-full input-premium focus:border-primary pl-6 placeholder:text-zinc-650 text-sm transition-all text-primary font-semibold" oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9-]/g, '')">
                </div>
                <p class="text-[10px] text-zinc-400 mt-2 leading-normal">
                    Das Restaurant wird erreichbar sein unter: digi-gastro.de/<span id="slugPreview" class="text-primary font-bold">goldenlounge</span>
                </p>
            </div>
            
            <div>
                <label class="block text-[11px] font-bold text-zinc-450 uppercase tracking-wider mb-2">Administrator E-Mail</label>
                <input type="email" name="email" required placeholder="chef@restaurant.de" class="w-full input-premium focus:border-primary placeholder:text-zinc-650 text-sm transition-all">
            </div>
            
            <div>
                <label class="block text-[11px] font-bold text-zinc-450 uppercase tracking-wider mb-2">Passwort</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full input-premium focus:border-primary placeholder:text-zinc-650 text-sm transition-all">
            </div>
            
            <div class="pt-2">
                <button type="submit" class="btn-premium btn-premium-primary py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 w-full text-sm">
                    <span class="material-symbols-outlined text-[18px]">add_circle</span>
                    Restaurant-Account anlegen
                </button>
            </div>
        </form>
    </div>

    <script>
        function generateSlug(text) {
            const slug = text.trim()
                .toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '') // Remove non-alphanumeric except spaces/hyphens
                .replace(/\s+/g, '-')        // Replace spaces with hyphens
                .replace(/-+/g, '-');        // Remove duplicates
            
            const slugInput = document.getElementById('slugInput');
            slugInput.value = slug;
            document.getElementById('slugPreview').textContent = slug || 'goldenlounge';
        }

        const slugInput = document.getElementById('slugInput');
        if (slugInput) {
            slugInput.addEventListener('input', function() {
                const val = this.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '') || 'goldenlounge';
                document.getElementById('slugPreview').textContent = val;
            });
        }
    </script>
</body>
</html>
