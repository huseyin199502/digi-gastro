<!DOCTYPE html>
<html class="dark" lang="de">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Restaurant Deaktiviert - digi-gastro</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/design_system.css">
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "on-surface": "#f3f4f6",
                "outline-variant": "#1f1f23",
                "primary": "#10b981",
                "accent": "#f59e0b",
                "background": "#050507",
                "surface": "#0b0c10",
                "surface-container-high": "#11131a",
                "on-surface-variant": "#9ca3af"
              }
            }
          }
        }
    </script>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-6 text-center grid-bg radial-glow">
    <div class="glass-panel border border-outline-variant rounded-3xl max-w-md w-full p-10 shadow-2xl flex flex-col items-center space-y-6 relative z-30">
        <div class="w-24 h-24 bg-red-500/10 rounded-full flex items-center justify-center border border-red-500/20 pulse-red-card">
            <span class="material-symbols-outlined text-red-500 text-5xl">gavel</span>
        </div>
        <div class="space-y-3">
            <h2 class="text-3xl font-extrabold text-red-400 tracking-tight font-display">Wartungsmodus</h2>
            <p class="text-xs text-on-surface-variant leading-relaxed font-semibold">
                Dieses Restaurant ist vorübergehend deaktiviert. Bitte wende dich an den digi-gastro Support.
            </p>
        </div>
        <div class="border-t border-outline-variant/60 pt-6 w-full text-[10px] text-zinc-500 flex items-center justify-center gap-2 font-display uppercase tracking-wider font-extrabold">
            <span class="material-symbols-outlined text-sm text-primary">security</span>
            <span>digi-gastro Support Center</span>
        </div>
    </div>
</body>
</html>
