<style>

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff; min-height: 100vh; min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            display: flex; align-items: center; justify-content: center;
            padding: 1rem;
        }
        .container { max-width: 420px; width: 100%; text-align: center; }
        .logo { width: 80px; height: 80px; object-fit: contain; border-radius: 1rem; margin: 0 auto 1rem; background: rgba(255,255,255,0.1); padding: 8px; }
        .logo-placeholder { width: 80px; height: 80px; border-radius: 1rem; margin: 0 auto 1rem; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        h1 { font-size: 1.5rem; font-weight: 900; margin: 0 0 0.5rem; }
        .subtitle { font-size: 0.875rem; color: #a1a1aa; margin: 0 0 2rem; }
        .card-preview {
            background: linear-gradient(135deg, {{ card.color_hex if card else '#C9A84C' }} 0%, {{ card.color_hex if card else '#C9A84C' }}CC 100%);
            border-radius: 1.5rem; padding: 2rem 1.5rem; margin-bottom: 2rem;
            box-shadow: 0 20px 60px -10px rgba(0,0,0,0.5);
        }
        .card-name { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.8; margin-bottom: 0.5rem; }
        .card-reward { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.25rem; }
        .card-stamps { font-size: 0.875rem; opacity: 0.9; }
        .stars { display: flex; justify-content: center; gap: 4px; margin-top: 1rem; }
        .star { font-size: 1.25rem; }
        .star.filled { color: #fff; }
        .star.empty { color: rgba(255,255,255,0.3); }
        .btn-apple {
            background: #000; color: #fff; font-weight: 800; padding: 1rem;
            border-radius: 0.875rem; font-size: 1rem; width: 100%; border: none;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            cursor: pointer; transition: transform 0.15s; text-decoration: none;
            margin-bottom: 0.75rem;
        }
        .btn-apple:active { transform: scale(0.98); }
        .btn-google {
            background: #fff; color: #1a1a1a; font-weight: 800; padding: 1rem;
            border-radius: 0.875rem; font-size: 1rem; width: 100%; border: none;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            cursor: pointer; transition: transform 0.15s; text-decoration: none;
        }
        .btn-google:active { transform: scale(0.98); }
        .btn-skip {
            background: transparent; color: #71717a; font-weight: 600; padding: 0.75rem;
            font-size: 0.875rem; width: 100%; border: none; cursor: pointer; margin-top: 0.5rem;
        }
        .footer { margin-top: 2rem; font-size: 0.65rem; color: #52525b; }
        .hidden { display: none !important; }
        .toast {
            position: fixed; top: 1rem; left: 50%; transform: translateX(-50%) translateY(-150%);
            padding: 1rem 1.25rem; border-radius: 0.75rem; font-weight: 800; z-index: 100;
            opacity: 0; transition: all 0.3s; max-width: 90vw; text-align: center; font-size: 0.875rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: #22c55e; color: #fff; }
        .toast.error { background: #ef4444; color: #fff; }
    
</style>
