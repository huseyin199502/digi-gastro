                async serveSingleItem(item) {
                    // ── Issue 2.4 Fix: Mutex gegen Mehrfachklicks ──
                    // Verhindert doppelte Serve-Requests bei schnellem Doppelklick
                    // auf den ✓-Button. Backend-Audit Issue 1.3: /admin/orders/serve
                    // läuft ohne tenant_lock → Client-Schutz ist hier die primäre
                    // Verteidigungslinie gegen doppelte Status-Setzung.
                    if (this._serveInProgress) return;
                    this._serveInProgress = true;
                    try {
                        const res = await fetch('/admin/orders/serve', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ order_id: item.order_id, item_key: item.key })
                        });
                        if (res.ok) {
                            showToast(`✔️ ${item.name} als serviert markiert`, "success");
                            // Refresh from server to get accurate state (correct key format, merged items, etc.)
                            await this.fetchAdminDrawerState();
                        } else {
                            showToast("Fehler beim Servieren", "error");
                        }
                    } catch (e) {
                        showToast("Verbindungsfehler beim Servieren", "error");
                    } finally {
                        this._serveInProgress = false;
                    }
                },

                async serveAllPending() {
                    // ── Issue 2.4 Fix: Mutex gegen Mehrfachklicks ──
                    // Verhindert, dass 2 schnelle Klicks auf "Alle serviert"
                    // 2×N parallele Serve-Requests feuern (Toast "Alle serviert"
                    // erscheint sonst 2×, Backend-Last-Spike, Race-Conditions
                    // auf item_status). Siehe auch serveSingleItem.
                    if (this._serveAllInProgress) return;
                    const orderIds = [...new Set(this.tableOrders.pending.map(i => i.order_id))];
                    if (orderIds.length === 0) return;
                    this._serveAllInProgress = true;
                    
                    try {
                        const promises = orderIds.map(orderId => 
                            fetch('/admin/orders/serve', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ order_id: orderId })
                            })
                        );
                        const results = await Promise.all(promises);
                        if (results.every(r => r.ok)) {
                            showToast("✔️ Alle ausstehenden Artikel serviert", "success");
                            // Refresh from server to get accurate state (correct key format, merged items, etc.)
                            await this.fetchAdminDrawerState();
                        } else {
                            showToast("Fehler beim Servieren der Artikel", "error");
                            // Auch bei Teilausfall State refreshen, damit der Kellner
                            // sieht, welche Items tatsächlich serviert wurden — sonst
                            // könnte er erneut klicken und bereits servierte Items
                            // erneut als serviert markieren (gleiche Bug-Klasse wie
                            // Issue 2.5 bei Gesamtrechnung).
                            await this.fetchAdminDrawerState();
                        }
                    } catch (e) {
                        showToast("Verbindungsfehler", "error");
                    } finally {
                        this._serveAllInProgress = false;
                    }
                },

                async cancelItem(item) {
                    // ── Race Condition Schutz: nicht mehrfach ausführen ──
                    if (this._cancelInProgress) return;
                    this._cancelInProgress = true;
                    // Visuelles Feedback: Cancel-Button sofort als "in Arbeit" markieren
                    // (damit der Kellner sieht, dass der Klick registriert wurde)
                    this._cancellingItemKey = item.key;

                    let qty = item.quantity;
                    if (qty > 1) {
                        const qtyStr = prompt(`Wie viele ${item.name} stornieren? (Max: ${qty})`, qty);
                        if (qtyStr === null) {
                            this._cancelInProgress = false;
                            this._cancellingItemKey = null;
                            return;
                        }
                        qty = parseInt(qtyStr, 10);
                        if (isNaN(qty) || qty < 1 || qty > item.quantity) {
                            showToast("Ungültige Menge", "error");
                            this._cancelInProgress = false;
                            this._cancellingItemKey = null;
                            return;
                        }
                    }

                    let pin = prompt("Bitte Chef-PIN eingeben:");
                    if (pin === null) {
                        this._cancelInProgress = false;
                        this._cancellingItemKey = null;
                        return;
                    }
                    if (!pin.trim()) {
                        showToast("PIN erforderlich", "error");
                        this._cancelInProgress = false;
                        this._cancellingItemKey = null;
                        return;
                    }

                    // ── OPTIMISTIC UI: Item SOFORT aus pending-Array entfernen ──
                    // Vorher wurde nur item.item_status='cancelled' gesetzt, aber das
                    // Template rendert alle Items in pending — das Item blieb sichtbar,
                    // bis fetchAdminDrawerState() (200-500ms später) die Liste ersetzt.
                    // In diesem Zeitfenster hat der Kellner oft "Storno fehlgeschlagen"
                    // gedacht und neu bestellt → DOPPELTE BESTELLUNG.
                    // Jetzt: Item sofort aus Array löschen, Kellner sieht sofort klaren Erfolg.
                    const optimisticKey = item.key;
                    if (item.quantity === qty) {
                        const idx = this.tableOrders.pending.findIndex(i => i.key === optimisticKey);
                        if (idx > -1) this.tableOrders.pending.splice(idx, 1);
                    } else {
                        item.quantity -= qty;
                    }

                    try {
                        const res = await fetch(`/${slug}/tablet/cancel-item/${item.order_id}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ item_key: item.key, quantity: qty, pin: pin })
                        });

                        if (res.ok) {
                            // ── Idempotenz-Flag auswerten ──
                            // Wenn Backend meldet already_cancelled=true, war der
                            // Artikel bereits storniert (Race Condition oder
                            // Doppelklick). Wir zeigen trotzdem Erfolg, damit der
                            // Kellner nicht in Panik eine Zweitbestellung auslöst.
                            const data = await res.json().catch(() => ({}));
                            if (data.already_cancelled) {
                                showToast(`✔️ ${item.name} wurde bereits storniert`, "success");
                            } else {
                                showToast(`✔️ ${qty}x ${item.name} storniert`, "success");
                            }
                            // Storno merken — falls Kellner dasselbe Produkt sofort
                            // neu bestellt, bekommen wir eine Warnung (Anti-Duplikat).
                            if (!this._recentCancellations) this._recentCancellations = [];
                            this._recentCancellations.push({
                                product_id: item.product_id,
                                name: item.name,
                                timestamp: Date.now()
                            });
                            // Ältere als 60s entfernen
                            this._recentCancellations = this._recentCancellations.filter(
                                r => Date.now() - r.timestamp < 60000
                            );
                            // Refresh im Hintergrund — UI ist bereits aktualisiert
                            this.fetchAdminDrawerState();
                        } else if (res.status === 404 || res.status === 400) {
                            // Artikel bereits storniert → nicht als Fehler anzeigen
                            // (sollte dank Backend-Idempotenz kaum noch vorkommen,
                            //  aber als Safety-Net behalten)
                            showToast(`✔️ ${item.name} wurde bereits storniert`, "success");
                            // Defensiv: Item sicher aus pending entfernen
                            const idx2 = this.tableOrders.pending.findIndex(i => i.key === optimisticKey);
                            if (idx2 > -1) this.tableOrders.pending.splice(idx2, 1);
                            this.fetchAdminDrawerState();
                        } else {
                            // Fehler: Item wiederherstellen (rollback optimistic UI)
                            const err = await res.json().catch(() => ({}));
                            showToast(err.detail || "Fehler beim Stornieren", "error");
                            // Rollback: Item wieder ins pending einfügen
                            if (item.quantity === qty) {
                                this.tableOrders.pending.push(item);
                            } else {
                                item.quantity += qty;
                            }
                        }
                    } catch (e) {
                        showToast("Verbindungsfehler beim Stornieren", "error");
                        // Rollback: Item wiederherstellen
                        if (item.quantity === qty) {
                            this.tableOrders.pending.push(item);
                        } else {
                            item.quantity += qty;
                        }
                    } finally {
                        this._cancelInProgress = false;
                        this._cancellingItemKey = null;
                    }
                },

                toggleSplitCheckbox(item) {
                    const idx = this.selectedSplitItems.findIndex(i => i.key === item.key);
                    if (idx > -1) {
                        this.selectedSplitItems.splice(idx, 1);
                    } else {
                        this.selectedSplitItems.push({
                            key: item.key,
                            order_id: item.order_id,
                            product_id: item.product_id,
                            name: item.name,
                            price: item.price,
                            quantity: item.quantity,
                            note: item.note,
                            selectedQty: item.quantity
                        });
                    }
                },

                adjustSplitQty(item, delta) {
                    const found = this.selectedSplitItems.find(i => i.key === item.key);
                    if (found) {
                        const newQty = found.selectedQty + delta;
                        if (newQty >= 1 && newQty <= found.quantity) {
                            found.selectedQty = newQty;
                        }
                    }
                },

                getSplitQty(item) {
                    const found = this.selectedSplitItems.find(i => i.key === item.key);
                    return found ? found.selectedQty : 0;
                },

                get splitTotal() {
                    return this.selectedSplitItems.reduce((sum, item) => sum + item.price * item.selectedQty, 0);
                },

                async submitDrawerPayment(isSplit) {
                    // ── Issue 2.4 Fix: Mutex gegen Mehrfachklicks ──
                    // Verhindert doppelte bezahlen-Requests. Backend-Audit Issue 2.1:
                    // bezahlen ohne Current-Status-Check kann Umsatz doppelt buchen
                    // → Client-Mutex ist hier die primäre Verteidigungslinie.
                    // Dasselbe Flag gilt für Teil- und Gesamtrechnung, damit nicht
                    // beide gleichzeitig feuern können.
                    if (this._drawerPaymentInProgress) return;
                    this._drawerPaymentInProgress = true;
                    try {
                        if (isSplit) {
                            const groups = {};
                            this.selectedSplitItems.forEach(i => {
                                if (!groups[i.order_id]) groups[i.order_id] = [];
                                groups[i.order_id].push(i);
                            });
                            
                            try {
                                const promises = Object.keys(groups).map(orderId => {
                                    const payload = {
                                        items: groups[orderId].map(i => ({
                                            product_id: i.product_id,
                                            quantity: i.selectedQty,
                                            note: i.note || null
                                        }))
                                    };
                                    return fetch(`/${slug}/tablet/teilzahlung/${orderId}`, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify(payload)
                                    });
                                });
                                
                                const results = await Promise.all(promises);
                                if (results.every(r => r.ok)) {
                                    showToast("✔️ Teilzahlung erfolgreich gebucht!", "success");
                                    this.selectedSplitItems = [];
                                    await this.fetchAdminDrawerState();
                                } else {
                                    showToast("Fehler bei der Teilzahlung", "error");
                                    // Issue 2.5 (analog Gesamtrechnung): State
                                    // refreshen, damit der Kellner sieht, welche
                                    // Orders tatsächlich bezahlt wurden — sonst
                                    // klickt er erneut und bucht bereits-bezahlte
                                    // Orders doppelt.
                                    await this.fetchAdminDrawerState();
                                }
                            } catch (e) {
                                showToast("Verbindungsfehler bei Teilzahlung", "error");
                                await this.fetchAdminDrawerState();
                            }
                        } else {
                            const orderIds = [...new Set([
                                ...this.tableOrders.pending.map(i => i.order_id),
                                ...this.tableOrders.delivered.map(i => i.order_id)
                            ])];
                            
                            if (orderIds.length === 0) return;
                            
                            try {
                                const promises = orderIds.map(orderId => {
                                    return fetch(`/${slug}/tablet/bezahlen/${orderId}`, {
                                        method: 'POST'
                                    });
                                });
                                
                                const results = await Promise.all(promises);
                                if (results.every(r => r.ok)) {
                                    showToast("✔️ Tisch vollständig bezahlt!", "success");
                                    this.selectedSplitItems = [];
                                    await this.fetchAdminDrawerState();
                                } else {
                                    showToast("Fehler beim Abschließen der Rechnung", "error");
                                    // ── Issue 2.5 Fix: State zwingend refreshen ──
                                    // Szenario: A+B succeed, C schlägt fehl. Ohne
                                    // Refetch zeigt UI noch alle 3 Orders als offen
                                    // → Kellner klickt erneut "Gesamtrechnung" →
                                    // schickt bezahlen für A, B (bereits bezahlt)
                                    // UND C. Backend-Audit Issue 2.1: bezahlen ohne
                                    // Current-Status-Check bucht Umsatz DOPPELT.
                                    // Refetch sorgt für konsistenten State, so dass
                                    // der Kellner nur C erneut anklicken muss.
                                    await this.fetchAdminDrawerState();
                                }
                            } catch (e) {
                                showToast("Verbindungsfehler bei Zahlung", "error");
                                // Auch bei komplettem Netzwerkfehler State refreshen,
                                // falls einzelne Requests doch durchgekommen sind.
                                await this.fetchAdminDrawerState();
                            }
                        }
                    } finally {
                        this._drawerPaymentInProgress = false;
                    }
                },

                async addToCartAdmin(id, nameDe, nameEn, price, categoryType, btnElement = null) {
                    const tableNum = getTableFromUrl();
                    if (!tableNum) {
                        showToast("Fehler: Kein Tisch ausgewählt.", "error");
                        return;
                    }
                    
                    if (btnElement) {
                        const iconEl = btnElement.querySelector('span.material-symbols-outlined');
                        if (iconEl && iconEl.textContent === "add") {
                            btnElement.classList.remove("bg-primary", "text-black");
                            btnElement.classList.add("bg-green-500", "text-white");
                            iconEl.textContent = "check";
                            btnElement.classList.add("animate-btn-success");
                            
                            setTimeout(() => {
                                iconEl.textContent = "add";
                                btnElement.classList.remove("bg-green-500", "text-white", "animate-btn-success");
                                btnElement.classList.add("bg-primary", "text-black");
                            }, 800);
                        }
                    }
                    
                    try {
                        const res = await fetch('/api/admin/orders/add-manual', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                table_number: tableNum,
                                product_id: id,
                                quantity: 1
                            })
                        });
                        
                        if (res.ok) {
                            const name = this.currentLang === 'en' ? nameEn : nameDe;
                            showToast(`${name} hinzugefügt`, "success");
                            await this.fetchAdminDrawerState();
                        } else {
                            const err = await res.json().catch(() => ({}));
                            showToast(err.detail || "Fehler beim Hinzufügen", "error");
                        }
                    } catch (e) {
                        showToast("Verbindungsfehler beim Hinzufügen", "error");
                    }
                }
            };
        }

        // Category carousel uses swipe gestures instead of chevron buttons
        // scrollCategories and updateCategoryChevrons are no longer needed

        // Initialize default category and check for session reset
        document.addEventListener("DOMContentLoaded", () => {
            const resetSession = {% if reset_session %}true{% else %}false{% endif %};
            if (resetSession) {
                localStorage.removeItem(`dl_orders_{{ slug }}`);
                localStorage.removeItem(`dl_cart_{{ slug }}`);
                localStorage.removeItem('dl_menu_view');
            }
        });
    
</script>
