        // NEU P2.3: PWA "Zum Home Screen" Tipp nur auf iOS Safari anzeigen
        // (nur dort ist ITP ein Problem, das durch PWA-Installation gelöst wird)
        function showToast(message, type = 'info') {
            const container = document.getElementById("toast-container");
            if (!container) return;
            
            const toast = document.createElement("div");
            toast.className = `p-4 rounded-xl shadow-lg backdrop-blur-md transition-all duration-300 transform translate-y-[-20px] opacity-0 flex items-center gap-3 border pointer-events-auto text-xs font-semibold ${
                type === 'success' ? 'bg-green-950/90 border-green-500/30 text-green-300 shadow-[0_4px_20px_rgba(34,197,94,0.15)]' :
                type === 'error' ? 'bg-red-950/90 border-red-500/30 text-red-300 shadow-[0_4px_20px_rgba(239,68,68,0.15)]' :
                'bg-[#1a1a1a]/95 border-[#262626] text-white shadow-[0_4px_20px_rgba(255,255,255,0.05)]'
            }`;
            
            const icon = type === 'success' ? 'check_circle' : type === 'error' ? 'error' : 'info';
            toast.innerHTML = `
                <span class="material-symbols-outlined text-[18px]">${icon}</span>
                <span class="flex-1">${message}</span>
            `;
            
            container.appendChild(toast);
            
            // Trigger transition
            setTimeout(() => {
                toast.classList.remove("translate-y-[-20px]", "opacity-0");
            }, 10);
            
            // Auto remove (2.5s sichtbar + 0.3s Ausblend = 2.8s gesamt)
            setTimeout(() => {
                toast.classList.add("translate-y-[-20px]", "opacity-0");
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 2500);
        }

        function getTableFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const tableNum = urlParams.get('tisch') || urlParams.get('table') || urlParams.get('t') || '';
            const zone = urlParams.get('z') || urlParams.get('zone') || '';
            // If zone is available, return "number (zone)" format for proper zone resolution
            if (tableNum && zone) {
                return tableNum + ' (' + zone + ')';
            }
            return tableNum;
        }

        // ═══════════════════════════════════════════════════════════════
        // MARKDOWN RENDERER für Custom Sections
        // Unterstützt: **fett**, *kursiv*, ## Überschrift, ### Unter-Überschrift,
        // {gold}Text{/gold}, {white}Text{/white}, {red}Text{/red}, {green}Text{/green},
        // --- (Trennlinie), Listen mit - oder *
        // ═══════════════════════════════════════════════════════════════
        window.renderMarkdown = function(text) {
            if (!text) return '';
            let html = text;

            // XSS-Schutz: HTML-Tags escapen
            html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // Farben: {gold}Text{/gold} etc.
            html = html.replace(/\{gold\}([\s\S]*?)\{\/gold\}/gi, '<span style="color:#C9A84C;font-weight:700;">$1</span>');
            html = html.replace(/\{white\}([\s\S]*?)\{\/white\}/gi, '<span style="color:#ffffff;font-weight:700;">$1</span>');
            html = html.replace(/\{red\}([\s\S]*?)\{\/red\}/gi, '<span style="color:#ef4444;font-weight:700;">$1</span>');
            html = html.replace(/\{green\}([\s\S]*?)\{\/green\}/gi, '<span style="color:#22c55e;font-weight:700;">$1</span>');
            html = html.replace(/\{blue\}([\s\S]*?)\{\/blue\}/gi, '<span style="color:#3b82f6;font-weight:700;">$1</span>');

            // Überschriften (vor fett/kursiv, sonst passiert das im Heading)
            html = html.replace(/^### (.+)$/gm, '<h4 class="lp-md-h4">$1</h4>');
            html = html.replace(/^## (.+)$/gm, '<h3 class="lp-md-h3">$1</h3>');

            // Trennlinie
            html = html.replace(/^---$/gm, '<hr class="lp-md-hr">');

            // Fett und kursiv
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

            // Listen (- oder * am Zeilenanfang)
            html = html.replace(/(?:^|\n)((?:[-*] .+(?:\n|$))+)/g, function(match, listBlock) {
                const items = listBlock.trim().split('\n').map(line => {
                    return '<li>' + line.replace(/^[-*] /, '') + '</li>';
                }).join('');
                return '\n<ul class="lp-md-list">' + items + '</ul>';
            });

            // Zeilenumbrüche (aber nicht innerhalb von HTML-Tags)
            html = html.replace(/\n/g, '<br>\n');

            // Doppelt <br> nach Block-Elementen entfernen
            html = html.replace(/(<\/h[34]>)<br>\n/g, '$1\n');
            html = html.replace(/(<\/ul>)<br>\n/g, '$1\n');
            html = html.replace(/(<hr class="lp-md-hr">)<br>\n/g, '$1\n');
            html = html.replace(/<br>\n(<h[34])/g, '\n$1');
            html = html.replace(/<br>\n(<ul)/g, '\n$1');
            html = html.replace(/<br>\n(<hr)/g, '\n$1');

            return html;
        };

        function menuState() {
            return {
                cart: (() => {
                    try {
                        const saved = localStorage.getItem('dl_cart_{{ slug }}');
                        if (saved) return JSON.parse(saved);
                    } catch(e) {}
                    return [];
                })(),
                // Debounce / Button-Sperre für submitOrder() — verhindert, dass
                // schnelles Mehrfachklicken ("200-Artikel-Bug") mehrere Requests
                // gleichzeitig abschickt. Siehe submitOrder() weiter unten.
                isSubmitting: false,
                // ── Storno-UI-State ──
                // _cancelInProgress: verhindert Mehrfach-Klicks auf Storno-Button
                // _cancellingItemKey: Item.key, das gerade storniert wird → Spinner + disabled
                // _recentCancellations: letzte 60s Stornos → Anti-Duplikat-Warnung bei Neu-Bestellung
                _cancelInProgress: false,
                _cancellingItemKey: null,
                _recentCancellations: [],
                // ── Serve-/Pay-UI-State (Mutex) ──
                // Issue 2.4: Dient der Race-Condition-Abwehr bei Mehrfachklicks auf
                // Serve-/Pay-Buttons. Backend-Audit Issue 1.3 (/admin/orders/serve ohne
                // tenant_lock) und Issue 2.1 (bezahlen ohne Current-Status-Check) machen
                // den Client-Schutz hier zur primären Verteidigungslinie gegen doppelte
                // Umsatzbuchung.
                _serveInProgress: false,
                _serveAllInProgress: false,
                _drawerPaymentInProgress: false,
                currentLang: 'de',
                activeFilters: { vegan: false, glutenfree: false },
                currentCategory: '',
                _savedCategoryScrollPos: 0,
                _lastClickedCategoryName: '', // Kategorie-Name statt DOM-Ref (überlebt Reload)
                allCategories: {{ restaurant.categories | tojson | safe }},
                // NEU: category_data mit Extras für Infokacheln
                categoryData: {{ restaurant.category_data | tojson if restaurant.category_data else '[]' }},
                currentOfferIdx: 0,
                currentBgVideoIdx: 0,
                prevOfferSlide() {
                    const len = this.restaurantLandingPage.offer_images ? this.restaurantLandingPage.offer_images.length : 0;
                    if (len <= 1) return;
                    this.currentOfferIdx = (this.currentOfferIdx - 1 + len) % len;
                    this.updateOfferSlider();
                },
                nextOfferSlide() {
                    const len = this.restaurantLandingPage.offer_images ? this.restaurantLandingPage.offer_images.length : 0;
                    if (len <= 1) return;
                    this.currentOfferIdx = (this.currentOfferIdx + 1) % len;
                    this.updateOfferSlider();
                },
                updateOfferSlider() {
                    const slider = document.getElementById('offer-slider');
                    if (slider) {
                        slider.style.transform = `translateX(-${this.currentOfferIdx * 100}%)`;
                    }
                },
                openLightbox(src) {
                    const lb = document.getElementById('lightbox');
                    const lbImg = document.getElementById('lightbox-img');
                    if (lb && lbImg) {
                        lbImg.src = src;
                        lb.classList.remove('hidden');
                        lb.classList.add('flex');
                        document.body.style.overflow = 'hidden';
                        setTimeout(() => {
                            lb.classList.remove('opacity-0', 'pointer-events-none');
                            lb.classList.add('opacity-100');
                        }, 10);
                    }
                },
                closeLightbox() {
                    const lb = document.getElementById('lightbox');
                    if (lb) {
                        lb.classList.remove('opacity-100');
                        lb.classList.add('opacity-0', 'pointer-events-none');
                        setTimeout(() => {
                            lb.classList.remove('flex');
                            lb.classList.add('hidden');
                            document.body.style.overflow = '';
                        }, 300);
                    }
                },

                    _serviceCooldownLabel: '', // display text for remaining time
                    _serviceCooldownInterval: null, // interval timer

                    const params = new URLSearchParams(window.location.search);
                    const role = params.get('role');
                    if (role === 'waiter' || role === 'admin') return 'speisekarte';
                    // Check hash first, then localStorage, then default to landing
                    const hash = window.location.hash.replace('#', '');
                    if (hash === 'speisekarte' || hash === 'landing') return hash;
                    const saved = localStorage.getItem('dl_menu_view');
                    if (saved === 'speisekarte' || saved === 'landing') return saved;
                    return 'landing';
                })(),

                init() {
                    // Expose functions on the window object for 100% legacy/DOM event compatibility
                    window.addToCart = (id, nameDe, nameEn, price, categoryType, btnElement) => this.addToCart(id, nameDe, nameEn, price, categoryType, btnElement);
                    window.addComboToCart = (comboId, comboName, comboPrice, itemsData) => this.addComboToCart(comboId, comboName, comboPrice, itemsData);
                    window.openCartModal = () => this.openCartModal();
                    window.closeCartModal = () => this.closeCartModal();
                    window.openServiceModal = () => this.openServiceModal();
                    window.closeServiceModal = () => this.closeServiceModal();
                    window.openPaymentModal = () => this.openPaymentModal();
                    window.closePaymentModal = () => this.closePaymentModal();
                    window.requestService = (type) => this.requestService(type);
                    window.openLegalModal = (type) => this.openLegalModal(type);
                    window.closeLegalModal = () => this.closeLegalModal();
                    window.setLanguage = (lang) => this.setLanguage(lang);
                    window.toggleDietaryFilter = (type) => this.toggleDietaryFilter(type);
                    window.filterCategory = (cat) => this.filterCategory(cat);
                    window.backToCategories = () => this.backToCategories();
                    window.submitOrder = () => this.submitOrder();
                    window.closeThankYou = () => this.closeThankYou();
                    window.selectServiceOption = (type) => this.selectServiceOption(type);
                    window.confirmServiceRequest = () => this.confirmServiceRequest();
                    window.selectPaymentOption = (type) => this.selectPaymentOption(type);
                    window.confirmPaymentRequest = () => this.confirmPaymentRequest();
                    window.showReviewPopup = (url) => this.showReviewPopup(url);

                    // ── UPSPELLING: Produkte mit related_product_ids für Client-seitige Berechnung laden ──
                    // Wird im upsellSuggestions Getter verwendet um "Passende Extras" zu berechnen
                    window._productsData = {{ products | tojson }};
                    // Layer 3: Data-Driven Co-Occurrence Matrix aus bezahlten Bestellungen
                    // "Kunden die X kauften, kauften auch Y" — wird vom Backend berechnet
                    window._upsellCooccurrences = {{ upsell_cooccurrences | tojson }};

                    // Sync currentView to hash + localStorage on init
                    this.$watch('currentView', (val) => {
                        history.replaceState(null, '', '#' + val);
                        localStorage.setItem('dl_menu_view', val);
                    });
                    // Sync cart to localStorage
                    this.$watch('cart', (val) => {
                        localStorage.setItem('dl_cart_{{ slug }}', JSON.stringify(val));
                    }, { deep: true });
                    // Set initial hash if not already set
                    if (!window.location.hash || (window.location.hash !== '#speisekarte' && window.location.hash !== '#landing')) {
                        history.replaceState(null, '', '#' + this.currentView);
                    }

                    const resetSession = {% if reset_session %}true{% else %}false{% endif %};
                    if (resetSession) {
                        localStorage.removeItem(`dl_orders_{{ slug }}`);
                        localStorage.removeItem(`dl_cart_{{ slug }}`);
                        localStorage.removeItem('dl_menu_view');
                        this.cart = [];
                        // Always start on welcome page after QR scan
                        this.currentView = 'landing';
                    }
                    
                    // Start with category list view (currentCategory = '')
                    // ABER: letzte Kategorie aus localStorage wiederherstellen falls vorhanden
                    try {
                        const lastCat = localStorage.getItem('dl_last_category_{{ slug }}');
                        if (lastCat) {
                            // Verzögert ausführen damit DOM bereit ist
                            setTimeout(() => {
                                this.filterCategory(lastCat, false);
                            }, 300);
                        }
                    } catch(e) {}

                    const isReadonly = {% if is_readonly %}true{% else %}false{% endif %};
                    if (!isReadonly) {
                        if (document.readyState === "complete") {
                            setTimeout(() => this.initGuestWebSocket(), 1000);
                        } else {
                            window.addEventListener("load", () => {
                                setTimeout(() => this.initGuestWebSocket(), 1000);
                            });
                        }
                    }

                    if (this.role === 'admin') {
                        this.fetchAdminDrawerState();
                    } else {
                        if (!isReadonly) {
                            this.fetchGuestTableStatus();
                        }
                    }

                    // Background slideshow cycle (supports both images and videos)
                    const slideshowEnabled = {% if restaurant.landing_page and restaurant.landing_page.slideshow_enabled %}true{% else %}false{% endif %};
                    const slideshowImages = {{ (restaurant.landing_page.slideshow_images or []) | tojson | safe }};
                    const slideshowVideos = {{ (restaurant.landing_page.slideshow_videos or []) | tojson | safe }};
                    
                    if (slideshowEnabled) {
                        // Cycle through background videos if they exist
                        // Phase 16 P2-Fix: setInterval in Variable speichern, damit es
                        // bei Bedarf (z.B. Page-Hide) gestoppt werden kann.
                        if (slideshowVideos.length > 1) {
                            this._slideshowVideoInterval = setInterval(() => {
                                if (this.currentView !== 'landing') return;
                                this.currentBgVideoIdx = (this.currentBgVideoIdx + 1) % slideshowVideos.length;
                            }, 8000);
                        }
                        
                        // Cycle through background images if they exist
                        if (slideshowImages.length > 1) {
                            let currentSlideIdx = 0;
                            const layer1 = document.getElementById('slide-layer-1');
                            const layer2 = document.getElementById('slide-layer-2');
                            
                            if (layer1 && layer2) {
                                this._slideshowImageInterval = setInterval(() => {
                                    if (this.currentView !== 'landing') return;
                                    
                                    const nextSlideIdx = (currentSlideIdx + 1) % slideshowImages.length;
                                    const nextUrl = slideshowImages[nextSlideIdx];
                                    
                                    const isLayer1Active = layer1.classList.contains('opacity-100');
                                    const activeLayer = isLayer1Active ? layer1 : layer2;
                                    const inactiveLayer = isLayer1Active ? layer2 : layer1;
                                    
                                    inactiveLayer.style.backgroundImage = `url('${nextUrl}')`;
                                    
                                    activeLayer.classList.remove('opacity-100');
                                    activeLayer.classList.add('opacity-0');
                                    inactiveLayer.classList.remove('opacity-0');
                                    inactiveLayer.classList.add('opacity-100');
                                    
                                    currentSlideIdx = nextSlideIdx;
                                }, 6000);
                            }
                        }
                        // Phase 16 P2: Slideshow-Intervals bei Page-Hide stoppen
                        // (verhindert CPU-Last im Hintergrund, wichtig für Mobile-Batterie)
                        document.addEventListener('pagehide', () => {
                            if (this._slideshowVideoInterval) clearInterval(this._slideshowVideoInterval);
                            if (this._slideshowImageInterval) clearInterval(this._slideshowImageInterval);
                        });
                        document.addEventListener('visibilitychange', () => {
                            if (document.hidden) {
                                if (this._slideshowVideoInterval) clearInterval(this._slideshowVideoInterval);
                                if (this._slideshowImageInterval) clearInterval(this._slideshowImageInterval);
                            }
                        });
                    }
                },

                initGuestWebSocket() {
                    const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                    const wsUrl = `${protocol}//${window.location.host}/ws/{{ slug }}`;
                    
                    console.log("Guest connecting to WebSocket...");
                    const ws = new WebSocket(wsUrl);
                    this.guestWs = ws;
                    
                    let pongReceived = true;
                    
                    ws.onopen = () => {
                        console.log("Guest WebSocket connected!");
                        pongReceived = true;
                        
                        // Stop fallback polling — WS is working
                        this.stopGuestFallbackPolling();
                        
                        if (this.guestWsHeartbeatInterval) clearInterval(this.guestWsHeartbeatInterval);
                        this.guestWsHeartbeatInterval = setInterval(() => {
                            if (!pongReceived) {
                                console.warn("Guest WebSocket heartbeat timeout. Closing connection...");
                                ws.close();
                                return;
                            }
                            pongReceived = false;
                            if (ws.readyState === WebSocket.OPEN) {
                                ws.send(JSON.stringify({ type: "ping" }));
                            }
                        }, 15000);
                    };
                    
                    ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            if (data.type === "pong") {
                                pongReceived = true;
                            } else if (data.type === "new_order" || data.type === "service_call" || data.type === "update" || data.type === "refresh_tables") {
                                if (this.role === 'admin') {
                                    this.fetchAdminDrawerState();
                                } else {
                                    this.fetchGuestTableStatus();
                                }

                                // Update product details (prices, availability, happy hour) using lightweight API
                                // instead of full page fetch (~2KB vs ~200KB, ~50ms vs ~500ms)
                                this.refreshProductDataLite();

                                // Check if guest session is still active
                                fetch("/api/{{ slug }}/check-session")
                                    .then(res => res.json())
                                    .then(sessionData => {
                                        if (sessionData && sessionData.active === false) {
                                            console.warn("Session expired! Redirecting...");
                                            window.location.href = "/{{ slug }}/sitz-expired";
                                        }
                                    })
                                    .catch(err => console.error("Error checking session:", err));
                            }
                        } catch (e) {
                            console.error("Failed to parse websocket message:", e);
                        }
                    };

                    ws.onclose = (event) => {
                        console.warn("Guest WebSocket closed.", event.code, event.reason);
                        this.guestWs = null;
                        if (this.guestWsHeartbeatInterval) {
                            clearInterval(this.guestWsHeartbeatInterval);
                            this.guestWsHeartbeatInterval = null;
                        }
                        // 4401 = Unauthorized (session expired / invalid) – don't reconnect
                        if (event.code === 4401) {
                            console.warn("Guest WebSocket: Unauthorized. Not reconnecting.");
                            return;
                        }
                        // Start fallback polling while disconnected
                        this.startGuestFallbackPolling();
                        // Reconnect after 5 seconds for other close reasons
                        setTimeout(() => this.initGuestWebSocket(), 5000);
                    };

                    ws.onerror = (err) => {
                        console.error("Guest WebSocket error:", err);
                        ws.close();
                    };
                },

                // Fallback polling when WebSocket is disconnected
                guestFallbackInterval: null,
                startGuestFallbackPolling() {
                    if (this.guestFallbackInterval) return; // already running
                    console.log("Starting guest fallback polling (30s interval)...");
                    this.guestFallbackInterval = setInterval(() => {
                        // If WS is connected, stop polling
                        if (this.guestWs && this.guestWs.readyState === WebSocket.OPEN) {
                            this.stopGuestFallbackPolling();
                            return;
                        }
                        // Poll for order status
                        this.fetchGuestTableStatus();
                    }, 30000);
                },
                stopGuestFallbackPolling() {
                    if (this.guestFallbackInterval) {
                        clearInterval(this.guestFallbackInterval);
                        this.guestFallbackInterval = null;
                        console.log("Guest fallback polling stopped.");
                    }
                },

                get cartTotal() {
                    return this.cart.reduce((acc, i) => acc + ((i.price || 0) * (i.quantity || 0)), 0);
                },

                get cartCount() {
                    return this.cart.reduce((acc, i) => acc + i.quantity, 0);
                },

                // ── UPSPELLING: Berechnet "Passende Extras" basierend auf Warenkorb ──
                // Layer 1: related_product_ids (manuelle Verknüpfungen vom Admin) — Score +3
                // Layer 2: Auto-Rules basierend auf category_type (z.B. Shisha → Kohle) — Score +1-2
                // Layer 3: Data-Driven Co-Occurrence aus Bestellungen — Score +1-5
                // WICHTIG: Cart-Items nutzen 'id' als Property (nicht 'product_id')!
                // Filter: Produkte die schon im Warenkorb sind werden ausgeblendet (keine Überlappung)
                // Limit: Top 3 Vorschläge
                get upsellSuggestions() {
                    if (!this.cart || this.cart.length === 0) return [];
                    if (!window._productsData || window._productsData.length === 0) return [];

                    // Cart-Items haben 'id' als Property (siehe addToCart: cart.push({ id, ... }))
                    const cartProductIds = new Set(this.cart.map(i => i.id || i.product_id));
                    const suggestionScores = {}; // {product_id: score}

                    // Layer 1: Manual related products
                    this.cart.forEach(cartItem => {
                        const productId = cartItem.id || cartItem.product_id;
                        const product = window._productsData.find(p => p.id === productId);
                        if (!product) return;
                        const relatedIds = product.related_product_ids || [];
                        relatedIds.forEach(rid => {
                            if (!cartProductIds.has(rid)) {
                                suggestionScores[rid] = (suggestionScores[rid] || 0) + 3;
                            }
                        });
                    });

                    // Layer 2: Auto-rules based on category_type
                    const cartCategoryTypes = new Set();
                    this.cart.forEach(cartItem => {
                        const productId = cartItem.id || cartItem.product_id;
                        const product = window._productsData.find(p => p.id === productId);
                        if (product) {
                            cartCategoryTypes.add(product.category_type || 'küche');
                        }
                    });

                    const autoRules = {
                        'shisha': (p) => {
                            const name = (p.name || '').toLowerCase();
                            if (name.includes('kohle') || name.includes('head') || name.includes('kopf') || name.includes('zubehör')) return 2;
                            return 0;
                        },
                        'küche': (p) => {
                            const name = (p.name || '').toLowerCase();
                            const cat = (p.category || '').toLowerCase();
                            if (name.includes('pommes') || name.includes('fries') || name.includes('beilage') || cat.includes('beilage')) return 2;
                            if (p.category_type === 'bar') return 1;
                            return 0;
                        },
                        'bar': (p) => {
                            const cat = (p.category || '').toLowerCase();
                            if (cat.includes('snack') || cat.includes('klein')) return 1;
                            return 0;
                        }
                    };

                    window._productsData.forEach(product => {
                        if (!product.is_available) return;
                        if (cartProductIds.has(product.id)) return;
                        let score = suggestionScores[product.id] || 0;
                        cartCategoryTypes.forEach(ct => {
                            if (autoRules[ct]) {
                                score += autoRules[ct](product) || 0;
                            }
                        });
                        if (score > 0) {
                            suggestionScores[product.id] = score;
                        }
                    });

                    // Layer 3: Data-Driven Co-Occurrence ("Kunden die X kauften, kauften auch Y")
                    if (window._upsellCooccurrences) {
                        this.cart.forEach(cartItem => {
                            const productId = cartItem.id || cartItem.product_id;
                            const partners = window._upsellCooccurrences[productId];
                            if (!partners) return;
                            partners.forEach(partner => {
                                const pid = partner.id;
                                const count = partner.count;
                                if (!cartProductIds.has(pid)) {
                                    const dataScore = Math.min(count, 5);
                                    suggestionScores[pid] = (suggestionScores[pid] || 0) + dataScore;
                                }
                            });
                        });
                    }

                    // Sortiere nach Score (absteigend), nehme top 3
                    return Object.entries(suggestionScores)
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 3)
                        .map(([pid]) => window._productsData.find(p => p.id === parseInt(pid)))
                        .filter(p => p); // Filter out undefined
                },

                // Upsell-Item zum Warenkorb hinzufügen
                addUpsellItem(product) {
                    if (!product) return;
                    // CRITICAL FIX: Vorher wurde this.addToCart(product) aufgerufen.
                    // addToCart erwartet aber (id, nameDe, nameEn, price, categoryType, btnElement).
                    // → product-Objekt wurde als 'id' interpretiert → name undefined → leer im Warenkorb!
                    // Jetzt: korrekte Argumente übergeben.
                    const nameDe = product.name || product.name_de || '';
                    const nameEn = product.name_en || nameDe;
                    const price = product.display_price || product.price || 0;
                    const categoryType = product.category_type || 'küche';
                    this.addToCart(product.id, nameDe, nameEn, price, categoryType, null);
                    showToast('"' + nameDe + '" hinzugefügt!', 'success');
                },

                    this.currentCategory = category;

                    try {

                        } else {

                    } catch(e) {}

                    const products = document.querySelectorAll('.product-item');
                    products.forEach(item => {

                    // Back-Button Position neu berechnen, da er jetzt sichtbar wird.
                    // WICHTIG: iOS Safari ändert die Header-Höhe je nach Notch/Safe-Area.
                    // Ohne diesen Aufruf könnte der Button mit dem Logo überlappen.
                    if (typeof adjustBackButtonTop === 'function') {
                        this.$nextTick(() => {
                            adjustBackButtonTop();
                            // Zweiter Aufruf nach kurzer Verzögerung für späte Layout-Shifts
                            setTimeout(adjustBackButtonTop, 50);
                        });
                    }

                    // Scroll to top AFTER Alpine.js has updated the DOM (only on user click, not on WS re-apply)
                    // WICHTIG: iOS-26 Workaround macht body zum Scroll-Container, nicht html!
                    // document.scrollingElement gibt html zurück (overflow:hidden) → scrollTop ist No-Op.
                    // Lösung: Dynamisch prüfen welches Element scrollt.
                    if (isUserAction) {
                        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
                        const scrollEl = (getComputedStyle(document.body).overflowY === 'auto' && getComputedStyle(document.documentElement).overflowY === 'hidden') ? document.body : (document.scrollingElement || document.documentElement);
                        this.$nextTick(() => {
                            setTimeout(() => { scrollEl.scrollTop = 0; }, 50);

                        });

                addComboToCart(comboId, comboName, comboPrice, itemsData) {
                    // itemsData kann ein JSON-String (combo items) oder comma-separated product IDs sein
                    let items = [];
                    if (typeof itemsData === 'string') {
                        try {
                            items = JSON.parse(itemsData);
                        } catch (e) {
                            // Fallback: alte comma-separated Format
                            const productIds = itemsData.split(',').map(Number).filter(Boolean);
                            items = productIds.map(pid => ({ product_id: pid }));
                        }
                    } else if (Array.isArray(itemsData)) {
                        items = itemsData;
                    }
                    
                    if (items.length === 0) return;
                    
                    // NEUE LOGIK: Gruppiere Items nach category_name
                    // - Items mit product_id UND category_name = einzelne Produkte in einer Gruppe (Kunde wählt 1)
                    // - Items mit nur category_name (product_id=null) = ganze Kategorie (Kunde wählt 1)
                    // - Items mit nur product_id (category_name=null) = feste Produkte (alle in Warenkorb)
                    
                    const allProducts = window._productsData || [];
                    
                    // Gruppe 1: Feste Produkte (ohne category_name) → alle in Warenkorb
                    const fixedItems = items.filter(i => i.product_id && !i.category_name);
                    
                    // Gruppe 2: Produkte mit category_name → nach Kategorie gruppieren, Kunde wählt 1 pro Gruppe
                    const groupedItems = items.filter(i => i.category_name);
                    
                    // Gruppiere nach category_name
                    const groups = {};
                    // Sammle erst alle individuellen product_ids pro Kategorie
                    const individualProductIdsByCat = {};
                    for (const item of groupedItems) {
                        const cat = item.category_name;
                        if (item.product_id) {
                            if (!individualProductIdsByCat[cat]) individualProductIdsByCat[cat] = [];
                            individualProductIdsByCat[cat].push(item.product_id);
                        }
                    }
                    
                    for (const item of groupedItems) {
                        const cat = item.category_name;
                        if (!groups[cat]) groups[cat] = [];
                        if (item.product_id) {
                            // Einzelnes Produkt in Gruppe
                            const p = allProducts.find(x => x.id === item.product_id);
                            if (p) groups[cat].push(p);
                        } else {
                            // Ganze Kategorie → aber NUR wenn keine einzelnen Produkte
                            // für diese Kategorie ausgewählt wurden!
                            if (!individualProductIdsByCat[cat] || individualProductIdsByCat[cat].length === 0) {
                                const catProducts = allProducts.filter(p => p.category === cat && p.is_available !== false);
                                groups[cat] = groups[cat].concat(catProducts);
                            }
                            // Wenn einzelne Produkte existieren, ignoriere die Kategorie-Auswahl
                            // → nur die einzelnen Produkte sind in der Gruppe
                        }
                    }
                    
                    // Wenn es Gruppen gibt → Picker Modal öffnen
                    const groupCount = Object.keys(groups).length;
                    if (groupCount > 0) {
                        this.openComboPickerModal(comboId, comboName, comboPrice, fixedItems, groups);
                        return;
                    }
                    
                    // Nur feste Produkte: direkt in den Warenkorb
                    this._addComboItemsToCart(comboId, comboName, comboPrice, fixedItems.map(i => i.product_id));
                },

                    if (confirmBtn) {
                        confirmBtn.onclick = () => {

                _addComboItemsToCart(comboId, comboName, comboPrice, productIds) {
                    // Verwende window._productsData (bereits in init() gesetzt)
                    const _allProds = window._productsData || [];
                    // BUG FIX: display_price statt price nutzen — sonst werden
                    // Event-Preise ignoriert und Kombi-Preisverteilung ist falsch
                    const allProducts = _allProds.map(p => p.display_price || p.price);
                    const allProductIds = _allProds.map(p => p.id);
                    const allProductNames = _allProds.map(p => p.name);
                    const allProductNamesEn = _allProds.map(p => p.name_en || p.name);
                    const allProductCategoryTypes = _allProds.map(p => p.category_type || 'küche');
                    
                    let individualTotal = 0;
                    const comboProducts = [];
                    for (const pid of productIds) {
                        const idx = allProductIds.indexOf(pid);
                        if (idx >= 0) {
                            const p = { id: pid, price: allProducts[idx], name: allProductNames[idx], name_en: allProductNamesEn[idx] || allProductNames[idx], category_type: allProductCategoryTypes[idx] || 'küche' };
                            individualTotal += p.price;
                            comboProducts.push(p);
                        }
                    }
                    
                    if (comboProducts.length === 0) return;
                    
                    // BUG FIX: combo_instance_id — eindeutige ID pro Kombi-Bestellung
                    // Problem: 2× dieselbe Kombi bestellt → beide haben combo_id=3
                    // → Teilzahlung toggelt ALLE Items mit combo_id=3 (beide Kombis)
                    // Lösung: combo_instance_id macht jede Kombi-Bestellung eindeutig
                    // → Teilzahlung toggelt nur Items mit gleicher combo_instance_id
                    // WICHTIG: Keine Unterstriche in combo_instance_id (sonst zerstört
                    // parse_item_key das split('_') im Backend). Wir nutzen '-' als Separator.
                    const comboInstanceId = comboId + '-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                    
                    // FIX: Proportionale Preisverteilung mit Rest-Korrektur
                    // Verhindert 16.98€ statt 17.00€ durch Rundungsfehler
                    let distributedTotal = 0;
                    const adjustedPrices = [];
                    for (let i = 0; i < comboProducts.length; i++) {
                        const p = comboProducts[i];
                        const proportion = p.price / individualTotal;
                        let adjustedPrice = Math.round(comboPrice * proportion * 100) / 100;
                        adjustedPrices.push(adjustedPrice);
                        distributedTotal += adjustedPrice;
                    }
                    // Letztes Produkt bekommt den Rest (korrigiert Rundungsfehler)
                    const remainder = Math.round((comboPrice - distributedTotal) * 100) / 100;
                    if (adjustedPrices.length > 0) {
                        adjustedPrices[adjustedPrices.length - 1] = Math.round((adjustedPrices[adjustedPrices.length - 1] + remainder) * 100) / 100;
                    }
                    
                    for (let i = 0; i < comboProducts.length; i++) {
                        const p = comboProducts[i];
                        const adjustedPrice = adjustedPrices[i];
                        
                        const newCartId = p.id + '_combo_' + comboId + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                        this.cart.push({
                            cart_id: newCartId,
                            id: p.id,
                            name: p.name + ' (Kombi)',
                            name_de: p.name + ' (Kombi)',
                            name_en: (p.name_en || p.name) + ' (Combo)',
                            price: adjustedPrice,
                            quantity: 1,
                            category_type: p.category_type,
                            note: null,
                            is_combo: true,
                            combo_id: comboId,
                            // BUG FIX: combo_instance_id für eindeutige Kombi-Zuordnung
                            // bei Teilzahlung (sonst werden 2 gleiche Kombis zusammen getoggelt)
                            combo_instance_id: comboInstanceId,
                            // OPTION A: combo_name speichern — Admin/Bon kann Items
                            // mit gleicher combo_id + combo_name zu einer Zeile gruppieren
                            // Format: "Kombi: Shisha + Cola" (wird im Bon-Detail angezeigt)
                            combo_name: comboName,
                            // Sub-Items Info für Cart-Display (nur client-seitig)
                            combo_items: comboProducts.map(cp => cp.name)
                        });
                    }
                    
                    const addedMsg = translations[this.currentLang].toast_added || "hinzugefügt";
                    showToast(comboName + " " + addedMsg, "success");

                    const floatingBar = document.getElementById("cart-floating-bar");
                    if (floatingBar) {
                        floatingBar.classList.remove("animate-cart-pulse");
                        void floatingBar.offsetWidth;
                        floatingBar.classList.add("animate-cart-pulse");
                    }
                    
                    const cartBadge = document.getElementById("cart-badge");
                    if (cartBadge) {
                        cartBadge.classList.remove("animate-badge-pulse");
                        void cartBadge.offsetWidth;
                        cartBadge.classList.add("animate-badge-pulse");
                    }
                },

                changeQty(cartId, delta) {
                    const item = this.cart.find(i => i.cart_id === cartId);
                    if (item) {
                        // FIX: Combo-Items dürfen nicht erhöht werden (Preis-Manipulation)
                        if (delta > 0 && item.combo_id) return;
                        // BUG FIX: Combo-Items dürfen nicht einzeln verringert/gelöscht werden!
                        // Vorher: Kunde konnte Cola löschen → Shisha für 13,78€ statt 17€
                        // Jetzt: Bei delta<0 und combo_id → GANZE Kombi löschen (alle Items
                        // mit gleicher combo_instance_id)
                        if (delta < 0 && item.combo_id && item.combo_instance_id) {
                            this.cart = this.cart.filter(i =>
                                i.combo_instance_id !== item.combo_instance_id
                            );
                            return;
                        }
                        item.quantity += delta;
                        if (item.quantity <= 0) {
                            this.cart = this.cart.filter(i => i.cart_id !== cartId);
                        }
                    }
                },

                sendServiceRequestAPI(type) {
                    const rawTable = getTableFromUrl() || "{{ table }}";
                    const token = '{{ token }}' || '';
                    // Normalize: strip any existing "Tisch" prefix to avoid double "Tisch Tisch"
                    const cleanTable = String(rawTable).replace(/^Tisch\s*/i, '').trim();

                    const payload = {
                        type: type,
                        table: cleanTable,
                        token: token,
                    };

                    fetch('/api/{{ slug }}/call-service?token=' + encodeURIComponent(token), {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'X-Token': token
                        },
                        body: JSON.stringify(payload)
                    })
                    .then(res => {
                        if (res.ok) {
                            showToast("Anfrage erfolgreich an das Personal gesendet!", "success");
                        } else {
                            showToast("Übertragung fehlgeschlagen.", "error");
                        }
                    })
                    .catch(err => {
                        console.error("Fehler bei Service-Ruf", err);
                        showToast("Übertragungsfehler.", "error");
                    });
                },

                submitOrder() {
                    // ── DEBOUNCE / BUTTON-SPERRE ──
                    // Verhindert den "200-Artikel-Bug": wenn ein Kunde mehrfach
                    // schnell auf "Jetzt bestellen" klickt (z.B. weil die Seite
                    // kurz hängt), werden ohne diesen Schutz 20 Requests fast
                    // gleichzeitig abgefeuert. Das Backend merged alle in EINE
                    // Bestellung → eine einzige Bestellung mit 200+ Items.
                    // Mit diesem Guard wird der zweite Klick ignoriert, bis der
                    // erste Request fertig ist.
                    if (this.isSubmitting) {
                        console.log("submitOrder() bereits laufend — Klick ignoriert (Debounce).");
                        return;
                    }
                    if (!this.cart || this.cart.length === 0) {
                        showToast("Warenkorb ist leer.", "error");
                        return;
                    }

                    // ── ANTI-DUPLIKAT-SCHUTZ ──
                    // Szenario: Kellner storniert ein Produkt → sieht es wegen UI-Bug
                    // noch im Cockpit → denkt "Storno fehlgeschlagen" → bestellt neu.
                    // Resultat: DOPPELTE BESTELLUNG (Kunde hat einmal bestellt, System
                    // verbucht zweimal). Falls ein Produkt im Warenkorb ist, das in
                    // den letzten 60 Sekunden storniert wurde → Warnung mit Bestätigung.
                    //
                    // ── Issue 2.1 Fix: 60s-Zeitfilter beim Lesen ──
                    // Vor dem Lesen Cache auf Einträge < 60s filtern. Ohne diesen Filter
                    // gäbe es false-positive Warnungen nach 5 min (Kellner gewöhnt sich
                    // dran → ignoriert echte Warnung irgendwann → Schutz wirktlos).
                    this._recentCancellations = (this._recentCancellations || []).filter(
                        r => Date.now() - r.timestamp < 60000
                    );
                    // pendingPruneIds wird erst nach *erfolgreichem* fetch in den
                    // _recentCancellations-Cache zurückgeschrieben (siehe .then()-Pfad
                    // weiter unten). Issue 2.2 Fix: Cache vor dem fetch NICHT leeren,
                    // damit bei Netzwerkfehler der Retry erneut warnen kann.
                    let pendingPruneIds = null;
                    if (this._recentCancellations.length > 0) {
                        const recentProductIds = this._recentCancellations.map(r => r.product_id);
                        const duplicateItems = this.cart.filter(c => recentProductIds.includes(c.id));
                        if (duplicateItems.length > 0) {
                            const names = [...new Set(duplicateItems.map(d => d.name_de || d.name))].join(', ');
                            const confirmed = confirm(
                                `⚠️ Hinweis: Sie haben gerade folgende Artikel storniert:\n\n${names}\n\n` +
                                `Möchten Sie diese wirklich neu bestellen? ` +
                                `(Bestätigen Sie nur, wenn der Kunde tatsächlich nochmal bestellen möchte.)`
                            );
                            if (!confirmed) return;
                            // Issue 2.2 Fix: Cache-Einträge erst nach erfolgreichem
                            // fetch löschen (siehe unten im .then()-Erfolgspfad).
                            // Vorheriges Löschen führte bei Netzwerkfehlern dazu,
                            // dass der Cache leer war → beim Retry keine Warnung →
                            // mögliches Anti-Duplikat-Versagen (Doppelbuchung).
                            pendingPruneIds = duplicateItems.map(d => d.id);
                        }
                    }

                    this.isSubmitting = true;

                    const rawTable = getTableFromUrl() || "{{ table }}";
                    const token = '{{ token }}' || '';
                    // Normalize: strip any existing "Tisch" prefix to avoid double "Tisch Tisch"
                    const cleanTable = String(rawTable).replace(/^Tisch\s*/i, '').trim();

                    const payload = {
                        table: cleanTable,
                        token: token,
                        items: this.cart.map(i => ({
                            product_id: i.id,
                            name: i.name_de || i.name,
                            price: i.price,
                            quantity: i.quantity,
                            note: i.note || null,
                            combo_id: i.combo_id || null,
                            // OPTION A: combo_name mitsenden — Backend speichert es
                            combo_name: i.combo_name || null,
                            // BUG FIX: combo_instance_id mitsenden — eindeutige Kombi-Zuordnung
                            // für Teilzahlung (sonst werden 2 gleiche Kombis zusammen getoggelt)
                            combo_instance_id: i.combo_instance_id || null
                        })),
                        // Idempotency-Key: Einmalige ID pro Bestell-Vorgang.
                        // Server lehnt doppelte Requests mit gleicher Key ab (innerhalb 60s).
                        // Verhindert Doppelbestellungen bei Race Conditions.
                        idempotency_key: (crypto.randomUUID ? crypto.randomUUID() : 
                                          'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                                              const r = Math.random() * 16 | 0;
                                              return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
                                          }))
                    };

                    // BUG FIX: Konsolen-Logging für Kombi-Bug Diagnose
                    // Falls Kunde sagt "über Kombi gebucht" aber Backend sieht kein combo_id,
                    // können wir in der Browser-Konsole sehen was wirklich im Warenkorb war
                    const _comboItems = this.cart.filter(i => i.combo_id);
                    const _nonComboItems = this.cart.filter(i => !i.combo_id);
                    console.log('[Bestellung] Warenkorb:', {
                        total: this.cart.length,
                        combo: _comboItems.length,
                        nonCombo: _nonComboItems.length,
                        comboItems: _comboItems.map(i => ({id: i.id, name: i.name, price: i.price, combo_id: i.combo_id, combo_name: i.combo_name})),
                        nonComboItems: _nonComboItems.map(i => ({id: i.id, name: i.name, price: i.price}))
                    });

                    const roleForBypass = (this.role === 'admin' || this.role === 'waiter') ? this.role : '';
                    const url = roleForBypass ? `/{{ slug }}/bestellen?role=${encodeURIComponent(roleForBypass)}` : `/{{ slug }}/bestellen`;

                    fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                    .then(res => {
                        if (res.ok) {
                            return res.json();
                        } else if (res.status === 403) {
                            showToast("Ungültiger oder abgelaufener Tisch-Code. Bitte scannen Sie neu.", "error");
                            throw new Error("Expired session");
                        } else {
                            showToast("Übertragungsfehler bei der Bestellung.", "error");
                            throw new Error("Network error");
                        }
                    })
                    .then(data => {
                        let myOrders = JSON.parse(localStorage.getItem(`dl_orders_{{ slug }}`)) || [];
                        myOrders.push(data.order_id);
                        localStorage.setItem(`dl_orders_{{ slug }}`, JSON.stringify(myOrders));
                        localStorage.removeItem(`dl_cart_{{ slug }}`);
                        this.cart = [];
                        this.closeCartModal();

                        // Issue 2.2 Fix: Bestätigte Stornos erst JETZT (nach
                        // erfolgreichem fetch) aus dem _recentCancellations-Cache
                        // löschen, damit nicht bei jeder weiteren Bestellung erneut
                        // gewarnt wird. Bei vorherigem Abbruch (Netzwerkfehler)
                        // bleibt der Cache erhalten → Retry warnt erneut.
                        if (pendingPruneIds && pendingPruneIds.length > 0) {
                            this._recentCancellations = (this._recentCancellations || []).filter(
                                r => !pendingPruneIds.includes(r.product_id)
                            );
                        }

                        // FIX: Kellner/Admin → nach Bestellung zurück zum Sitzplan
                        const urlParams = new URLSearchParams(window.location.search);
                        const userRole = urlParams.get('role') || '';
                        if (userRole === 'admin' || userRole === 'waiter') {
                            window.location.href = '/admin/dashboard';
                            return;
                        }

                        const thankyou = document.getElementById("thankyou-overlay");
                        if (thankyou) {
                            thankyou.classList.remove("hidden");
                            document.body.style.overflow = 'hidden';
                        }
                    })
                    .catch(err => console.error(err))
                    .finally(() => {
                        // Button wieder freigeben — egal ob Erfolg oder Fehler.
                        // Kurze Verzögerung (300ms), damit der User den "Wird gesendet…"
                        // Spinner visuell wahrnimmt und nicht sofort wieder klicken kann.
                        setTimeout(() => { this.isSubmitting = false; }, 300);
                    });
                },

                async fetchAdminDrawerState() {
                    try {
                        const rawTable = getTableFromUrl() || "{{ table }}";
                        if (!rawTable) return;
                        // Build table identifiers to match (with and without zone)
                        const cleanNum = String(rawTable).replace(/^Tisch\s*/i, '').split('(')[0].trim();
                        const cleanFull = String(rawTable).replace(/^Tisch\s*/i, '').trim();
                        const tischPlain = "Tisch " + cleanNum;
                        const tischZone = cleanFull.includes('(') ? "Tisch " + cleanFull : '';
                        
                        const res = await fetch('/api/tablet-status');
                        if (!res.ok) return;
                        
                        const data = await res.json();
                        
                        const tableOrders = data.orders.filter(o => {
                            const t = o.table || '';
                            return t === tischZone || t === tischPlain || t === cleanFull || t === cleanNum;
                        });
                        
                        let pending = [];
                        let delivered = [];
                        let total = 0.0;
                        
                        tableOrders.forEach(order => {
                            total += order.total;
                            if (order.items) {
                                order.items.forEach(item => {
                                    const status = item.item_status || 'pending';
                                    const noteSlug = (item.note || '').replace(/\s+/g, '_');
                                    
                                    for (let idx = 0; idx < item.quantity; idx++) {
                                        const key = `${order.id}_${item.product_id}_${noteSlug}_${status}_${idx}`;
                                        const itemData = {
                                            order_id: order.id,
                                            product_id: item.product_id,
                                            name: item.name,
                                            price: item.price,
                                            quantity: 1,
                                            note: item.note || '',
                                            status: status,
                                            key: key,
                                            unit_index: idx
                                        };
                                        
                                        if (status === 'pending') {
                                            pending.push(itemData);
                                        } else if (status === 'confirmed' || status === 'delivered') {
                                            delivered.push(itemData);
                                        }
                                    }
                                });
                            }
                        });
                        
                        this.tableOrders = { pending, delivered, total };
                        
                        if (total <= 0.0) {
                            this.isDrawerOpen = false;
                        }
                    } catch (e) {
                        console.error("Error fetching drawer state:", e);
                    }
                },

                async refreshProductDataLite() {
                    // Lightweight product refresh via JSON API instead of full page re-fetch
                    // Updates prices, availability, happy hour badges in-place (~2KB vs ~200KB)
                    try {
                        const res = await fetch('/api/{{ slug }}/products-lite');
                        if (!res.ok) return;
                        const data = await res.json();
                        
                        const products = data.products || [];
                        
                        // Update each product card in the DOM
                        products.forEach(p => {
                            // Update price display
                            const priceEl = document.querySelector(`[data-product-price-id="${p.id}"]`);
                            if (priceEl) {
                                const formatted = p.price.toFixed(2).replace('.', ',');
                                if (p.is_hh_active) {
                                    priceEl.innerHTML = `<span class="line-through text-on-surface-variant/50 text-xs mr-1">${priceEl.dataset.originalPrice || formatted}</span><span class="text-primary font-black">${formatted} €</span>`;
                                } else {
                                    priceEl.textContent = `${formatted} €`;
                                }
                            }
                            
                            // Update availability
                            const cardEl = document.querySelector(`[data-product-card-id="${p.id}"]`);
                            if (cardEl) {
                                if (!p.is_available) {
                                    cardEl.classList.add('opacity-50', 'pointer-events-none');
                                } else {
                                    cardEl.classList.remove('opacity-50', 'pointer-events-none');
                                }
                            }
                            
                            // Update HH badge
                            const hhBadge = document.querySelector(`[data-hh-badge-id="${p.id}"]`);
                            if (hhBadge) {
                                if (p.is_hh_active && p.active_event) {
                                    hhBadge.textContent = p.active_event.display_name || p.active_event.name;
                                    hhBadge.classList.remove('hidden');
                                } else {
                                    hhBadge.classList.add('hidden');
                                }
                            }
                        });
                        
                        // Update happy hour banner
                        const bannerEl = document.getElementById('happy-hour-banner-wrapper');
                        if (bannerEl) {
                            if (data.any_event_active && data.active_events && data.active_events.length > 0) {
                                bannerEl.classList.remove('hidden');
                            } else {
                                bannerEl.classList.add('hidden');
                            }
                        }
                    } catch (e) {
                        console.error("Error refreshing product data:", e);
                    }
                },
