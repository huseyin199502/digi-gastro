<script>

        function toggleFaq(id) {
            const content = document.getElementById(`faq-content-${id}`);
            const icon = document.getElementById(`faq-icon-${id}`);
            if (!content || !icon) return;
            // Close all other FAQ items
            document.querySelectorAll('.accordion-content').forEach(c => {
                if (c !== content) {
                    c.style.maxHeight = '0px';
                }
            });
            document.querySelectorAll('[id^="faq-icon-"]').forEach(i => {
                if (i !== icon) {
                    i.classList.remove('rotate-180');
                }
            });
            // Toggle current
            if (content.style.maxHeight && content.style.maxHeight !== '0px') {
                content.style.maxHeight = '0px';
                icon.classList.remove('rotate-180');
            } else {
                content.style.maxHeight = content.scrollHeight + 'px';
                icon.classList.add('rotate-180');
            }
        }

        function openLogin() {
            {% if is_logged_in %}
                window.location.href = "{{ login_target }}";
            {% else %}
                document.getElementById('loginModal').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            {% endif %}
        }

        // ─────────────────────────────────────────────────────────────
        // PWA Standalone Detection & Auto-Login-Prompt
        // ─────────────────────────────────────────────────────────────
        // iOS/Android PWAs have a SEPARATE cookie jar from the browser.
        // If the user saved the app to their home screen while logged in
        // via Safari/Chrome, the PWA will NOT have those session cookies.
        // → Detect standalone mode and auto-open the login modal so the
        //   owner doesn't see a blank "not logged in" state with no clear
        //   way forward.
        (function detectPwaStandalone() {
            const isStandalone =
                window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true ||
                new URLSearchParams(window.location.search).has('pwa');
            if (!isStandalone) return;
            {% if is_logged_in %}
            // Already logged in inside the PWA.
            // Don't show the landing page — go straight to the dashboard
            // so the owner lands on the Sitzplan when opening the app.
            const target = "{{ login_target }}";
            if (target && target.length > 0) {
                // Use replace() so the landing page doesn't end up in the
                // back-stack history (Back button would jump out of the app).
                window.location.replace(target);
            }
            return;
            {% else %}
            // Don't auto-open if the URL has a hash anchor (e.g. #features)
            // or if the login modal is already visible (e.g. show_login=1).
            const hasHashAnchor = window.location.hash && window.location.hash.length > 1;
            const modalAlreadyVisible = !document.getElementById('loginModal').classList.contains('hidden');
            if (hasHashAnchor || modalAlreadyVisible) {
                // Even if we don't auto-open, show the PWA hint inside the modal
                // so the user understands why they need to log in again.
                const notice = document.getElementById('pwa-login-notice');
                if (notice) notice.classList.remove('hidden');
                return;
            }
            // Show the PWA-specific notice inside the login modal.
            const notice = document.getElementById('pwa-login-notice');
            if (notice) notice.classList.remove('hidden');
            // Auto-open login modal after short delay (lets the page settle first).
            setTimeout(() => {
                if (document.getElementById('loginModal').classList.contains('hidden')) {
                    openLogin();
                }
            }, 600);
            {% endif %}
        })();

        function closeLogin() {
            document.getElementById('loginModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        document.getElementById('loginModal').addEventListener('click', function(e) {
            if (e.target === this) closeLogin();
        });

        function showLegal(type) {
            const modal = document.getElementById('legalModal');
            const title = document.getElementById('legalTitle');
            const content = document.getElementById('legalContent');
            if (type === 'imprint') {
                title.textContent = 'Impressum - digi-gastro.de';
                content.innerHTML = IMPRESSUM_TEXT;
            } else {
                title.textContent = 'Datenschutzerklärung - digi-gastro.de';
                content.innerHTML = PRIVACY_TEXT;
            }
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeLegal() {
            document.getElementById('legalModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        document.getElementById('legalModal').addEventListener('click', function(e) {
            if (e.target === this) closeLegal();
        });

        {% if show_impressum %}
        window.addEventListener('load', () => { showLegal('imprint'); });
        {% endif %}

        {% if show_datenschutz %}
        window.addEventListener('load', () => { showLegal('privacy'); });
        {% endif %}
