<script>

        // ═══ COMBO PICKER SELECTION HIGHLIGHT ═══
        // Global function — called by radio onchange in combo picker modal
        function updateComboPickerSelection(radio) {
            var name = radio.name;
            // Reset all labels in this group
            var labels = document.querySelectorAll('label[data-radio-name="' + name + '"]');
            for (var i = 0; i < labels.length; i++) {
                var r = labels[i].querySelector('input[type=radio]');
                labels[i].style.borderColor = 'transparent';
                labels[i].style.background = '#27272a';
                if (r) {
                    r.style.borderColor = '#52525b';
                    r.style.background = '#18181b';
                    r.style.boxShadow = 'none';
                }
            }
            // Highlight selected label
            var selectedLabel = radio.closest('label');
            if (selectedLabel) {
                selectedLabel.style.borderColor = '#14b8a6';
                selectedLabel.style.background = 'rgba(20, 184, 166, 0.15)';
                radio.style.borderColor = '#14b8a6';
                radio.style.background = '#14b8a6';
                radio.style.boxShadow = 'inset 0 0 0 4px #18181b';
            }
        }

        // ═══ LOYALTY POPUP LOGIC ═══
        // Smart-Erkennung: Zeigt Popup nur wenn Kunde noch keine Stempelkarte hat.
        // Unterscheidet Erstbesuch vs. Wiederbesuch (verschiedene Texte).

        let _loyaltyCardData = null;
        let _loyaltyCardActive = false;

        // ════════════════════════════════════════════════════════════════
        // DREI-KANAL-ANONYMOUS-ID (DSGVO-konforme Geräteerkennung)
        // ════════════════════════════════════════════════════════════════
        // Speichert eine zufällige UUID in 3 Kanälen, damit bei Cookielöschung
        // oder partieller Storage-Löschung die Anonymous-ID erhalten bleibt:
        //   1. localStorage (dg_aid_{slug}) — primär, permanent
        //   2. IndexedDB (dg_loyalty) — Backup falls LS gelöscht wird
        //   3. Cookie (loyalty_{slug}_aid) — Backup, 1 Jahr TTL
        // Die UUID wird bei jedem /loyalty/state Aufruf an den Server gesendet.
        // Der Server verknüpft die UUID mit dem LoyaltyCustomer-Datensatz.
        let _dgAid = '';

        async function _getOrCreateAid() {
            const slug = '{{ slug }}';
            const lsKey = `dg_aid_${slug}`;
            // SAFARI PRIVATE MODE FIX: localStorage.setItem wirft QuotaExceededError
            // im Safari Private Mode. Wir müssen alle Zugriffe in try/catch wrappen,
            // sonst bricht die gesamte Funktion ab und _dgAid wird nie gesetzt.
            // → 1-5% der User sehen immer Popup weil Aid nie generiert wird.
            const _lsGet = (k) => { try { return localStorage.getItem(k); } catch(e) { return null; } };
            const _lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch(e) { return false; } };

            // 1. Versuche localStorage
            let aid = _lsGet(lsKey);
            if (aid && aid.length === 36) { _dgAid = aid; _persistAidCookie(aid); return aid; }
            // 2. Versuche Cookie (Backup)
            const cookieMatch = document.cookie.match(new RegExp(`loyalty_${slug}_aid=([a-f0-9-]+)`));
            if (cookieMatch && cookieMatch[1].length === 36) {
                _lsSet(lsKey, cookieMatch[1]);  // Versuchen in LS zu schreiben (kann fehlschlagen im Private Mode)
                _dgAid = cookieMatch[1];
                return cookieMatch[1];
            }
            // 3. Versuche IndexedDB (Backup)
            try {
                const idbAid = await _idbGetAid(slug);
                if (idbAid && idbAid.length === 36) {
                    _lsSet(lsKey, idbAid);  // Versuchen in LS zu schreiben
                    _dgAid = idbAid;
                    _persistAidCookie(idbAid);
                    return idbAid;
                }
            } catch (e) { /* IDB evtl. nicht verfügbar */ }
            // 4. Neue UUID generieren + in alle 3 Kanäle speichern
            aid = (crypto.randomUUID ? crypto.randomUUID() : _genUuidFallback());
            _lsSet(lsKey, aid);  // Versuchen in LS zu schreiben (Private Mode: schlägt fehl, aber Aid trotzdem nutzen)
            _persistAidCookie(aid);
            try { await _idbSetAid(slug, aid); } catch (e) {}
            _dgAid = aid;
            return aid;
        }

        function _persistAidCookie(aid) {
            const expires = new Date();
            expires.setTime(expires.getTime() + (365 * 24 * 60 * 60 * 1000));
            document.cookie = `loyalty_{{ slug }}_aid=${aid}; expires=${expires.toUTCString()}; path=/; SameSite=Lax; Secure`;
        }

        function _genUuidFallback() {
            // RFC4122 v4 Fallback falls crypto.randomUUID nicht verfügbar
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // IndexedDB Helper (minimal)
        function _idbGetAid(slug) {
            return new Promise((resolve) => {
                try {
                    const req = indexedDB.open('dg_loyalty', 1);
                    req.onupgradeneeded = () => {
                        req.result.createObjectStore('aid', { keyPath: 'slug' });
                    };
                    req.onsuccess = () => {
                        const db = req.result;
                        try {
                            const tx = db.transaction('aid', 'readonly');
                            const store = tx.objectStore('aid');
                            const getReq = store.get(slug);
                            getReq.onsuccess = () => resolve(getReq.result ? getReq.result.aid : null);
                            getReq.onerror = () => resolve(null);
                        } catch (e) { resolve(null); }
                    };
                    req.onerror = () => resolve(null);
                } catch (e) { resolve(null); }
            });
        }

        function _idbSetAid(slug, aid) {
            return new Promise((resolve, reject) => {
                try {
                    const req = indexedDB.open('dg_loyalty', 1);
                    req.onupgradeneeded = () => {
                        req.result.createObjectStore('aid', { keyPath: 'slug' });
                    };
                    req.onsuccess = () => {
                        const db = req.result;
                        const tx = db.transaction('aid', 'readwrite');
                        const store = tx.objectStore('aid');
                        store.put({ slug, aid });
                        tx.oncomplete = () => resolve();
                        tx.onerror = () => reject(tx.error);
                    };
                    req.onerror = () => reject(req.error);
                } catch (e) { reject(e); }
            });
        }

        // Tenant-Test-Override: ?no_loyalty_popup=1 → Popup dauerhaft unterdrücken
        // Wird im localStorage gespeichert, damit Tenant bei Test-Besuchen nicht gestört wird.
        function _checkTenantOverride() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('no_loyalty_popup') === '1') {
                localStorage.setItem(`dg_skip_popup_{{ slug }}`, 'true');
                // URL-Param entfernen
                urlParams.delete('no_loyalty_popup');
                const newUrl = window.location.pathname + (urlParams.toString() ? '?' + urlParams.toString() : '');
                window.history.replaceState({}, document.title, newUrl);
                return true;
            }
            return localStorage.getItem(`dg_skip_popup_{{ slug }}`) === 'true';
        }

        async function checkLoyaltyAvailability() {
            try {
                const res = await fetch('/{{ slug }}/loyalty/card');
                if (!res.ok) return;
                const data = await res.json();
                if (data.card) {
                    _loyaltyCardData = data;
                    _loyaltyCardActive = true;
                    // Stempelkarte Button sichtbar machen (nur wenn Karte aktiv)
                    const btnContainer = document.getElementById('loyalty-pass-btn-container');
                    if (btnContainer) btnContainer.style.display = '';

                    // AUTO-RECOVERY: ?recover=CODE in URL → /loyalty/state mit recover aufrufen
                    // Wenn Kunde aus Wallet auf "Speisekarte öffnen" getippt hat:
                    // URL enthält ?recover=Y7YJ → Server findet Customer via short_code
                    const urlParams = new URLSearchParams(window.location.search);
                    const recoverCode = urlParams.get('recover');
                    const aid = await _getOrCreateAid();
                    // aid in Stempelkarte-Button Link setzen (für direkte Navigation)
                    _updateLoyaltyPassBtnHref();

                    // /loyalty/state aufrufen — mit aid UND recover (falls vorhanden)
                    let stateUrl = `/{{ slug }}/loyalty/state?aid=${encodeURIComponent(aid)}`;
                    if (recoverCode) {
                        stateUrl += `&recover=${encodeURIComponent(recoverCode)}`;
                    }

                    // Drei-Kanal-Server-Lookup: hat dieser Kunde schon einen Pass?
                    // Server ist verlässlich (DB-basiert) — ersetzt fragiles Cookie-Checking.
                    try {
                        const stateRes = await fetch(stateUrl);
                        if (stateRes.ok) {
                            const state = await stateRes.json();
                            _loyaltyHasPass = !!state.has_pass;

                            // Premium-Button Text dynamisch anpassen
                            // has_pass=true  → "Stempelkarte öffnen" (Kunde hat sie schon)
                            // has_pass=false → "Stempelkarte"         (Kunde hat sie noch nicht)
                            // Die Wallet-Buttons im Modal behalten ihr offizielles Branding-Label.
                            const premiumLabel = document.getElementById('loyalty-premium-label');
                            if (premiumLabel) {
                                premiumLabel.textContent = state.has_pass ? 'Stempelkarte öffnen' : 'Stempelkarte';
                            }

                            if (state.has_pass) {
                                _setLoyaltySavedCookie();
                            }
                        }
                    } catch (e) { /* Server-Lookup optional, Cookie-Fallback unten */ }
                }
            } catch (e) { /* silently ignore — Loyalty ist optional */ }
        }

        let _loyaltyHasPass = false; // Drei-Kanal-Server-Lookup Ergebnis
        let _loyaltyAidReady = false; // Wird true sobald _getOrCreateAid() fertig ist

        // Stempelkarte Button Click Handler
        // Hängt anonymous_id (aid) an den Link bevor Navigation stattfindet
        // Ohne aid: Server erkennt Kunden nicht → Duplikat-Schutz → Code-Eingabe
        // Mit aid: Server erkennt Kunden → Pass wird direkt generiert
        async function loyaltyPassClick(event) {
            // Wenn aid schon gesetzt (checkLoyaltyAvailability war schneller)
            if (typeof _dgAid !== 'undefined' && _dgAid && _dgAid.length === 36) {
                const btn = document.getElementById('loyalty-apple-btn');
                if (btn) {
                    // aid an Link anhängen (falls noch nicht da)
                    const currentHref = btn.getAttribute('href');
                    if (currentHref && !currentHref.includes('aid=')) {
                        btn.setAttribute('href', currentHref + '?aid=' + encodeURIComponent(_dgAid));
                    }
                }
                return true; // Navigation erlaubt
            }

            // aid noch nicht ready → warte bis es da ist, dann navigiere
            if (event) event.preventDefault();
            try {
                const clickAid = await _getOrCreateAid();
                if (clickAid && clickAid.length === 36) {
                    window.location.href = '/{{ slug }}/loyalty/pass/apple?aid=' + encodeURIComponent(clickAid);
                } else {
                    // Fallback: ohne aid navigieren (Server zeigt Code-Eingabe-Seite)
                    window.location.href = '/{{ slug }}/loyalty/pass/apple';
                }
            } catch(e) {
                // Fehler → trotzdem navigieren (Fallback)
                window.location.href = '/{{ slug }}/loyalty/pass/apple';
            }
            return false;
        }

        // Google Pass Click Handler — analog zu loyaltyPassClick, aber für Google Wallet.
        // Wird gebraucht weil aid evtl. noch nicht ready ist wenn Kunde direkt auf den
        // Google-Button im Modal tappt (z.B. bei sehr schnellem Tap nach Page-Load).
        async function loyaltyGooglePassClick(event) {
            // Wenn aid schon gesetzt → nur an Link anhängen, dann Navigation erlauben
            if (typeof _dgAid !== 'undefined' && _dgAid && _dgAid.length === 36) {
                const btn = document.getElementById('loyalty-google-btn');
                if (btn) {
                    const currentHref = btn.getAttribute('href');
                    if (currentHref && !currentHref.includes('aid=')) {
                        btn.setAttribute('href', currentHref + '?aid=' + encodeURIComponent(_dgAid));
                    }
                }
                return true; // Navigation erlaubt
            }

            // aid noch nicht ready → warte bis es da ist, dann navigiere
            if (event) event.preventDefault();
            try {
                const clickAid = await _getOrCreateAid();
                if (clickAid && clickAid.length === 36) {
                    window.location.href = '/{{ slug }}/loyalty/pass/google?aid=' + encodeURIComponent(clickAid);
                } else {
                    // Fallback: ohne aid navigieren (Server zeigt Code-Eingabe-Seite)
                    window.location.href = '/{{ slug }}/loyalty/pass/google';
                }
            } catch(e) {
                window.location.href = '/{{ slug }}/loyalty/pass/google';
            }
            return false;
        }

        // aid in beide Button-Links setzen (für direkte Navigation ohne Click-Handler)
        function _updateLoyaltyPassBtnHref() {
            if (typeof _dgAid === 'undefined' || !_dgAid || _dgAid.length !== 36) return;
            const appleBtn = document.getElementById('loyalty-apple-btn');
            const googleBtn = document.getElementById('loyalty-google-btn');
            const aidParam = '?aid=' + encodeURIComponent(_dgAid);
            if (appleBtn) {
                let href = appleBtn.getAttribute('href') || '';
                if (!href.includes('aid=')) {
                    appleBtn.setAttribute('href', href.split('?')[0] + aidParam);
                }
            }
            if (googleBtn) {
                let href = googleBtn.getAttribute('href') || '';
                if (!href.includes('aid=')) {
                    googleBtn.setAttribute('href', href.split('?')[0] + aidParam);
                }
            }
        }

        function _setLoyaltySavedCookie() {
            const expires = new Date();
            expires.setTime(expires.getTime() + (365 * 24 * 60 * 60 * 1000));
            document.cookie = `loyalty_{{ slug }}=saved; expires=${expires.toUTCString()}; path=/; SameSite=Lax; Secure`;
            // localStorage als Fallback (cookies können bei .pkpass Download verloren gehen)
            localStorage.setItem(`loyalty_saved_{{ slug }}`, 'true');
        }

        // ── GLOBALE Device Detection Funktion ──
        // Wird bei jedem Popup-Öffnen aufgerufen (handleSpeisekarteClick)
        // UND beim initialen Laden (prepareLoyaltyPopup).
        // iOS (iPhone/iPad/iPod + iPadOS 13+ als MacIntel): nur Apple Button
        // Android: nur Google Button
        // Desktop/Other: beide Buttons
        function applyDeviceDetection() {
            const appleBtn = document.getElementById('loyalty-apple-btn');
            const googleBtn = document.getElementById('loyalty-google-btn');
            if (!appleBtn || !googleBtn) return;

            // Reset: beide Buttons sichtbar
            appleBtn.style.display = '';
            googleBtn.style.display = '';

            const ua = navigator.userAgent || '';
            // iOS Detection: iPhone/iPad/iPod ODER iPadOS 13+ (meldet sich als MacIntel mit Touch)
            const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const isAndroid = /Android/i.test(ua);

            if (isIOS) {
                // iOS → nur Apple Button
                googleBtn.style.display = 'none';
            } else if (isAndroid) {
                // Android → nur Google Button
                appleBtn.style.display = 'none';
            }
            // Desktop: beide sichtbar (Default)
        }

        // ════════════════════════════════════════════════════════════════
        // WALLET BOTTOM-SHEET MODAL (Stempelkarte)
        // ════════════════════════════════════════════════════════════════
        // Mobile-first Bottom-Sheet. Auf Desktop wird es zentriert.
        // Schließbar via: X-Button, Backdrop-Klick, ESC-Taste.
        // Beim Öffnen: Body-Scroll sperren + Device-Detection anwenden.

        function openWalletModal() {
            const modal = document.getElementById('wallet-modal');
            const triggerBtn = document.getElementById('loyalty-premium-btn');
            if (!modal) return;

            modal.classList.remove('hidden');
            // Trigger-Button als "expanded" markieren (Accessibility)
            if (triggerBtn) triggerBtn.setAttribute('aria-expanded', 'true');

            // Body-Scroll sperren (gleiches Muster wie andere Modals im Codebase)
            document.body.style.overflow = 'hidden';

            // Device Detection anwenden — iOS zeigt nur Apple, Android nur Google
            if (typeof applyDeviceDetection === 'function') {
                try { applyDeviceDetection(); } catch (e) { /* optional */ }
            }
        }

        function closeWalletModal() {
            const modal = document.getElementById('wallet-modal');
            const triggerBtn = document.getElementById('loyalty-premium-btn');
            if (!modal || modal.classList.contains('hidden')) return;

            modal.classList.add('hidden');
            if (triggerBtn) triggerBtn.setAttribute('aria-expanded', 'false');

            // Body-Scroll wiederherstellen
            document.body.style.overflow = '';
        }

        // ESC schließt Modal (globaler Keydown-Listener)
        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Escape') return;
            const modal = document.getElementById('wallet-modal');
            if (!modal || modal.classList.contains('hidden')) return;
            // Wenn gerade ein anderes Modal/Input Fokus hat, nicht greifen
            // (z.B. Cart-Modal offen — das hat seinen eigenen ESC-Handler)
            closeWalletModal();
        });

        // Alte globale Funktionen wurden durch Alpine-Methoden ersetzt:
        // - handleSpeisekarteClick() → Alpine-Methode in menuState()
        // - closeLoyaltyPopupAndGoToMenu() → Alpine-Methode in menuState()
        // Diese werden nicht mehr als globale Funktionen benötigt.

        // Apple/Google Wallet Click → merken dass Kunde Karte gespeichert hat
        // (wird jetzt schon in prepareLoyaltyPopup gemacht — kein separater
        // DOMContentLoaded Listener nötig)

        // Beim Laden prüfen ob Loyalty aktiv
        // (Polling + Redownload-Button entfernt — Stempel-Buttons sind weg,
        //  das Loyalty-Popup wird nur noch über handleSpeisekarteClick getriggert.)
        checkLoyaltyAvailability();

    
</script>
