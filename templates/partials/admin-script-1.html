        // ─── Pagination State für Loyalty-Kunden (Section 5) ───
        // Wird von loadLoyaltyCustomers(page) gelesen/geschrieben, damit
        // nach Award/Delete dieselbe Seite neugeladen wird.
        let loyaltyCustomersCurrentPage = 1;
        const LOYALTY_CUSTOMERS_PER_PAGE = 25;

        /**
         * Rendert die Pagination-Controls (Seite X von Y + Buttons) für die
         * Loyalty-Kunden-Liste. Wird von loadLoyaltyCustomers() aufgerufen.
         */
        function renderLoyaltyCustomersPagination(p) {
            if (!p || p.total_pages <= 1) {
                // Bei ≤ 1 Seite zeigen wir nur die Anzahl, keine Buttons
                return `
                    <div class="mt-3 flex items-center justify-between text-[11px] text-zinc-500 dark:text-zinc-400">
                        <span>${(p && p.total) || 0} Kunde(n) insgesamt</span>
                        <span>Seite 1 / 1</span>
                    </div>`;
            }

            const cur = p.page;
            const last = p.total_pages;

            // Seiten-Buttons mit Ellipsen ("1 … 4 5 6 … 12")
            const pages = [];
            pages.push(1);
            if (cur - 2 > 2) pages.push('…');
            for (let i = Math.max(2, cur - 1); i <= Math.min(last - 1, cur + 1); i++) {
                pages.push(i);
            }
            if (cur + 2 < last - 1) pages.push('…');
            if (last > 1) pages.push(last);

            const buttons = pages.map(pn => {
                if (pn === '…') {
                    return `<span class="px-2 py-1 text-zinc-400 dark:text-zinc-500 select-none">…</span>`;
                }
                const isCurrent = pn === cur;
                const cls = isCurrent
                    ? 'bg-zinc-800 text-white dark:bg-zinc-100 dark:text-zinc-900 font-bold'
                    : 'bg-white hover:bg-zinc-100 text-zinc-700 dark:bg-zinc-800 dark:hover:bg-zinc-700 dark:text-zinc-200';
                return `<button onclick="loadLoyaltyCustomers(${pn})" class="px-2.5 py-1 rounded-lg text-xs ${cls} transition">${pn}</button>`;
            }).join('');

            const prevDisabled = cur <= 1;
            const nextDisabled = cur >= last;
            const prevCls = prevDisabled
                ? 'opacity-40 cursor-not-allowed bg-zinc-100 text-zinc-400 dark:bg-zinc-800'
                : 'bg-white hover:bg-zinc-100 text-zinc-700 dark:bg-zinc-800 dark:hover:bg-zinc-700 dark:text-zinc-200';
            const nextCls = nextDisabled
                ? 'opacity-40 cursor-not-allowed bg-zinc-100 text-zinc-400 dark:bg-zinc-800'
                : 'bg-white hover:bg-zinc-100 text-zinc-700 dark:bg-zinc-800 dark:hover:bg-zinc-700 dark:text-zinc-200';

            // disabled-Buttons verhindern Klick via onclick="return false"
            const prevAttr = prevDisabled ? 'onclick="return false" disabled' : `onclick="loadLoyaltyCustomers(${cur - 1})"`;
            const nextAttr = nextDisabled ? 'onclick="return false" disabled' : `onclick="loadLoyaltyCustomers(${cur + 1})"`;

            return `
                <div class="mt-3 flex flex-wrap items-center justify-between gap-2 text-[11px] text-zinc-500 dark:text-zinc-400">
                    <span>${p.total} Kunde(n) insgesamt · Seite ${cur} / ${last}</span>
                    <div class="flex items-center gap-1">
                        <button ${prevAttr} class="px-2 py-1 rounded-lg text-xs ${prevCls}">
                            <span class="material-symbols-outlined" style="font-size:14px;">chevron_left</span>
                        </button>
                        ${buttons}
                        <button ${nextAttr} class="px-2 py-1 rounded-lg text-xs ${nextCls}">
                            <span class="material-symbols-outlined" style="font-size:14px;">chevron_right</span>
                        </button>
                    </div>
                </div>`;
        }

        async function loadLoyaltyCustomers(page) {
            const container = document.getElementById('loyalty-customers-list');
            if (!container) return;

            // Page-State updaten falls übergeben, sonst aktuelle Seite behalten
            if (typeof page === 'number' && page >= 1) {
                loyaltyCustomersCurrentPage = page;
            }
            const currentPage = loyaltyCustomersCurrentPage;

            try {
                const res = await fetch(
                    `/admin/loyalty/customers?page=${currentPage}&per_page=${LOYALTY_CUSTOMERS_PER_PAGE}`,
                    { credentials: 'same-origin' }
                );
                if (!res.ok) return;
                const data = await res.json();
                const customers = data.customers || [];
                const pagination = data.pagination || { page: 1, per_page: LOYALTY_CUSTOMERS_PER_PAGE, total: 0, total_pages: 1 };

                // Edge-Case: aktuelle Seite > total_pages (z.B. nachdem der letzte
                // Kunde auf der letzten Seite gelöscht wurde) → Seite zurücksetzen
                // und rekursiv neuladen.
                if (pagination.total_pages > 0 && currentPage > pagination.total_pages) {
                    loyaltyCustomersCurrentPage = pagination.total_pages;
                    return loadLoyaltyCustomers();
                }

                if (customers.length === 0) {
                    container.innerHTML = '<div class="text-center text-zinc-400 text-xs py-4">Noch keine Kunden mit Stempelkarte.</div>';
                    return;
                }
                const paginationHtml = renderLoyaltyCustomersPagination(pagination);
                container.innerHTML = `
                    <div class="overflow-x-auto -mx-2 px-2">
                    <table class="w-full text-xs">
                        <thead class="bg-gray-50 dark:bg-zinc-900 text-zinc-600 dark:text-zinc-400 uppercase text-[10px]">
                            <tr>
                                <th class="px-2 py-2 text-left">Code</th>
                                <th class="px-2 py-2 text-left">Typ</th>
                                <th class="px-2 py-2 text-center">Stempel</th>
                                <th class="px-2 py-2 text-center">Tier</th>
                                <th class="px-2 py-2 text-center hidden sm:table-cell">Letzter Besuch</th>
                                <th class="px-2 py-2 text-center">Aktion</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${customers.map(c => {
                                const tierBadge = {neu: 'bg-gray-100 text-gray-700 dark:bg-zinc-700 dark:text-zinc-300', stamm: 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300', vip: 'bg-amber-100 text-amber-700 dark:bg-amber-900/50 dark:text-amber-300'}[c.tier] || 'bg-gray-100 text-gray-700 dark:bg-zinc-700 dark:text-zinc-300';
                                const tierIcon = {neu: '🆕', stamm: '⭐', vip: '👑'}[c.tier] || '';
                                const lastVisit = c.last_visit_at ? new Date(c.last_visit_at).toLocaleDateString('de-DE') : '—';
                                return `
                                <tr class="border-t border-gray-100 dark:border-zinc-700 text-zinc-800 dark:text-zinc-200">
                                    <td class="px-2 py-2 font-mono font-bold">${c.short_code || '—'}</td>
                                    <td class="px-2 py-2">${c.pass_type === 'apple' ? '🍎' : '🟢'}</td>
                                    <td class="px-2 py-2 text-center font-bold">${c.current_stamps}</td>
                                    <td class="px-2 py-2 text-center"><span class="px-1.5 py-0.5 rounded-full text-[10px] font-bold ${tierBadge}">${tierIcon} ${c.tier}</span></td>
                                    <td class="px-2 py-2 text-center text-zinc-500 dark:text-zinc-400 hidden sm:table-cell">${lastVisit}</td>
                                    <td class="px-2 py-2 text-center">
                                        <div class="flex gap-1 justify-center">
                                            <button onclick="awardStampToCustomer('${c.short_code}')" class="text-xs px-2 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white dark:bg-emerald-500 dark:hover:bg-emerald-600 dark:text-white font-bold flex items-center gap-1" title="Stempel vergeben">
                                                <span class="material-symbols-outlined" style="font-size:13px;">add_circle</span> <span class="hidden sm:inline">Stempel</span>
                                            </button>
                                            ${c.current_stamps >= (c.stamps_required || 10) ? `<button onclick="redeemReward(${c.id}, '${c.short_code}')" class="text-xs px-1.5 py-1 rounded-lg bg-amber-500 hover:bg-amber-600 text-white font-bold" title="Prämie einlösen">
                                                <span class="material-symbols-outlined" style="font-size:13px;">redeem</span>
                                            </button>` : ''}
                                            <button onclick="quickSendToCustomer(${c.id}, '${c.short_code}')" class="text-xs px-1.5 py-1 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold" title="Nachricht senden">
                                                <span class="material-symbols-outlined" style="font-size:13px;">send</span>
                                            </button>
                                            <button onclick="deleteCustomer(${c.id})" class="text-xs px-1.5 py-1 rounded-lg bg-red-100 hover:bg-red-200 text-red-700 dark:bg-red-900/40 dark:hover:bg-red-900/60 dark:text-red-300 font-bold" title="Löschen">
                                                🗑
                                            </button>
                                        </div>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                    </div>
                    ${paginationHtml}`;
            } catch (e) {
                console.error('Load customers error:', e);
            }
        }

        async function awardStampToCustomer(shortCode) {
            if (!shortCode || shortCode === '—') {
                showToast('Kunde hat keinen Short-Code', 'error');
                return;
            }
            if (!confirm(`Stempel an Kunde ${shortCode} vergeben?`)) return;
            try {
                const res = await fetch('/admin/loyalty/stamp-manual', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify({short_code: shortCode})
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    if (data.reward_redeemed) {
                        showToast(`🎉 ${data.customer_nickname}: Reward "${data.reward_name}" eingelöst!`, 'success');
                    } else {
                        showToast(`✅ Stempel vergeben! ${data.current_stamps}/${data.stamps_required}`, 'success');
                    }
                    loadLoyaltyCustomers();  // Liste aktualisieren
                } else {
                    showToast(data.detail || 'Fehler beim Vergeben', 'error');
                }
            } catch (e) {
                showToast('Fehler: ' + e.message, 'error');
            }
        }

        async function triggerBroadcast(campaignId) {
            if (!confirm('Broadcast an ALLE deine Kunden senden? Das kann nicht rückgängig gemacht werden.')) return;
            try {
                const res = await fetch(`/admin/loyalty/broadcast/${campaignId}`, {
                    method: 'POST',
                    credentials: 'same-origin'
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    const s = data.stats || {};
                    showToast(`✅ ${s.pushs_sent || 0} Pushs gesendet, ${s.pushs_skipped_cooldown || 0} cooldown, ${s.pushs_skipped_optout || 0} failed`, 'success');
                    loadLoyaltyDashboard();
                } else {
                    showToast(data.detail || 'Fehler beim Broadcast', 'error');
                }
            } catch (e) {
                showToast('Fehler: ' + e.message, 'error');
            }
        }

        async function deleteCustomer(customerId) {
            if (!confirm('Diesen Kunden wirklich löschen? Alle Stempel gehen verloren.')) return;
            try {
                const res = await fetch(`/admin/loyalty/customer/${customerId}`, {
                    method: 'DELETE',
                    credentials: 'same-origin'
                });
                if (res.ok) {
                    showToast('Kunde gelöscht', 'success');
                    loadLoyaltyCustomers();
                } else {
                    showToast('Fehler beim Löschen', 'error');
                }
            } catch (e) {
                showToast('Fehler: ' + e.message, 'error');
            }
        }

        async function deleteAllCustomers() {
            if (!confirm('ACHTUNG: Wirklich ALLE Kunden löschen? Das betrifft alle Stempel, Push-Logs und Device-Registrierungen. Das kann NICHT rückgängig gemacht werden!')) return;
            if (!confirm('Letzte Bestätigung: Wirklich alle Kunden löschen?')) return;
            try {
                const res = await fetch('/admin/loyalty/delete-all-customers', {
                    method: 'POST',
                    credentials: 'same-origin'
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    showToast(`✅ ${data.deleted_count} Kunden gelöscht`, 'success');
                    loadLoyaltyDashboard();
                } else {
                    showToast('Fehler beim Löschen', 'error');
                }
            } catch (e) {
                showToast('Fehler: ' + e.message, 'error');
            }
        }

        async function quickSend(customerId) {
            const message = document.getElementById('quicksend-message').value.trim();
            if (!message) {
                showToast('Bitte Nachricht eingeben', 'error');
                return;
            }
            const target = customerId ? `Kunde #${customerId}` : 'alle Kunden';
            if (!confirm(`Nachricht an ${target} senden?\n\n${message}`)) return;

            const btn = document.getElementById('quicksend-btn');
            if (btn) { btn.disabled = true; btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px;">hourglass_empty</span> Wird gesendet...'; }

            try {
                const res = await fetch('/admin/loyalty/quick-send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify({message, customer_id: customerId || null})
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    const s = data.stats || {};
                    showToast(`✅ ${s.pushs_sent || 0} Pushs gesendet, ${s.pushs_failed || 0} failed`, 'success');
                    document.getElementById('quicksend-message').value = '';
                } else {
                    showToast(data.detail || 'Fehler beim Senden', 'error');
                }
            } catch (e) {
                showToast('Fehler: ' + e.message, 'error');
            } finally {
                if (btn) { btn.disabled = false; btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px;">send</span> Jetzt an alle senden'; }
            }
        }

        async function quickSendToCustomer(customerId, customerName) {
            const message = prompt(`Push-Nachricht an ${customerName}:\n\nNachricht eingeben:`);
            if (!message) return;
            try {
                const res = await fetch('/admin/loyalty/quick-send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify({message, customer_id: customerId})
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    showToast(`✅ Push an ${customerName} gesendet`, 'success');
                } else {
                    showToast(data.detail || 'Fehler', 'error');
                }
            } catch (e) {
                showToast('Fehler: ' + e.message, 'error');
            }
        }

        async function redeemReward(customerId, customerCode) {
            if (!confirm(`Prämie für Kunde ${customerCode} einlösen?\n\nStempel werden auf 0 zurückgesetzt.\nKunde bekommt Push-Notification.`)) return;
            try {
                const res = await fetch(`/admin/loyalty/redeem/${customerId}`, {
                    method: 'POST',
                    credentials: 'same-origin'
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    showToast(`🎁 Prämie eingelöst: ${data.reward_name}`, 'success');
                    loadLoyaltyCustomers();
                } else {
                    showToast(data.detail || 'Fehler beim Einlösen', 'error');
                }
            } catch (e) {
                showToast('Fehler: ' + e.message, 'error');
            }
        }

        async function createLoyaltyCampaign(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            try {
                const res = await fetch('/admin/loyalty/campaign', {
                    method: 'POST',
                    body: formData,
                    credentials: 'same-origin'
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    showToast('✅ Kampagne erstellt!', 'success');
                    form.reset();
                    loadLoyaltyDashboard();
                } else {
                    showToast(data.detail || 'Fehler', 'error');
                }
            } catch (e) {
                showToast('Netzwerkfehler: ' + e.message, 'error');
            }
        }

        async function deleteLoyaltyCampaign(id) {
            if (!confirm('Kampagne löschen?')) return;
            try {
                const res = await fetch(`/admin/loyalty/campaign/${id}`, {
                    method: 'DELETE',
                    credentials: 'same-origin'
                });
                if (res.ok) {
                    showToast('Kampagne gelöscht', 'success');
                    loadLoyaltyDashboard();
                }
            } catch (e) {
                showToast('Fehler: ' + e.message, 'error');
            }
        }

        async function saveLoyaltyGeofence(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            try {
                const res = await fetch('/admin/loyalty/geofence', {
                    method: 'POST',
                    body: formData,
                    credentials: 'same-origin'
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    showToast('✅ GPS-Standort gespeichert!', 'success');
                } else {
                    showToast(data.detail || 'Fehler', 'error');
                }
            } catch (e) {
                showToast('Netzwerkfehler: ' + e.message, 'error');
            }
        }

        function detectGeolocation() {
            if (!navigator.geolocation) {
                showToast('Geolocation nicht verfügbar', 'error');
                return;
            }
            showToast('📍 Standort wird ermittelt...', 'info');
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('loyalty-geofence-lat').value = pos.coords.latitude.toFixed(6);
                document.getElementById('loyalty-geofence-lng').value = pos.coords.longitude.toFixed(6);
                showToast('✅ Standort erkannt!', 'success');
            }, err => {
                // Bessere Fehlermeldungen je nach Fehlercode
                let msg = err.message;
                if (err.code === 1) {
                    msg = 'Zugriff verweigert. Bitte erlaube Standortzugriff in deinen Browser-Einstellungen.';
                } else if (err.code === 2) {
                    msg = 'Standort nicht verfügbar. Prüfe deine GPS/Internet-Verbindung.';
                } else if (err.code === 3) {
                    msg = 'Zeitüberschreitung. Versuche es erneut.';
                }
                showToast('Standort-Fehler: ' + msg, 'error');
            }, { enableHighAccuracy: false, timeout: 20000, maximumAge: 60000 });
        }

        function toggleCampaignFields(select) {
            const isInactivity = select.value === 'inactivity';
            document.querySelectorAll('.campaign-inactivity-field').forEach(el => {
                el.style.display = isInactivity ? '' : 'none';
            });
        }

        async function triggerInactivityCron() {
            if (!confirm('Inaktivitäts-Push an alle deine Kunden senden?')) return;
            try {
                const res = await fetch('/admin/loyalty/cron/inactivity', {
                    method: 'POST',
                    credentials: 'same-origin'
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    const s = data.stats || {};
                    showToast(`✅ ${s.pushs_sent || 0} Pushs gesendet, ${s.pushs_skipped_optout || 0} opt-out, ${s.pushs_skipped_cooldown || 0} cooldown`, 'success');
                } else {
                    showToast(data.detail || 'Fehler', 'error');
                }
            } catch (e) {
                showToast('Fehler: ' + e.message, 'error');
            }
        }

    
</script>
