        function toggleControlSplitCheckbox(key, item) {
            // BUG FIX (Bug 3): Kombi-Items als Einheit toggeln
            // WICHTIG: Nutze combo_instance_id (eindeutig pro Kombi-Bestellung)
            // NICHT combo_id (die ist für 2 gleiche Kombis identisch!)
            // Beispiel: 2× "Shisha + Cola" bestellt → combo_id=3 für beide,
            // aber combo_instance_id unterscheidet die beiden Kombis.
            // Non-Kombi-Items bleiben einzeln anklickbar.
            if (item.combo_id && item.combo_name && item.combo_instance_id) {
                // Kombi-Item: alle Items mit gleicher combo_instance_id finden
                const isCurrentlyChecked = !!selectedControlSplitItems[key];
                if (isCurrentlyChecked) {
                    // Alle Items mit gleicher combo_instance_id deselecten
                    Object.keys(selectedControlSplitItems).forEach(k => {
                        const sel = selectedControlSplitItems[k];
                        if (sel.combo_instance_id === item.combo_instance_id) {
                            delete selectedControlSplitItems[k];
                        }
                    });
                } else {
                    // Alle Items mit gleicher combo_instance_id selecten
                    allOrders.forEach(o => {
                        if (o.id === item.order_id && o.items) {
                            o.items.forEach(it => {
                                if (it.combo_instance_id === item.combo_instance_id && (it.item_status || 'pending') !== 'pending') {
                                    // Delivered Item — für Teilzahlung relevant
                                    const noteSlug = (it.note || '').replace(/\s+/g, '_');
                                    const status = it.item_status || 'delivered';
                                    const comboIdKey = it.combo_id || '';
                                    const comboInstKey = it.combo_instance_id || '';
                                    // BUG FIX: combo_instance_id AUCH in key — sonst haben 2
                                    // Kombis denselben key und beide werden zusammen ausgewählt
                                    for (let idx = 0; idx < it.quantity; idx++) {
                                        const comboKey = `${o.id}_${it.product_id}_${noteSlug}_${status}_${comboIdKey}_${comboInstKey}_${idx}`;
                                        if (!selectedControlSplitItems[comboKey]) {
                                            selectedControlSplitItems[comboKey] = {
                                                order_id: o.id,
                                                product_id: it.product_id,
                                                price: it.price,
                                                name: it.name,
                                                note: it.note,
                                                quantity: 1,
                                                selectedQty: 1,
                                                combo_id: it.combo_id,
                                                combo_name: it.combo_name,
                                                combo_instance_id: it.combo_instance_id
                                            };
                                        }
                                    }
                                }
                            });
                        }
                    });
                }
            } else {
                // Non-Kombi-Item: normal toggeln (wie bisher)
                if (selectedControlSplitItems[key]) {
                    delete selectedControlSplitItems[key];
                } else {
                    selectedControlSplitItems[key] = {
                        order_id: item.order_id,
                        product_id: item.product_id,
                        price: item.price,
                        name: item.name,
                        note: item.note,
                        quantity: item.quantity,
                        selectedQty: item.quantity,
                        // BUG FIX: combo_instance_id speichern — sonst wird es beim
                        // Gruppieren in submitControlSplitPayment nicht mitgesendet
                        combo_instance_id: item.combo_instance_id || null
                    };
                }
            }
            refreshControlModal();
        }

        function adjustControlSplitQty(key, delta, maxQty) {
            if (selectedControlSplitItems[key]) {
                let current = selectedControlSplitItems[key].selectedQty;
                let next = current + delta;
                if (next >= 1 && next <= maxQty) {
                    selectedControlSplitItems[key].selectedQty = next;
                    refreshControlModal();
                }
            }
        }

        function updateControlSplitSummary() {
            let splitTotal = 0.0;
            let count = 0;
            
            Object.keys(selectedControlSplitItems).forEach(key => {
                const item = selectedControlSplitItems[key];
                splitTotal += item.price * item.selectedQty;
                count++;
            });
            
            const summary = document.getElementById('control-split-cockpit');
            const totalText = document.getElementById('control-split-sum');
            const btnTeil = document.getElementById('btn-control-split');
            
            if (count > 0) {
                if (summary) summary.classList.remove('hidden');
                if (totalText) totalText.textContent = `${splitTotal.toFixed(2).replace('.', ',')} €`;
                if (btnTeil) {
                    btnTeil.disabled = false;
                    btnTeil.className = "flex-1 bg-gastro hover:bg-emerald-700 text-white font-bold text-xs py-2.5 rounded-xl transition shadow";
                }
            } else {
                if (summary) summary.classList.add('hidden');
                if (btnTeil) {
                    btnTeil.disabled = true;
                    btnTeil.className = "flex-1 bg-gray-300 text-gray-500 font-bold text-xs py-2.5 rounded-xl cursor-not-allowed";
                }
            }
        }

        function _acquireServeLock() {
            if (_serveLock) return false;
            _serveLock = true;
            if (_serveLockTimer) clearTimeout(_serveLockTimer);
            // SECURITY FIX (audit 4.8): Auto-Release von 300 ms auf 5000 ms erhöht.
            // Bei langsamen Mobilfunk (300–1500 ms Latenz) war der Lock vorher weg,
            // bevor der Fetch-Response kam → Kellner klickt erneut → 2. serve-Request
            // feuert, weil _acquireServeLock() jetzt true zurückgibt. 5000 ms sind
            // Deadlock-Schutz, kein Ersatz für finally _releaseServeLock() im Caller.
            _serveLockTimer = setTimeout(() => { _serveLock = false; _serveLockTimer = null; }, 5000);
            return true;
        }
        function _releaseServeLock() {
            if (_serveLockTimer) {
                clearTimeout(_serveLockTimer);
                _serveLockTimer = null;
            }
            _serveLock = false;
        }

        async function serveControlItem(itemKey, orderId, evt) {
            if (!_acquireServeLock()) return;
            // Loading-State am Button — sofort sichtbar
            let btn = null;
            if (evt && evt.currentTarget) {
                btn = evt.currentTarget;
                btn.disabled = true;
                btn.dataset._origHtml = btn.innerHTML;
                btn.innerHTML = '<span class="material-symbols-outlined text-base animate-spin">progress_activity</span>';
            }

            // ── Optimistic Update: SOFORT ausführen (vor fetch) ──
            // Track optimistic serve
            const cmParts = itemKey.split('_');
            let shortKey = itemKey;
            if (cmParts.length >= 4 && cmParts[0] === String(orderId)) {
                const withoutOrderId = cmParts.slice(1);
                if (/^\d+$/.test(withoutOrderId[withoutOrderId.length - 1])) {
                    shortKey = withoutOrderId.slice(0, -1).join('_');
                } else {
                    shortKey = withoutOrderId.join('_');
                }
            }
            _trackOptimisticServe(orderId, shortKey);

            // Optimistic DOM Update — sofort sichtbar für Kellner
            allOrders.forEach(o => {
                if (o.id === orderId && o.items) {
                    const parts = itemKey.split('_');
                    if (parts.length >= 4 && parts[parts.length - 1].match(/^\d+$/)) parts.pop();
                    if (parts.length >= 2 && parts[0] === String(orderId)) parts.shift();
                    const cleanKey = parts.join('_');
                    const matchedItem = o.items.find(i => {
                        const noteSlug = (i.note || '').replace(/\s+/g, '_');
                        const status = i.item_status || 'pending';
                        const iComboId = i.combo_id || '';
                        // BUG FIX: combo_instance_id in Match aufnehmen — sonst matched
                        // der optimistic update nicht bei Kombi-Items und Kellner muss
                        // 2× klicken (cleanKey enthält combo_instance_id, Match aber nicht)
                        const iComboInstId = i.combo_instance_id || '';
                        return `${i.product_id}_${noteSlug}_${status}_${iComboId}_${iComboInstId}` === cleanKey;
                    });
                    if (matchedItem) {
                        if (matchedItem.quantity > 1) {
                            matchedItem.quantity -= 1;
                            let delivered = o.items.find(i => {
                                const noteSlug = (i.note || '').replace(/\s+/g, '_');
                                // BUG FIX: combo_instance_id muss auch matchen — sonst werden
                                // 2 Kombis mit gleicher product_id falsch gemerged
                                return i.product_id === matchedItem.product_id && noteSlug === (matchedItem.note || '').replace(/\s+/g, '_') && i.item_status === 'delivered' && (i.combo_instance_id || null) === (matchedItem.combo_instance_id || null);
                            });
                            if (delivered) delivered.quantity += 1;
                            else o.items.push({...matchedItem, quantity: 1, item_status: 'delivered'});
                        } else {
                            matchedItem.item_status = 'delivered';
                            let delivered = o.items.find(i => {
                                const noteSlug = (i.note || '').replace(/\s+/g, '_');
                                // BUG FIX: combo_instance_id muss auch matchen
                                return i !== matchedItem && i.product_id === matchedItem.product_id && noteSlug === (matchedItem.note || '').replace(/\s+/g, '_') && i.item_status === 'delivered' && (i.combo_instance_id || null) === (matchedItem.combo_instance_id || null);
                            });
                            if (delivered) {
                                delivered.quantity += matchedItem.quantity;
                                o.items = o.items.filter(i => i !== matchedItem);
                            }
                        }
                    }
                }
            });
            refreshControlModal();

            // ── Serve Lock SOFORT freigeben (nach optimistic update) ──
            // Vorher: Lock wurde erst nach fetch-Response freigegeben (1-3s blockiert!)
            // Jetzt: Lock nach optimistic DOM update freigeben → Kellner kann sofort
            // den nächsten Artikel servieren ohne zu warten.
            _releaseServeLock();

            // ── Fetch im Hintergrund (fire-and-forget) ──
            // Fehler werden nur geloggt, nicht blockiert — optimistic update ist bereits sichtbar.
            fetch('/admin/orders/serve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: orderId, item_key: itemKey })
            }).then(res => {
                if (!res.ok) {
                    console.warn('[Serve] Server error for order', orderId);
                    checkLiveTischeUpdates(); // Sync with server if error
                }
            }).catch(err => {
                console.warn('[Serve] Network error:', err);
                checkLiveTischeUpdates();
            });
        }

        async function serveAllControlPending() {
            if (!_acquireServeLock()) return;
            if (!controlModalActiveTableNum) { _releaseServeLock(); return; }
            const tableOrders = allOrders.filter(o => {
                const tableStr = String(o.table || '').trim();
                if (controlModalActiveTableZone) {
                    const exactTableStr = `Tisch ${controlModalActiveTableNum} (${controlModalActiveTableZone})`;
                    return (tableStr === exactTableStr || tableStr === controlModalActiveTableNum) && o.status !== 'bezahlt' && o.status !== 'storniert';
                } else {
                    const regex = new RegExp(`^Tisch\\s+${controlModalActiveTableNum}(\\s*\\(|$)`);
                    return regex.test(tableStr) && o.status !== 'bezahlt' && o.status !== 'storniert';
                }
            });
            
            const orderIds = [];
            tableOrders.forEach(o => {
                if (o.items && o.items.some(i => (i.item_status || 'pending') !== 'delivered')) {
                    orderIds.push(o.id);
                    // Track optimistic serve-all for each order
                    _trackOptimisticServeAll(o.id);
                    o.items.forEach(i => {
                        if ((i.item_status || 'pending') !== 'delivered') {
                            i.item_status = 'delivered';
                        }
                    });
                }
            });
            
            if (orderIds.length === 0) { _releaseServeLock(); return; }
            refreshControlModal();
            
            try {
                const promises = orderIds.map(orderId => 
                    fetch('/admin/orders/serve', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ order_id: orderId })
                    })
                );
                const results = await Promise.all(promises);
                if (!results.every(r => r.ok)) {
                    showToast("Einige Artikel konnten nicht serviert werden", "error");
                }
                checkLiveTischeUpdates();
            } catch (e) {
                showToast("Verbindungsfehler beim Servieren", "error");
                checkLiveTischeUpdates();
            } finally {
                _releaseServeLock();
            }
        }

        let _cancelControlInProgress = false;

        // ── MUTEX STATE FOR MUTATION HANDLERS (audit 4.3 / 4.4 / 4.10 / 4.11) ──
        // Verhindert Doppelbuchungen durch Doppelklick im 200–600 ms Fenster
        // zwischen Button-Render und Server-Response. Jeder Flag wird am Anfang
        // der Funktion geprüft und gesetzt, im finally-Block zurückgesetzt.
        let _closeTableInProgress = false;
        let _controlSplitPayInProgress = false;
        let _bezahlenInProgress = false;
        let _stornierenInProgress = false;

        // ── Hilfsfunktion: Optimistic Cancel für lokales allOrders ──
        // Spiegelt die serveControlItem-Logik wider — findet das Item per
        // composite key und dekrementiert/entfernt es. Wird VOR dem fetch
        // ausgeführt, damit der Kellner sofortiges Feedback sieht.
        function _applyOptimisticCancel(orderId, itemKey, qty) {
            allOrders.forEach(o => {
                if (o.id !== orderId || !o.items) return;
                const parts = itemKey.split('_');
                if (parts.length >= 4 && parts[parts.length - 1].match(/^\d+$/)) parts.pop();
                if (parts.length >= 2 && parts[0] === String(orderId)) parts.shift();
                const cleanKey = parts.join('_');
                const matchedItem = o.items.find(i => {
                    const noteSlug = (i.note || '').replace(/\s+/g, '_');
                    const status = i.item_status || 'pending';
                    const iComboId2 = i.combo_id || '';
                    // BUG FIX: combo_instance_id in Match aufnehmen — sonst matched
                    // der optimistic cancel nicht bei Kombi-Items
                    const iComboInstId2 = i.combo_instance_id || '';
                    return `${i.product_id}_${noteSlug}_${status}_${iComboId2}_${iComboInstId2}` === cleanKey;
                });
                if (!matchedItem) return;
                matchedItem.quantity = Math.max(0, matchedItem.quantity - qty);
                if (matchedItem.quantity <= 0) {
                    o.items = o.items.filter(i => i !== matchedItem);
                }
                // Order-Total neu berechnen (damit UI-Summen stimmen)
                o.total = (o.items || []).reduce((s, i) => s + (i.price || 0) * (i.quantity || 0), 0);
                o.total = Math.round(o.total * 100) / 100;
                if (o.total_with_tip !== undefined) o.total_with_tip = o.total;
                // Wenn keine Items mehr: Status auf 'storniert' setzen (UI schließt Popup)
                if (!o.items || o.items.length === 0) {
                    o.status = 'storniert';
                }
            });
        }

        async function cancelControlItem(itemKey, orderId, maxQty, itemName) {
            // Race Condition Schutz
            if (_cancelControlInProgress) return;
            _cancelControlInProgress = true;

            let qty = maxQty;
            if (maxQty > 1) {
                const qtyStr = prompt(`Wie viele ${itemName} stornieren? (Max: ${maxQty})`, maxQty);
                if (qtyStr === null) { _cancelControlInProgress = false; return; }
                qty = parseInt(qtyStr, 10);
                if (isNaN(qty) || qty < 1 || qty > maxQty) {
                    showToast('Ungültige Menge', 'error');
                    _cancelControlInProgress = false;
                    return;
                }
            }

            // ── Optimistic Update: SOFORT ausführen (vor fetch) ──
            // Gleiche Pattern wie serveControlItem — Kellner sieht sofortiges
            // Feedback, fetch läuft im Hintergrund. Vorher: await fetch +
            // await checkLiveTischeUpdates + refreshControlModal = 2-4 s blockiert.
            _applyOptimisticCancel(orderId, itemKey, qty);
            showToast(`✅ ${qty}x ${itemName} storniert`, 'success');
            if (controlModalActiveTableNum) refreshControlModal();

            // ── Lock SOFORT freigeben (nach optimistic update) ──
            _cancelControlInProgress = false;

            // ── Fetch im Hintergrund (fire-and-forget) ──
            // Fehler werden nur geloggt — bei Diskrepanz sync via checkLiveTischeUpdates.
            fetch(`/${slug}/tablet/cancel-item/${orderId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item_key: itemKey, quantity: qty })
            }).then(res => {
                if (!res.ok && res.status !== 404 && res.status !== 400) {
                    // Nur bei echten Fehlern (nicht 404/400 = idempotent) resyncen.
                    console.warn('[Cancel] Server error for order', orderId);
                    checkLiveTischeUpdates();
                }
            }).catch(err => {
                console.warn('[Cancel] Network error:', err);
                checkLiveTischeUpdates();
            });
        }

        // ── Hilfsfunktion: Optimistic Split-Pay für lokales allOrders ──
        // Bug 1 + Bug 2 Fix: Spiegelt die Backend-Logik aus admin_split_pay
        // wider — pro (product_id, note, combo_instance_id) wird die selectedQty
        // vom Item abgezogen, Items mit quantity<=0 entfernt, Order-Total neu
        // berechnet, Status auf 'bezahlt' gesetzt falls keine Items mehr.
        // Wird VOR dem fetch ausgeführt, damit der Kellner sofortiges Feedback
        // sieht und die Tisch-Cockpit-Beträge sofort stimmen.
        function _applyOptimisticSplitPay(groups) {
            const affectedOrderIds = [];
            Object.keys(groups).forEach(orderIdStr => {
                const orderId = parseInt(orderIdStr);
                const order = allOrders.find(o => o.id === orderId);
                if (!order || !order.items) return;
                affectedOrderIds.push(orderId);

                // Gruppe selektierter Items nach (product_id, note, combo_instance_id),
                // selbe Logik wie der Payload fürs Backend weiter unten.
                const groupedMap = {};
                groups[orderIdStr].forEach(item => {
                    const noteKey = item.note || "";
                    const comboInstKey = item.combo_instance_id || '';
                    const groupKey = `${item.product_id}_${noteKey}_${comboInstKey}`;
                    if (!groupedMap[groupKey]) {
                        groupedMap[groupKey] = {
                            product_id: item.product_id,
                            quantity: 0,
                            note: item.note || null,
                            combo_instance_id: item.combo_instance_id || null
                        };
                    }
                    groupedMap[groupKey].quantity += item.selectedQty;
                });

                // Backend-Logik 1:1 nachgebaut — qty dekrementieren, ggf. entfernen
                Object.values(groupedMap).forEach(sel => {
                    const split_note = (sel.note || "").trim();
                    const split_combo_inst = sel.combo_instance_id || null;
                    const matchedItem = order.items.find(it =>
                        it.product_id === sel.product_id &&
                        (it.note || '').trim() === split_note &&
                        (it.combo_instance_id || null) === split_combo_inst
                    );
                    if (!matchedItem) return;
                    const qtyToPay = Math.min(sel.quantity, matchedItem.quantity);
                    if (qtyToPay <= 0) return;
                    matchedItem.quantity -= qtyToPay;
                    if (matchedItem.quantity <= 0) {
                        order.items = order.items.filter(i => i !== matchedItem);
                    }
                });

                // Order-Total neu berechnen (damit UI-Summen stimmen)
                order.total = Math.round(
                    (order.items || []).reduce((s, i) => s + (i.price || 0) * (i.quantity || 0), 0) * 100
                ) / 100;
                if (order.total_with_tip !== undefined) order.total_with_tip = order.total;

                // Wenn keine Items mehr: Status auf 'bezahlt' setzen (wie Backend)
                if (!order.items || order.items.length === 0) {
                    order.status = 'bezahlt';
                }
            });
            return affectedOrderIds;
        }

        async function submitControlSplitPayment() {
            // SECURITY FIX (audit 4.10): Mutex + Button-Disable, damit Doppelklick nicht
            // 2× parallele split-pay-Requests feuert (Doppelbuchung von Teilzahlungen).
            if (_controlSplitPayInProgress) return;
            const groups = {};
            Object.keys(selectedControlSplitItems).forEach(key => {
                const item = selectedControlSplitItems[key];
                if (!groups[item.order_id]) groups[item.order_id] = [];
                groups[item.order_id].push(item);
            });

            if (Object.keys(groups).length === 0) return;

            const submitBtn = document.getElementById('btn-control-split');
            _controlSplitPayInProgress = true;
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.dataset._origHtml = submitBtn.innerHTML;
                submitBtn.innerHTML = '⏳ Verarbeite…';
                submitBtn.classList.add('opacity-60', 'cursor-not-allowed');
            }

            // ── BUG 1 + BUG 2 FIX: OPTIMISTIC UPDATE VOR dem fetch ──
            // Früher: await Promise.all(promises) + await checkLiveTischeUpdates()
            //         → UI 2-4 s blockiert ("⏳ Verarbeite…"), und Tisch-Cockpit
            //         zeigte alte Beträge bis der zweite Server-Request fertig war.
            // Jetzt: Teilzahlung wird SOFORT lokal auf allOrders angewendet
            //        (< 50 ms). Kellner sieht neues Betrag/Status sofort.
            //        Tisch-Cockpit-Kacheln werden sofort neu gerendert (Bug 2).
            //        fetch läuft im Hintergrund (fire-and-forget, kein await).
            const affectedOrderIds = _applyOptimisticSplitPay(groups);
            _trackOptimisticSplitPay(affectedOrderIds);

            // Auswahl leeren + sofort UI-Feedback
            selectedControlSplitItems = {};
            showToast("Teilzahlung gebucht!", "success");

            // Modal aktualisieren (zeigt neue Items/Totals — Bug 1: sofort sichtbar)
            if (controlModalActiveTableNum) refreshControlModal();

            // Bug 2 Fix: Tisch-Cockpit-Kacheln sofort neu rendern, damit die
            // Betäge auf allen Tischen korrekt sind (vorher: stale bis zum
            // manuellen Aktualisieren oder bis checkLiveTischeUpdates fertig war).
            if (!isEditMode) renderSitzplanTiles();

            // Auto-Close: Wenn keine aktiven Orders mehr auf diesem Tisch → Modal schließen
            // (basiert jetzt auf dem optimistischen allOrders-Zustand, der mit dem
            // Backend-Zustand identisch ist — keine Race-Condition mehr).
            if (controlModalActiveTableNum) {
                const remainingOrders = allOrders.filter(o => {
                    const t = String(o.table || '').trim();
                    if (controlModalActiveTableZone) {
                        const exact = `Tisch ${controlModalActiveTableNum} (${controlModalActiveTableZone})`;
                        return (t === exact || t === controlModalActiveTableNum) && o.status !== 'bezahlt' && o.status !== 'storniert';
                    }
                    const regex = new RegExp(`^Tisch\\s+${controlModalActiveTableNum}(\\s*\\(|$)`);
                    return regex.test(t) && o.status !== 'bezahlt' && o.status !== 'storniert';
                });
                if (remainingOrders.length === 0) { closeControlModal(); }
            }

            // ── Lock SOFORT freigeben (nach optimistic update) ──
            // Kellner kann sofort weitere Aktionen durchführen (z.B. nächste
            // Teilzahlung, Serve, Cancel). fetch läuft unabhängig im Hintergrund.
            _controlSplitPayInProgress = false;
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = submitBtn.dataset._origHtml || submitBtn.innerHTML;
                submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                delete submitBtn.dataset._origHtml;
            }

            // ── Fetch im Hintergrund (fire-and-forget, KEIN await) ──
            // Bug 1 Fix: Der blockierende `await Promise.all(...)` ist entfernt —
            // die UI reagiert sofort. Bei Diskrepanz sync via checkLiveTischeUpdates.
            const promises = Object.keys(groups).map(orderId => {
                const groupedMap = {};
                groups[orderId].forEach(item => {
                    const noteKey = item.note || "";
                    // BUG FIX: combo_instance_id in groupKey aufnehmen — sonst werden
                    // 2 Kombis mit gleicher product_id in einen gruppierten Eintrag
                    // gepackt → falsche Kombi wird bei Teilzahlung abgezogen
                    const comboInstKey = item.combo_instance_id || '';
                    const groupKey = `${item.product_id}_${noteKey}_${comboInstKey}`;
                    if (!groupedMap[groupKey]) {
                        groupedMap[groupKey] = {
                            product_id: item.product_id,
                            quantity: 0,
                            note: item.note || null,
                            combo_instance_id: item.combo_instance_id || null
                        };
                    }
                    groupedMap[groupKey].quantity += item.selectedQty;
                });

                const payload = {
                    order_id: parseInt(orderId),
                    items: Object.values(groupedMap)
                };
                return fetch('/admin/orders/split-pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            });

            Promise.all(promises).then(results => {
                if (results.every(r => r.ok)) {
                    // Erfolg → Hintergrund-Sync für Drift-Korrektur (nicht blockierend).
                    // Protected durch _optimisticSplitPays: der Live-Poll überschreibt
                    // die lokalen optimistischen Items/Totals nicht mit potenziell
                    // stale-gecachten Daten vom Server.
                    checkLiveTischeUpdates();
                } else {
                    // Server-Error (z.B. 400/500) → Protection aufheben + resyncen.
                    // Nach Resync zeigt die UI den echten (nicht-teilbezahlten) Zustand.
                    _clearOptimisticSplitPay(affectedOrderIds);
                    showToast("Fehler bei Teilzahlung — synchronisiere…", "error");
                    checkLiveTischeUpdates();
                }
            }).catch(err => {
                // Netzwerkfehler → gleicher Resync-Pfad wie oben.
                console.warn('[Split-Pay] Network error:', err);
                _clearOptimisticSplitPay(affectedOrderIds);
                showToast("Verbindungsfehler — synchronisiere…", "error");
                checkLiveTischeUpdates();
            });
        }

        async function closeTableControl() {
            if (!controlModalActiveTableNum) return;
            // SECURITY FIX (audit 4.3): Mutex gegen Doppelklick — sonst feuert Doppelklick
            // 2× Promise.all über alle Tisch-Orders → 2× bezahlen pro Bon → Doppel-Umsatz.
            if (_closeTableInProgress) return;
            if (!confirm(`Tisch ${controlModalActiveTableNum} komplett abrechnen? Hat der Kunde bezahlt?`)) {
                return;
            }
            _closeTableInProgress = true;
            const closeBtn = document.getElementById('control-close-table');
            if (closeBtn) {
                closeBtn.disabled = true;
                closeBtn.dataset._origHtml = closeBtn.innerHTML;
                closeBtn.innerHTML = '⏳ Schließe…';
                closeBtn.classList.add('opacity-60', 'cursor-not-allowed');
            }

            const tableOrders = allOrders.filter(o => {
                const tableStr = String(o.table || '').trim();
                if (controlModalActiveTableZone) {
                    const exactTableStr = `Tisch ${controlModalActiveTableNum} (${controlModalActiveTableZone})`;
                    return (tableStr === exactTableStr || tableStr === controlModalActiveTableNum) && o.status !== 'bezahlt' && o.status !== 'storniert';
                } else {
                    const regex = new RegExp(`^Tisch\\s+${controlModalActiveTableNum}(\\s*\\(|$)`);
                    return regex.test(tableStr) && o.status !== 'bezahlt' && o.status !== 'storniert';
                }
            });
            
            if (tableOrders.length === 0) {
                _closeTableInProgress = false;
                if (closeBtn) {
                    closeBtn.disabled = false;
                    closeBtn.innerHTML = closeBtn.dataset._origHtml || closeBtn.innerHTML;
                    closeBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                    delete closeBtn.dataset._origHtml;
                }
                return;
            }
            
            try {
                const promises = tableOrders.map(o => {
                    return fetch(`/${slug}/tablet/bezahlen/${o.id}`, {
                        method: 'POST'
                    });
                });
                
                const results = await Promise.all(promises);
                if (results.every(r => r.ok)) {
                    showToast(`Tisch ${controlModalActiveTableNum} vollständig geschlossen!`, "success");
                    closeControlModal();
                    await checkLiveTischeUpdates();
                } else {
                    showToast("Fehler beim Schließen des Tisches", "error");
                }
            } catch (e) {
                showToast("Verbindungsfehler", "error");
            } finally {
                _closeTableInProgress = false;
                if (closeBtn) {
                    closeBtn.disabled = false;
                    closeBtn.innerHTML = closeBtn.dataset._origHtml || closeBtn.innerHTML;
                    closeBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                    delete closeBtn.dataset._origHtml;
                }
            }
        }
        
        let activeOrderId   = null;
        let tableSel_mode   = null;
        let sitzplanFilterZone = 'gesamt';

        let seenOrderIds    = new Set();
        let seenCallIds     = new Set();
        const MAX_SEEN_IDS = 500; // Memory-Leak-Schutz: max 500 IDs, dann älteste löschen
        let initialDone     = false;

        // ── AUDIO SYSTEM ──
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (Ctx) audioCtx = new Ctx();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
        }
        document.addEventListener('click', initAudio, false);
        document.addEventListener('touchstart', initAudio, false);

        function playBeep(freq, dur, type = 'sine', vol = 0.15) {
            try {
                initAudio();
                if (!audioCtx) return;
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                o.frequency.exponentialRampToValueAtTime(freq * 1.4, audioCtx.currentTime + dur * .4);
                g.gain.setValueAtTime(vol, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + dur);
            } catch (e) {}
        }
        const playNewOrderSound = () => {
            playBeep(880, .5, 'sine', .18);
            setTimeout(() => playBeep(1100, .3, 'sine', .12), 200);
        };
        const playServiceSound = () => {
            [0, 200].forEach((d, i) => setTimeout(() => playBeep(i ? 880 : 660, .18, 'square', .09), d));
        };

        // ── REAL-TIME POLLING & WEBSOCKETS ──
        let lastLiveTischeHash = null;
        let ws = null;
        let pollInterval = null;
        let wsHeartbeatInterval = null;
        let serverTimeOffset = 0;
        let wsRetryCount = 0;
        const WS_MAX_RETRIES = 10;

        function connectWebSocket() {
            if (wsRetryCount >= WS_MAX_RETRIES) {
                console.warn(`WebSocket: Max retries (${WS_MAX_RETRIES}) reached. Using polling only.`);
                startFallbackPolling();
                return;
            }

            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${protocol}//${window.location.host}/ws/${slug}`;
            
            console.log("Admin connecting to WebSocket at", wsUrl, `(attempt ${wsRetryCount + 1}/${WS_MAX_RETRIES})`);
            ws = new WebSocket(wsUrl);
            
            let pongReceived = true;
            
            ws.onopen = () => {
                console.log("Admin WebSocket connected!");
                wsRetryCount = 0; // Reset on successful connect
                // Keep polling but at slower rate (5s) as backup alongside WebSocket
                if (pollInterval) {
                    clearInterval(pollInterval);
                    pollInterval = null;
                }
                // Polling 2s — Kellner sehen neue Bestellungen in 2s
                pollInterval = setInterval(checkLiveTischeUpdates, 2000);
                checkLiveTischeUpdates();
                // ── WS-RECONNECT CATCH-UP ──
                // Wenn der WS kurz getrennt war (z.B. 5-30s), konnten wir Broadcasts
                // für neue Bestellungen / Service-Rufe verpassen. Die Polling-Fallback
                // hat die UI zwar aktuell gehalten, aber der SOUND fehlt für Bestellungen,
                // die während der Trennung reingekommen sind — weil seenOrderIds nur
                // IDs speichert, für die wir einen WS-Message gesehen haben.
                // Hier holen wir den aktuellen Stand und spielen für alle "eingegangen"-
                // Bestellungen, die wir noch nicht gesehen haben, den Sound nach.
                catchUpMissedAlerts();
                
                pongReceived = true;
                if (wsHeartbeatInterval) clearInterval(wsHeartbeatInterval);
                wsHeartbeatInterval = setInterval(() => {
                    if (!pongReceived) {
                        console.warn("WebSocket heartbeat timeout (no pong received). Closing connection...");
                        if (ws) ws.close();
                        return;
                    }
                    pongReceived = false;
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: "ping" }));
                    }
                }, 15000);
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "pong") {
                        pongReceived = true;
                    } else if (data.type === "new_order") {
                        // Play sound IMMEDIATELY on WebSocket receipt — zero latency
                        if (initialDone && !seenOrderIds.has(data.order_id)) {
                            playNewOrderSound();
                            seenOrderIds.add(data.order_id);
                            // Memory-Leak-Schutz: Set begrenzen
                            if (seenOrderIds.size > MAX_SEEN_IDS) {
                                const arr = [...seenOrderIds];
                                seenOrderIds = new Set(arr.slice(-MAX_SEEN_IDS / 2));
                            }
                        }
                        // Also trigger full data refresh
                        checkLiveTischeUpdates();
                    } else if (data.type === "service_call") {
                        // Play service sound IMMEDIATELY on WebSocket receipt
                        if (initialDone && !seenCallIds.has(data.call_id)) {
                            playServiceSound();
                            seenCallIds.add(data.call_id);
                            // Memory-Leak-Schutz
                            if (seenCallIds.size > MAX_SEEN_IDS) {
                                const arr = [...seenCallIds];
                                seenCallIds = new Set(arr.slice(-MAX_SEEN_IDS / 2));
                            }
                        }
                        // Also trigger full data refresh
                        checkLiveTischeUpdates();
                    } else if (data.type === "update" || data.type === "refresh_tables") {
                        checkLiveTischeUpdates();
                        // Bei generellem Update: SuperGroups auch neu laden (falls Admin-Änderungen von anderer Session kommen)
                        loadSuperGroups();
                    }
                } catch (e) {
                    console.error("Failed to parse admin websocket message:", e);
                }
            };
            
            ws.onclose = (event) => {
                console.warn("Admin WebSocket closed.", event.code, event.reason);
                ws = null;
                if (wsHeartbeatInterval) {
                    clearInterval(wsHeartbeatInterval);
                    wsHeartbeatInterval = null;
                }
                // 4401 = Unauthorized – session expired, redirect to login
                if (event.code === 4401) {
                    console.warn("Admin WebSocket: Unauthorized. Redirecting to login...");
                    window.location.href = "/admin/login";
                    return;
                }
                startFallbackPolling();
                wsRetryCount++;
                // Exponential backoff: 5s, 10s, 20s, 40s... capped at 30s
                const delay = Math.min(5000 * Math.pow(2, wsRetryCount - 1), 30000);
                setTimeout(connectWebSocket, delay);
            };
            
            ws.onerror = (err) => {
                console.error("Admin WebSocket error:", err);
                ws.close();
            };
        }

        /**
         * WS-Reconnect Catch-Up:
         * Wird bei jedem erfolgreichen WS-(Re)connect aufgerufen. Prüft alle
         * aktuellen Bestellungen und Service-Rufe gegen die seenOrderIds /
         * seenCallIds Sets. Für alle "eingegangen"-Bestellungen und Service-Rufe,
         * die während der WS-Trennung reingekommen sind, wird der Sound nachgespielt
         * und die ID zum seen-Set hinzugefügt.
         *
         * Verhindert, dass der Admin eine Bestellung akustisch verpasst, wenn der
         * WS für ein paar Sekunden unterbrochen war (z.B. Netzwerk-Wackler,
         * Server-Restart, Tab im Hintergrund).
         */
        function catchUpMissedAlerts() {
            if (!initialDone) return;
            fetch(`/api/tablet-status`)
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (!data) return;
                    (data.orders || []).forEach(o => {
                        if (o.status === 'eingegangen' && !seenOrderIds.has(o.id)) {
                            console.log("WS-Reconnect catch-up: playing sound for missed order #" + o.id);
                            playNewOrderSound();
                            seenOrderIds.add(o.id);
                        }
                    });
                    (data.service_calls || []).forEach(c => {
                        if (!seenCallIds.has(c.id)) {
                            console.log("WS-Reconnect catch-up: playing sound for missed service call #" + c.id);
                            playServiceSound();
                            seenCallIds.add(c.id);
                        }
                    });
                })
                .catch(err => console.warn("catchUpMissedAlerts fetch failed:", err));
        }

        function startFallbackPolling() {
            if (!pollInterval) {
                console.log("Starting admin fallback polling interval (1.5s)");
                pollInterval = setInterval(checkLiveTischeUpdates, 1500);
            }
        }

        function startPolling() {
            // First run, populate seen list immediately so we don't beep for historical items
            fetch(`/api/tablet-status`)
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        (data.orders || []).forEach(o => { if (o.status === 'eingegangen') seenOrderIds.add(o.id); });
                        (data.service_calls || []).forEach(c => { seenCallIds.add(c.id); });
                        initialDone = true;
                        updateLiveTiles(data.orders || [], data.service_calls || [], data.tables || [], data.recent_cancellations || []);
                    }
                }).catch(()=>{});

            connectWebSocket();
            startFallbackPolling();
        }

        // ── PWA VISIBILITY CHANGE: Sofortiger Reconnect bei App-Wiederöffnung ──
        // KRITISCH für iOS Safari PWA: Wenn die App in den Hintergrund geht (Bildschirm
        // aus, App gewechselt), suspendiert iOS das JavaScript. WebSocket trennt sich,
        // setInterval/setTimeout stoppen. Beim Wiederöffnen feuert visibilitychange.
        //
        // Ohne diesen Handler: WS bleibt zu, Exponential-Backoff braucht 5-30s zum
        // Reconnect. In dieser Zeit kommen Bestellungen an die der Kellner nicht sieht.
        //
        // Mit diesem Handler: Sofortiger WS-Reconnect + State-Hole + Sound-Nachspiel
        // für verpasste Bestellungen. Kellner sieht alles in <1s nach App-Öffnung.
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('[PWA] Page hidden — JS will be suspended');
                return;
            }
            console.log('[PWA] Page became visible — reconnecting WebSocket immediately');
            wsRetryCount = 0;
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                connectWebSocket();
            }
            checkLiveTischeUpdates();
            if (initialDone) {
                catchUpMissedAlerts();
            }
        });

        // ── PAGESHOW: bfcache Handler ──
        // Browser Back/Forward Cache: WS ist tot nach bfcache-Wiederherstellung
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                console.log('[PWA] Page restored from bfcache — reconnecting WebSocket');
                wsRetryCount = 0;
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    connectWebSocket();
                }
                checkLiveTischeUpdates();
                if (initialDone) {
                    catchUpMissedAlerts();
                }
            }
        });

        function checkLiveTischeUpdates() {
            return fetch(`/api/tablet-status`)
                .then(res => {
                    if (res.status === 401 || res.status === 403) return null;
                    return res.json();
                })
                .then(data => {
                    if (!data) return;
                    if (data.server_time) {
                        serverTimeOffset = new Date() - new Date(data.server_time.replace(' ', 'T'));
                    }
                    try {
                        // Build state hash (including item statuses)
                        const safeOrders = data.orders || [];
                        const safeCalls = data.service_calls || [];
                        const safeTables = data.tables || [];
                        const safeCancellations = data.recent_cancellations || [];
                        const ordersState = safeOrders.map(o => {
                            const itemsStatusStr = (o.items || []).map(i => `${i.product_id}:${i.item_status || 'pending'}`).join(',');
                            return `${o.id}:${o.status}:${o.total}:${itemsStatusStr}`;
                        }).join('|');
                        const callsState = safeCalls.map(c => `${c.id}:${c.type}`).join('|');
                        const tablesState = safeTables.map(t => `${t.number}:${t.zone}:${t.active_session_token || ''}`).join('|');
                        const currentHash = `${ordersState}#${callsState}#${tablesState}`;

                        // Audio signals
                        if (initialDone) {
                            safeOrders.forEach(o => {
                                if (o.status === 'eingegangen' && !seenOrderIds.has(o.id)) {
                                    playNewOrderSound();
                                    seenOrderIds.add(o.id);
                                }
                            });
                            safeCalls.forEach(c => {
                                if (!seenCallIds.has(c.id)) {
                                    playServiceSound();
                                    seenCallIds.add(c.id);
                                }
                            });
                        }

                        // Always update if control modal is open, otherwise use hash to avoid unnecessary re-renders
                        if (controlModalActiveTableNum || lastLiveTischeHash === null || lastLiveTischeHash !== currentHash) {
                            updateLiveTiles(safeOrders, safeCalls, safeTables, safeCancellations);
                        }
                        lastLiveTischeHash = currentHash;

                        // Real-time KPI Card Updates — NUR Tagesumsatz-Card (immer "heute")
                        // Bug-Fix: Früher wurden auch Werte für "Monat"/"Letzter Monat" mit
                        // "heute"-Daten überschrieben → sprangen auf 0. Jetzt gibt es nur noch
                        // die Tagesumsatz-Card, die per Definition immer "heute" anzeigt.
                        if (data.stats) {
                            const elDayTotal = document.getElementById('kpi-day-total');
                            if (elDayTotal) {
                                // Netto-Modus: netto_7 + netto_19
                                // Brutto-Modus: brutto
                                const daySum = (PRICE_MODE === 'netto')
                                    ? (data.stats.netto_7 || 0) + (data.stats.netto_19 || 0)
                                    : (data.stats.brutto || 0);
                                elDayTotal.textContent = `${daySum.toFixed(2).replace('.', ',')} €`;
                            }

                            const elDayBons = document.getElementById('kpi-day-bons');
                            if (elDayBons) {
                                const count = data.stats.orders_count || 0;
                                elDayBons.textContent = `${count} ${count === 1 ? 'Bon' : 'Bons'}`;
                            }

                            const elDayAvg = document.getElementById('kpi-day-avg');
                            if (elDayAvg) {
                                const avg = data.stats.avg_basket || 0;
                                elDayAvg.textContent = `${avg.toFixed(2).replace('.', ',')} €`;
                            }

                            const feedContainer = document.getElementById('live-payments-feed');
                            if (feedContainer) {
                                if (!data.recent_payments || !data.recent_payments.length) {
                                    feedContainer.innerHTML = '<p class="text-center py-6 text-xs text-on-surface-variant font-medium">Bislang keine Verkäufe heute.</p>';
                                } else {
                                    feedContainer.innerHTML = data.recent_payments.map(p => {
                                        const timeStr = p.timestamp ? p.timestamp.substring(11, 16) : '--:--';
                                        return `
                                            <div class="flex flex-col gap-1 border-b border-outline-variant/40 pb-3 text-xs">
                                                <div class="flex justify-between items-center">
                                                    <span class="font-bold text-white">💰 ${p.table} (Bon #${p.daily_bon_number || p.id})</span>
                                                    <span class="font-mono text-zinc-500">${timeStr} Uhr</span>
                                                </div>
                                                <div class="flex justify-between items-center text-[11px] mt-0.5">
                                                    <span class="text-on-surface-variant font-semibold">Betrag: ${p.total.toFixed(2).replace('.', ',')} €</span>
                                                </div>
                                            </div>
                                        `;
                                    }).join('');
                                }
                            }
                        }
                    } catch (e) {
                        console.error("Error processing live updates:", e);
                    }
                })
                .catch(err => console.warn("Live status polling error:", err));
        }

        function updateLiveTiles(orders, serviceCalls, tables, cancellations) {
            try {
                // Merge live orders into allOrders instead of replacing.
                // Live API only returns active orders, but allOrders contains
                // the full history from server-side rendering.
                const liveOrdersMap = {};
                const liveOrderIds = new Set();
                (orders || []).forEach(o => { liveOrdersMap[o.id] = o; liveOrderIds.add(o.id); });

                // Build a Set of cancelled order IDs from the API response
                // (Backend liefert recent_cancellations — siehe main.py /api/tablet-status)
                const cancelledIds = new Set();
                (cancellations || []).forEach(c => { cancelledIds.add(c.id); });

                // Update existing orders with live data, add new ones,
                // and mark orders that disappeared from live API as completed
                const updatedIds = new Set();
                allOrders = allOrders.map(o => {
                    updatedIds.add(o.id);
                    if (liveOrdersMap[o.id]) {
                        const liveOrder = liveOrdersMap[o.id];
                        // ── Bug-Fix: Lokalen Final-Status (bezahlt/storniert) nie durch
                        // Live-Daten überschreiben. Server hat u.U. noch nicht propagiert.
                        const localFinal = (o.status === 'bezahlt' || o.status === 'storniert');
                        const liveFinal  = (liveOrder.status === 'bezahlt' || liveOrder.status === 'storniert');

                        // ── OPTIMISTIC SPLIT-PAY PROTECTION (Bug 2 Fix) ──
                        // Wenn der Kellner vor kurzem eine Teilzahlung gebucht hat
                        // (15s Window), könnte der Live-Poll veraltete (gecachte)
                        // Server-Daten zurückgeben, die die lokalen optimistischen
                        // Items/Totals überschreiben würden → "Teilrechnungsbetrag
                        // bleibt stehen"-Bug. Deshalb: lokale Items + Totals bewahren,
                        // aber Status vom Server übernehmen (falls Backend 'bezahlt'
                        // bereits propagiert hat). Muss VOR dem localFinal-Check
                        // passieren, weil sonst { ...liveOrder, status: o.status }
                        // die stale Items/Totals übernehmen würde.
                        if (_hasOptimisticSplitPay(o.id)) {
                            const mergedStatus = liveFinal ? liveOrder.status : o.status;
                            return {
                                ...liveOrder,
                                items: o.items,
                                total: o.total,
                                total_with_tip: o.total_with_tip,
                                original_total: o.original_total,
                                status: mergedStatus
                            };
                        }

                        if (localFinal && !liveFinal) {
                            // Server hat den Abschluss noch nicht propagiert — lokalen Final-Status bewahren.
                            return { ...liveOrder, status: o.status };
                        }
                        // ── OPTIMISTIC SERVE PROTECTION (vereinfacht & robust) ──
                        // Wenn der Kellner vor kurzem etwas serviert hat (innerhalb 10s),
                        // behalten wir die lokalen item_status — egal was der Server sendet.
                        // Das verhindert das "Zurückspringen" von Items nach Serve.
                        // BUG FIX: combo_instance_id in Match aufnehmen — sonst matched
                        // 2 Kombi-Items mit gleicher product_id auf das falsche Item.
                        // BUG FIX: Window von 5s auf 10s erhöht — Kellner klickt schnell
                        // und nach 5s kam Live-Sync zurück und hat Item überschrieben.
                        const pendingKeys = _optimisticServes.get(o.id);
                        if (pendingKeys && pendingKeys.size > 0 && liveOrder.items && o.items) {
                            const protectedOrder = { ...liveOrder };
                            protectedOrder.items = liveOrder.items.map(liveItem => {
                                // Suche lokales Item mit gleicher product_id + note + combo_instance_id
                                // BUG FIX: combo_instance_id ist wichtig für 2 gleiche Kombis!
                                const localItem = o.items.find(i =>
                                    String(i.product_id) === String(liveItem.product_id) &&
                                    (i.note || '').trim() === (liveItem.note || '').trim() &&
                                    (i.combo_instance_id || null) === (liveItem.combo_instance_id || null) &&
                                    (i.item_status || 'pending') === 'delivered'
                                );
                                // Wenn lokal als delivered markiert → delivered behalten!
                                if (localItem && (liveItem.item_status || 'pending') !== 'delivered') {
                                    return { ...liveItem, item_status: 'delivered' };
                                }
                                return liveItem;
                            });
                            return protectedOrder;
                        }
                        return liveOrder; // Use fresh live data
                    }
                    // ── Bug-Fix: Order war in allOrders, aber NICHT mehr in live API.
                    // Frühher: pauschal auf 'bezahlt' gesetzt → stornierte Bons wurden
                    // fälschlich als 'Bezahlt' angezeigt (Bon #209 Bug).
                    // Jetzt: Prüfe recent_cancellations aus der API-Response.
                    //   - Wenn Bon-ID in cancellations enthalten → status='storniert'
                    //   - Sonst: nur als 'bezahlt' markieren wenn vorher aktiv war
                    if (o.status !== 'bezahlt' && o.status !== 'storniert') {
                        if (cancelledIds.has(o.id)) {
                            return { ...o, status: 'storniert' };
                        }
                        return { ...o, status: 'bezahlt' };
                    }
                    return o;
                });
                // Add any new orders that weren't in allOrders
                (orders || []).forEach(o => {
                    if (!updatedIds.has(o.id)) {
                        allOrders.push(o);
                    }
                });
                
                allTables = tables;
                allCalls = serviceCalls;

                if (!isEditMode) {
                    renderSitzplanTiles();
                }

                const activeTab = localStorage.getItem('dl_admin_active_tab') || 'live';
                if (activeTab === 'live') {
                    renderServiceCallsAlerts();
                }
                
                // Live notification bar für Bestellungen entfernt (per User-Vorgabe)
                // Service-Rufe werden weiterhin angezeigt
                renderServiceCallsAlerts();
                
                // Update orders table if finanzen tab is active
                if (activeTab === 'finanzen') {
                    renderOrdersTable();
                }
                
                if (controlModalActiveTableNum) {
                    // BUG FIX: Control-Modal NICHT refreshen während optimistic serves aktiv.
                    // Sonst überschreibt der Poll das "serviert" mit alten Server-Daten.
                    const hasOptimisticServesAnyOrder = _optimisticServes.size > 0;
                    if (!hasOptimisticServesAnyOrder) {
                        refreshControlModal();
                    }
                }
            } catch (e) {
                console.error("Error updating live tiles:", e);
            }
        }

        // ── LIVE NOTIFICATION BAR (DEAD CODE REMOVED) ──
        // Die Funktionen renderLiveNotificationBar(), notifServeItem(),
        // notifServeAll() und notifResolveCall() wurden per User-Vorgabe
        // deaktiviert und hatten keine aktiven Aufrufer mehr.
        // Servieren läuft jetzt über das #control-modal (Kellner-Cockpit),
        // Service-Rufe über renderServiceCallsAlerts().
        // Behalten: <div id="live-notification-bar"> als leerer Container
        // (falls CSS es noch referenziert) — wirft keine Fehler mehr.

        // ── SITZPLAN RENDERING ──

        function isDrinnenZone(zone) {
            const z = (zone || '').toLowerCase().trim();
            return z === 'drinnen' || z === 'innen' || z === 'bar';
        }

        function isDraussenZone(zone) {
            const z = (zone || '').toLowerCase().trim();
            return z === 'draußen' || z === 'draussen' || z === 'terrasse';
        }

        // Aktualisiert die Tisch-Anzahlen in den Sitzplan-Tab-Buttons (Gesamt/Drinnen/Draußen).
        // Wird von renderSitzplanTiles aufgerufen — sobald Tische geladen/bearbeitet werden.
        function updateSeatingTabCounts() {
            const tables = isEditMode ? (tempTables || []) : (allTables || []);
            const drinnenCount = tables.filter(t => isDrinnenZone(t.zone)).length;
            const draussenCount = tables.filter(t => isDraussenZone(t.zone)).length;
            const gesamtCount = tables.length;
            // Aktive Tische = Tische mit offener Bestellung oder Service-Ruf
            const aktivCount = isEditMode ? 0 : tables.filter(t => isTableActive(t)).length;

            const elGesamt = document.getElementById('zone-count-gesamt');
            const elDrinnen = document.getElementById('zone-count-drinnen');
            const elDraussen = document.getElementById('zone-count-draussen');
            const elAktiv = document.getElementById('zone-count-aktiv');
            if (elGesamt) elGesamt.textContent = `(${gesamtCount})`;
            if (elDrinnen) elDrinnen.textContent = `(${drinnenCount})`;
            if (elDraussen) elDraussen.textContent = `(${draussenCount})`;
            if (elAktiv) elAktiv.textContent = `(${aktivCount})`;
        }

        // Hilfsfunktion: Ist ein Tisch aktiv? (Bestellung offen oder Service-Ruf aktiv)
        // Wird für den "Aktiv"-Tab verwendet, damit Kellner sofort aktive Tische sieht.
        function isTableActive(table) {
            const tNumStr = String(table.number);
            const currentZone = (table.zone || '').trim();
            const tsPlain = `Tisch ${tNumStr}`;
            const tsZone = currentZone ? `Tisch ${tNumStr} (${currentZone})` : tsPlain;

            // Aktive Bestellung? (status !== bezahlt && !== storniert)
            const hasOrder = allOrders.some(o => {
                const t = String(o.table || '');
                const matchesTable = currentZone
                    ? (t === tsZone || t === tNumStr)
                    : (t === tsPlain || t === tNumStr);
                return matchesTable && o.status !== 'bezahlt' && o.status !== 'storniert';
            });

            // Aktiver Service-Ruf?
            const hasCall = allCalls.some(c => {
                const callTableStr = String(c.table || '');
                if (currentZone) {
                    return callTableStr === tsZone;
                }
                return callTableStr === tsPlain;
            });

            return hasOrder || hasCall;
        }

        function setSeatingTab(zone) {
            sitzplanFilterZone = zone;
            const tabs = ['gesamt', 'aktiv', 'drinnen', 'draußen'];
            const idMap = {
                'gesamt': 'tab-zone-gesamt',
                'aktiv': 'tab-zone-aktiv',
                'drinnen': 'tab-zone-drinnen',
                'draußen': 'tab-zone-draussen'
            };
            tabs.forEach(z => {
                const btn = document.getElementById(idMap[z]);
                if (!btn) return;
                if (z === zone) {
                    if (z === 'aktiv') {
                        // Aktiv-Tab: eigenes rosa Design bleibt auch im aktivierten Zustand
                        btn.className = "px-4 py-2 rounded-xl text-xs font-black bg-rose-500 text-white border border-rose-500 transition shadow-sm flex items-center gap-1.5";
                    } else {
                        btn.className = "px-4 py-2 rounded-xl text-xs font-black bg-gastro text-white border border-gastro transition shadow-sm";
                    }
                } else {
                    if (z === 'aktiv') {
                        btn.className = "px-4 py-2 rounded-xl text-xs font-bold border border-rose-200 text-rose-700 bg-rose-50 hover:bg-rose-100 transition flex items-center gap-1.5";
                    } else {
                        btn.className = "px-4 py-2 rounded-xl text-xs font-bold border border-zinc-200 text-zinc-700 bg-white hover:bg-zinc-50 transition";
                    }
                }
            });
            renderSitzplanTiles();
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('btn-edit-mode');
            const text = document.getElementById('btn-edit-mode-text');
            const saveBtn = document.getElementById('btn-save-layout');
            const instructions = document.getElementById('edit-instructions');

            if (isEditMode) {
                tempTables = JSON.parse(JSON.stringify(allTables));
                btn.className = "px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg";
                text.textContent = "Bearbeitung beenden";
                saveBtn.classList.remove('hidden');
                instructions.classList.remove('hidden');
            } else {
                btn.className = "px-4 py-2 bg-zinc-800 border border-outline-variant hover:bg-zinc-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg";
                text.textContent = "Sitzplan bearbeiten";
                saveBtn.classList.add('hidden');
                instructions.classList.add('hidden');
            }

        function toggleShape(tableNum, zone) {
            if (!isEditMode) return;
            const t = tempTables.find(tbl => String(tbl.number) === String(tableNum) && String(tbl.zone || '') === String(zone || ''));
            if (t) {
                t.shape = t.shape === 'round' ? 'rect' : 'round';
                renderSitzplanTiles();
            }
        }

        async function saveLayout() {
            try {
                const payload = {};
                tempTables.forEach(t => {
                    const key = `${t.number}:${t.zone || ''}`;
                    payload[key] = {
                        pos_x: t.pos_x,
                        pos_y: t.pos_y,
                        width: t.width,
                        height: t.height,
                        shape: t.shape
                    };
                });


                const response = await fetch('/admin/sitzplan/positions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (data.success) {
                    showToast('Layout erfolgreich gespeichert!', 'success');
                    allTables = JSON.parse(JSON.stringify(tempTables));
                    isEditMode = false;
                    
                    const btn = document.getElementById('btn-edit-mode');
                    const text = document.getElementById('btn-edit-mode-text');
                    const saveBtn = document.getElementById('btn-save-layout');
                    const instructions = document.getElementById('edit-instructions');
                    btn.className = "px-4 py-2 bg-zinc-800 border border-outline-variant hover:bg-zinc-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg";
                    text.textContent = "Sitzplan bearbeiten";
                    saveBtn.classList.add('hidden');
                    instructions.classList.add('hidden');

                    renderSitzplanTiles();
                } else {
                    showToast('Fehler beim Speichern des Layouts', 'error');
                }
            } catch (e) {
                console.error(e);
                showToast('Verbindungsfehler beim Speichern', 'error');
            }
        }

        async function deleteTableServer(tableNum, zone) {
            if (!confirm(`Möchten Sie Tisch ${tableNum} (${zone || ''}) wirklich löschen?`)) return;
            try {
                const url = `/admin/table-loeschen/${encodeURIComponent(tableNum)}` + (zone ? `?zone=${encodeURIComponent(zone)}` : '');
                const response = await fetch(url, {
                    method: 'POST'
                });
                if (response.ok) {
                    showToast('Tisch erfolgreich gelöscht!', 'success');
                    allTables = allTables.filter(t => !(String(t.number) === String(tableNum) && String(t.zone || '') === String(zone || '')));
                    tempTables = tempTables.filter(t => !(String(t.number) === String(tableNum) && String(t.zone || '') === String(zone || '')));
                    renderSitzplanTiles();
                } else {
                    showToast('Fehler beim Löschen des Tisches', 'error');
                }
            } catch (e) {
                console.error(e);
                showToast('Verbindungsfehler beim Löschen', 'error');
            }
        }

        async function autoSortTablesGridAndSave() {

            if (!confirm("Möchten Sie alle Tische automatisch sortieren und als Grid-Layout speichern?")) {
                return;
            }
            try {
                const sorted = JSON.parse(JSON.stringify(allTables));
                sorted.sort((a, b) => String(a.number).localeCompare(String(b.number), undefined, {numeric: true, sensitivity: 'base'}));

                const count = sorted.length;
                if (count > 0) {
                    let cols = 6;
                    if (count <= 4) cols = 2;
                    else if (count <= 9) cols = 3;
                    else if (count <= 16) cols = 4;
                    else if (count <= 25) cols = 5;

                    for (let i = 0; i < count; i++) {
                        const col = i % cols;
                        const row = Math.floor(i / cols);
                        
                        const pos_x = cols > 1 ? col * (90 / (cols - 1)) : 0;
                        const max_rows = Math.ceil(count / cols);
                        const pos_y = max_rows > 1 ? row * (84 / (max_rows - 1)) : 0;
                        
                        sorted[i].pos_x = Math.round(pos_x);
                        sorted[i].pos_y = Math.round(pos_y);
                    }
                }

                const payload = {};
                sorted.forEach(t => {
                    // SECURITY FIX (audit 4.6): Key muss Zone enthalten, sonst kollidieren
                    // "Tisch 1 Drinnen" und "Tisch 1 Draußen" im Backend-Payload.
                    // Gleiches Format wie saveLayout() (Z. 7720): `${t.number}:${t.zone || ''}`.
                    const tableKey = t.zone ? `${t.number}:${t.zone}` : String(t.number);
                    payload[tableKey] = {
                        pos_x: t.pos_x,
                        pos_y: t.pos_y,
                        width: t.width || 120.0,
                        height: t.height || 80.0,
                        shape: t.shape || "rect"
                    };
                });

                const response = await fetch('/admin/sitzplan/positions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (data.success) {
                    showToast('Tische erfolgreich sortiert und gespeichert!', 'success');
                    allTables = sorted;
                    tempTables = JSON.parse(JSON.stringify(allTables));
                    isEditMode = false;
                    
                    const btn = document.getElementById('btn-edit-mode');
                    const text = document.getElementById('btn-edit-mode-text');
                    const saveBtn = document.getElementById('btn-save-layout');
                    const instructions = document.getElementById('edit-instructions');
                    if (btn) {
                        btn.className = "px-4 py-2 bg-zinc-800 border border-outline-variant hover:bg-zinc-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg";
                    }
