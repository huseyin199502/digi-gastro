        function initDragAndResize() {
            if (!isEditMode) return;
            tempTables.forEach(t => {
                const zoneClean = (t.zone || '').replace(/\s+/g, '_');
                const el = document.getElementById(`table-card-${t.number}-${zoneClean}`);
                const handle = document.getElementById(`resize-handle-${t.number}-${zoneClean}`);
                if (el) {
                    makeElementDraggable(el, t.number, t.zone);
                }
                if (el && handle) {
                    makeElementResizable(el, handle, t.number, t.zone);
                }
            });
        }


        function makeElementDraggable(el, tableNum, zone) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            el.onmousedown = dragMouseDown;
            el.addEventListener('touchstart', dragTouchStart, { passive: false });

            function dragMouseDown(e) {
                e = e || window.event;
                if (e.target.classList.contains('edit-table-shape-btn') || e.target.classList.contains('resize-handle') || e.target.classList.contains('delete-table-btn')) return;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function dragTouchStart(e) {
                if (e.target.classList.contains('edit-table-shape-btn') || e.target.classList.contains('resize-handle') || e.target.classList.contains('delete-table-btn')) return;
                e.preventDefault();
                const touch = e.touches[0];
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                
                function touchMoveHandler(ev) {
                    ev.preventDefault();
                    const t = ev.touches[0];
                    doDrag(t.clientX, t.clientY);
                }
                
                function touchEndHandler() {
                    document.removeEventListener('touchmove', touchMoveHandler);
                    document.removeEventListener('touchend', touchEndHandler);
                }

                document.addEventListener('touchmove', touchMoveHandler, { passive: false });
                document.addEventListener('touchend', touchEndHandler);
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                doDrag(e.clientX, e.clientY);
            }

            function doDrag(clientX, clientY) {
                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;

                const parent = el.parentNode;
                const parentRect = parent.getBoundingClientRect();
                
                let newTop = el.offsetTop - pos2;
                let newLeft = el.offsetLeft - pos1;

                let pctLeft = (newLeft / parentRect.width) * 100;
                let pctTop = (newTop / parentRect.height) * 100;

                if (pctLeft < 0) pctLeft = 0;
                if (pctLeft > 92) pctLeft = 92;
                if (pctTop < 0) pctTop = 0;
                if (pctTop > 88) pctTop = 88;

                el.style.left = pctLeft + "%";
                el.style.top = pctTop + "%";

                const t = tempTables.find(tbl => String(tbl.number) === String(tableNum) && String(tbl.zone || '') === String(zone || ''));
                if (t) {
                    t.pos_x = pctLeft;
                    t.pos_y = pctTop;
                }
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }


        function makeElementResizable(el, handle, tableNum, zone) {
            handle.onmousedown = function(e) {
                e.preventDefault();
                e.stopPropagation();
                initResize(e.clientX, e.clientY);
                document.onmousemove = function(ev) {
                    doResize(ev.clientX, ev.clientY);
                };
                document.onmouseup = function() {
                    document.onmousemove = null;
                    document.onmouseup = null;
                };
            };

            handle.addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                const touch = e.touches[0];
                initResize(touch.clientX, touch.clientY);
                
                function touchMoveHandler(ev) {
                    ev.preventDefault();
                    const t = ev.touches[0];
                    doResize(t.clientX, t.clientY);
                }
                
                function touchEndHandler() {
                    document.removeEventListener('touchmove', touchMoveHandler);
                    document.removeEventListener('touchend', touchEndHandler);
                }

                document.addEventListener('touchmove', touchMoveHandler, { passive: false });
                document.addEventListener('touchend', touchEndHandler);
            }, { passive: false });

            let startWidth, startHeight, startX, startY;

            function initResize(clientX, clientY) {
                startWidth = parseFloat(el.style.width) || el.offsetWidth;
                startHeight = parseFloat(el.style.height) || el.offsetHeight;
                startX = clientX;
                startY = clientY;
            }

            function doResize(clientX, clientY) {
                let newWidth = startWidth + (clientX - startX);
                let newHeight = startHeight + (clientY - startY);

                if (newWidth < 60) newWidth = 60;
                if (newWidth > 300) newWidth = 300;
                if (newHeight < 60) newHeight = 60;
                if (newHeight > 300) newHeight = 300;

                el.style.width = newWidth + "px";
                el.style.height = newHeight + "px";

                const t = tempTables.find(tbl => String(tbl.number) === String(tableNum) && String(tbl.zone || '') === String(zone || ''));
                if (t) {
                    t.width = newWidth;
                    t.height = newHeight;
                }
            }
        }


        function updateTimers() {
            document.querySelectorAll('.tile-timer').forEach(el => {
                const ts = el.getAttribute('data-timestamp');
                if (!ts) return;
                const orderTime = new Date(ts.replace(' ', 'T'));
                const diffMs = (new Date() - orderTime) - serverTimeOffset;
                if (isNaN(diffMs) || diffMs < 0) {
                    el.textContent = '';
                    return;
                }
                const diffMins = Math.floor(diffMs / 60000);
                const diffSecs = Math.floor((diffMs % 60000) / 1000);
                el.textContent = `${diffMins}m ${diffSecs}s`;
            });
        }
        if (!window.timerIntervalRegistered) {
            setInterval(updateTimers, 1000);
            window.timerIntervalRegistered = true;
        }

        function renderTileHtml(table) {
            const isTemp = isEditMode;
            const tableList = isTemp ? tempTables : allTables;
            const currentTable = tableList.find(t => String(t.number) === String(table.number) && String(t.zone || '') === String(table.zone || '')) || table;

            const ts = 'Tisch ' + currentTable.number;
            const tsZone = `Tisch ${currentTable.number} (${currentTable.zone || ''})`;
            // Match orders with zone-specific name first, then plain name (legacy)
            // FIX: .filter() statt .find() — unterstützt mehrere Bestellungen pro Tisch
            const orders = allOrders.filter(o => {
                const t = String(o.table || '');
                if (currentTable.zone) {
                    return (t === tsZone || t === String(currentTable.number)) && o.status !== 'bezahlt' && o.status !== 'storniert';
                }
                return (t === ts || t === String(currentTable.number)) && o.status !== 'bezahlt' && o.status !== 'storniert';
            });
            // Für Rückwärtskompatibilität: order = erste gefundene Bestellung
            const order = orders.length > 0 ? orders[0] : null;
            const hasPending = order && (order.items || []).some(item => (item.item_status || 'pending') === 'pending');
            // Sammle alle Items aller aktiven Bestellungen für Hauptgruppen-Badge
            const allItems = orders.flatMap(o => o.items || []);
            // WICHTIG: Für die Badge-Leiste nur Items zeigen die noch NICHT serviert sind.
            // Status 'pending' = neu bestellt, 'confirmed' = in Zubereitung,
            // 'delivered' = serviert (soll nicht mehr in der Leiste auftauchen).
            // Dadurch bleibt die Leiste übersichtlich bei Nachbestellungen: nur die
            // offenen Artikel werden farblich markiert, servierte fallen heraus.
            const openItems = allItems.filter(item => {
                const status = (item.item_status || 'pending').toLowerCase();
                return status === 'pending' || status === 'confirmed';
            });
            // Berechne Hauptgruppen-Farben NUR für offene Items
            const superGroupBadges = getSuperGroupBadgesForItems(openItems);
            
            // Search for active service calls (Ruf) for this table - MUST match zone!
            const tNumStr = String(currentTable.number);
            const currentZone = currentTable.zone || '';
            const tableCallsForTile = allCalls.filter(c => {
                const callTableStr = String(c.table);
                // Try exact match with zone first: "Tisch 1 (Drinnen)"
                if (currentZone) {
                    const exactMatch = `Tisch ${tNumStr} (${currentZone})`;
                    if (callTableStr === exactMatch) return true;
                }
                // Try plain match: "Tisch 1" (legacy orders without zone)
                const plainMatch = `Tisch ${tNumStr}`;
                if (callTableStr === plainMatch) {
                    // Only match plain "Tisch 1" if no zone-specific call exists
                    // or if this table has no zone configured
                    return !currentZone;
                }
                return false;
            });
            const activeCall = tableCallsForTile.length > 0 ? tableCallsForTile[0] : null;

            let statusClass = 'status-free';
            if (order) {
                statusClass = hasPending ? 'status-pending' : 'status-active';
            }
            if (activeCall) {
                statusClass = 'status-calling';
            }
            
            const shapeClass = currentTable.shape === 'round' ? 'round' : 'rect';
            const zoneClean = (currentTable.zone || '').replace(/\s+/g, '_');
            
            let html = '';
            if (isEditMode) {
                html = `
                    <div id="table-card-${currentTable.number}-${zoneClean}" 
                         class="sitzplan-table draggable ${shapeClass} status-free"
                         style="left: ${currentTable.pos_x || 0}%; top: ${currentTable.pos_y || 0}%; width: ${currentTable.width || 120}px; height: ${currentTable.height || 80}px;"
                         ondblclick="toggleShape('${currentTable.number}', '${currentTable.zone || ''}')">
                        <button onclick="event.stopPropagation(); deleteTableServer('${currentTable.number}', '${currentTable.zone || ''}')" 
                                class="absolute top-1 right-1 w-5 h-5 bg-red-600 hover:bg-red-700 text-white rounded-full flex items-center justify-center font-bold text-[10px] z-20 shadow-sm delete-table-btn"
                                title="Tisch löschen">✕</button>
                        <span class="edit-table-badge">Tisch ${currentTable.number}</span>
                        <span class="text-xs font-bold text-zinc-500 select-none">${currentTable.zone || ''}</span>
                        <button class="edit-table-shape-btn" onclick="toggleShape('${currentTable.number}', '${currentTable.zone || ''}')">Form</button>
                        <div class="resize-handle se" id="resize-handle-${currentTable.number}-${zoneClean}"></div>
                    </div>
                `;
            } else {
                let inner = '';

                // FIX: Summe ALLER Bestellungen für diesen Tisch, nicht nur die erste!
                // Vorher: order.total (nur erste Bestellung) → 15,00€ statt 28,00€
                // Jetzt: Summe aller orders → korrekte Gesamtsumme
                const tableTotal = orders.reduce((sum, o) => sum + (o.total || 0), 0);
                const revenueText = orders.length > 0 ? `${tableTotal.toFixed(2).replace('.', ',')} €` : '';

                if (activeCall) {
                    let callIcon = '🔔';
                    let callText = 'Ruf';
                    const cType = String(activeCall.type).toLowerCase();
                    if (cType.includes('kohle')) {
                        callIcon = '💨';
                        callText = 'Kohle';
                    } else if (cType.includes('bar')) {
                        callIcon = '💵';
                        callText = 'Bar Ruf';
                    } else if (cType.includes('karte') || cType.includes('card')) {
                        callIcon = '💳';
                        callText = 'Karte';
                    } else if (cType.includes('rechnung') || cType.includes('zahlen') || cType.includes('kasse') || cType.includes('bill') || cType.includes('pay')) {
                        callIcon = '💵';
                        callText = 'Rechnung';
                    } else {
                        callIcon = '🔔';
                        callText = 'Service';
                    }

                    inner = `
                        
                        <span class="text-xl sm:text-2xl animate-bounce">${callIcon}</span>
                        <span class="text-[9px] font-black tracking-wider uppercase text-center mt-0.5" style="color:#92400e;">${callText}</span>
                        <span class="text-xs sm:text-sm font-black" style="color:#78350f;">${currentTable.number}</span>
                        ${revenueText ? `<span class="text-[10px] font-extrabold mt-0.5" style="color:#451a03;">${revenueText}</span>` : ''}
                    `;
} else if (order) {
                    // Timer läuft ab der ältesten aktiven Bestellung (kein Neustart bei Nachbestellung)
                    // und weiter, bis der Kellner abgerechnet hat (Teilzahlung ODER komplett bezahlt).
                    const timerTs = orders.reduce((min, o) => (o.timestamp && o.timestamp < min) ? o.timestamp : min, orders[0].timestamp);
                    const timerSpan = timerTs ? `<span class="tile-timer absolute right-6 bottom-2 text-[9px] font-bold px-1 rounded ${hasPending ? 'text-rose-800 bg-rose-200/50' : 'text-emerald-800 bg-emerald-200/50'}" data-timestamp="${timerTs}"></span>` : '';
                    if (hasPending) {
                        inner = `
                            
                            <span class="text-[9px] font-black tracking-wider uppercase text-center text-rose-800 mt-1" style="color:#9f1239;">Bestellung</span>
                            <span class="text-xs sm:text-sm font-black" style="color:#4c0519;">${currentTable.number}</span>
                            <span class="text-[10px] font-extrabold mt-0.5" style="color:#881337;">${revenueText}</span>
                            ${timerSpan}
                        `;
                    } else {
                        inner = `
                            
                            <span class="text-[9px] font-black tracking-wider uppercase text-center mt-1" style="color:#065f46;">Serviert</span>
                            <span class="text-xs sm:text-sm font-black" style="color:#022c22;">${currentTable.number}</span>
                            <span class="text-[10px] font-extrabold mt-0.5" style="color:#064e3b;">${revenueText}</span>
                            ${timerSpan}
                        `;
                    }
                } else {
                    inner = `
                        <span class="text-xl sm:text-2xl font-black text-zinc-500">${currentTable.number}</span>
                        <span class="text-[9px] font-black tracking-wider uppercase text-center mt-0.5 text-zinc-500">Frei</span>
                    `;
                }

                html = `
                    <div id="table-card-${currentTable.number}-${zoneClean}" 
                         onclick="openControlModal('${currentTable.number}', '${currentTable.zone || ''}')"
                         class="sitzplan-table ${shapeClass} ${statusClass}"
                         style="left: ${currentTable.pos_x || 0}%; top: ${currentTable.pos_y || 0}%; width: ${currentTable.width || 120}px; height: ${currentTable.height || 80}px;">
                        ${inner}
                        ${superGroupBadges.length > 0 ? renderSuperGroupBadgeBar(superGroupBadges) : ''}
                    </div>
                `;
            }
            return html;
        }

        // ═══════════════════════════════════════════════════════
        // HAUPTGRUPPEN-BADGE-LEISTE für Tisch-Kacheln
        // Zeigt farbcodierte Segmente pro Hauptgruppe (Shisha/Getränk/Snacks)
        // damit Kellner sofort sieht was bestellt wurde.
        // ═══════════════════════════════════════════════════════

        /**
         * Rendert die Legende für die Hauptgruppen-Farben über dem Sitzplan.
         * Zeigt alle angelegten Hauptgruppen mit ihrer Farbe + Icon + Name.
         * Wird in renderSitzplanTiles() aufgerufen.
         */
        function renderSeatingLegend() {
            const container = document.getElementById('seating-legend-items');
            if (!container) return;

            const groups = _superGroups || [];
            if (groups.length === 0) {
                container.innerHTML = '<span class="text-[10px] text-zinc-500 italic">Keine Hauptgruppen angelegt — Farb-Codierung inaktiv. Lege Hauptgruppen unter "Kategorien" an.</span>';
                return;
            }

            // Sortiert nach Position
            const sorted = [...groups].sort((a, b) => (a.position || 0) - (b.position || 0));

            container.innerHTML = sorted.map(sg => {
                const color = sg.color || '#9ca3af';
                const icon = sg.icon ? escapeHtml(sg.icon) : 'category';
                const name = escapeHtml(sg.name);
                return `
                    <div class="seating-legend-item" title="${name}: Artikel dieser Hauptgruppe in Bestellung">
                        <span class="seating-legend-color" style="background:${color};"></span>
                        <span class="material-symbols-outlined">${icon}</span>
                        <span>${name}</span>
                    </div>

         * Berechnet die Hauptgruppen für eine Liste von OrderItems.

         *
         * @param {Array} items - Array von OrderItem-Objekten
         * @returns {Array} - Array von {id, name, color, icon, count} Objekten
         */
        function getSuperGroupBadgesForItems(items) {
            if (!items || items.length === 0) return [];
            if (!_superGroups || !_superGroupCategories) return [];

            const sgCounts = {}; // {superGroupId: count}

            items.forEach(item => {
                // Item → Product → Category → SuperGroup
                const productId = item.product_id || item.id;
                const product = (allProducts || []).find(p => p.id === productId);
                if (!product) return;
                const categoryName = product.category;
                if (!categoryName) return;

                const sgCat = _superGroupCategories.find(c => c.name === categoryName);
                const sgId = sgCat && sgCat.super_group_id ? sgCat.super_group_id : null;

                // "Sonstiges" Bucket für Items ohne Hauptgruppe
                const bucketId = sgId || 'sonstiges';
                sgCounts[bucketId] = (sgCounts[bucketId] || 0) + 1;
            });

            // In Array umwandeln + SuperGroup-Infos anreichern
            return Object.entries(sgCounts).map(([id, count]) => {
                if (id === 'sonstiges') {
                    return {
                        id: 'sonstiges',
                        name: 'Sonstiges',
                        color: '#9ca3af',  // gray-400
                        icon: 'restaurant',
                        count: count
                    };
                }
                const sg = _superGroups.find(s => s.id === parseInt(id));
                return {
                    id: id,
                    name: sg ? sg.name : 'Unbekannt',
                    color: sg ? sg.color : '#9ca3af',
                    icon: sg && sg.icon ? sg.icon : 'category',
                    count: count
                };
            }).sort((a, b) => b.count - a.count); // häufigste zuerst
        }

        /**
         * Rendert die Badge-Leiste für die Tisch-Kachel.
         * Auf Desktop: 4px hohe Leiste am unteren Rand mit proportionalen Segmenten.
         * Auf Mobile: 6px hohe Leiste (besser sichtbar).
         * Verhindert Überlappung durch absolute Positionierung am Boden.
         */
        function renderSuperGroupBadgeBar(badges) {
            const total = badges.reduce((sum, b) => sum + b.count, 0);
            if (total === 0) return '';

            const segments = badges.map(b => {
                const widthPercent = (b.count / total * 100).toFixed(1);
                const title = `${b.name}: ${b.count} Artikel`;
                return `<div class="tile-sg-segment"
                             style="width: ${widthPercent}%; background: ${escapeHtml(b.color)};"
                             title="${escapeHtml(title)}"></div>`;
            }).join('');

            return `<div class="tile-sg-bar" data-total="${total}">${segments}</div>`;
        }

            items.forEach(item => {

            const targetTableStr = `Tisch ${targetTableNumber}${zoneSuffix}`;

                if (!keys.length) return;
                
                const aggregatedKeys = [];

                keys.forEach(k => {
                    const parts = k.split('_');
                    if (parts.length >= 4 && parts[parts.length - 1].match(/^\d+$/)) {
                        parts.pop();
                    }
                    const cleanKey = parts.join('_');
                    
                    if (!aggregatedItems[cleanKey]) {

                    aggregatedItems[cleanKey] += selectedControlSplitItems[k].selectedQty;

                    const payload = {

                        target_table: targetTableStr,

                    const res = await fetch('/admin/orders/transfer', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)

        // ── Helper: extract JSON array from JS source text, respecting string boundaries ──
        function extractJsonArray(text, varName) {
            const marker = 'let ' + varName;
            const startIdx = text.indexOf(marker);
            if (startIdx === -1) return null;
            const eqIdx = text.indexOf('=', startIdx + marker.length);
            const arrStart = text.indexOf('[', eqIdx);
            if (arrStart === -1) return null;
            let depth = 0, inString = false, escape = false, quoteChar = '';
            for (let i = arrStart; i < text.length; i++) {
                const ch = text[i];
                if (escape) { escape = false; continue; }
                if (ch === '\\') { escape = true; continue; }
                if (inString) {
                    if (ch === quoteChar) inString = false;
                    continue;
                }
                if (ch === '"' || ch === "'") { inString = true; quoteChar = ch; continue; }
                if (ch === '[') depth++;
                if (ch === ']') { depth--; if (depth === 0) return text.substring(arrStart, i + 1); }
            }
            return null;
        }

                    nameEn = p.name_en || '';
                    descriptionEn = p.description_en || '';
                    imageUrl = p.image || '';
                    isVegan = p.is_vegan || p.vegan || false;
                    isGlutenfree = p.is_glutenfree || false;
                    productType = p.category_type || 'küche';
                    relatedIds = p.related_product_ids || [];
                    allergenList = p.allergens || [];
                }
            } else if (typeof id === 'object' && id !== null) {
                const p = id;
                id = p.id;
                name = p.name;
                price = p.price;
                description = p.description || '';
                category = p.category;
                nameEn = p.name_en || '';
                descriptionEn = p.description_en || '';
                imageUrl = p.image || '';
                isVegan = p.is_vegan || p.vegan || false;
                isGlutenfree = p.is_glutenfree || false;
                productType = p.category_type || 'küche';
                relatedIds = p.related_product_ids || [];
                allergenList = p.allergens || [];
            }
            document.getElementById('edit-product-id').value = id;
            document.getElementById('edit-product-type').value = productType;

                previewContainer.classList.add('hidden');

            // Reset to Details tab
            switchSlideTab('details', document.querySelector('.slide-tab-btn'));

            // Open slide-over
            document.getElementById('edit-slide-over').classList.add('open');
            document.getElementById('edit-slide-overlay').classList.add('open');
            // Kein body overflow:hidden mehr — iOS Safari hat damit einen bekannten Bug,
            // bei dem nach dem Schließen des Modals der Scroll auf der Seite blockiert bleibt.
            // Das Slide-Over ist position:fixed und überdeckt die Seite ohnehin komplett,
            // body-scroll-lock ist also unnötig.

        function closeEditSlideOver() {
            document.getElementById('edit-slide-over').classList.remove('open');
            document.getElementById('edit-slide-overlay').classList.remove('open');
            // Body overflow nicht mehr anfassen (siehe Kommentar oben)

        // 14 EU-Hauptallergene (Verordnung 1169/2011)
        const EU_ALLERGENS = [
            'Gluten', 'Krebstiere', 'Eier', 'Fisch', 'Erdnüsse',
            'Soja', 'Milch', 'Schalenfrüchte', 'Sellerie', 'Senf',
            'Sesam', 'Sulfite', 'Lupinen', 'Weichtiere'
        ];

        // Rendert die 14 EU-Allergene als Checkboxes im Produkt-Editor
        function renderAllergenCheckboxes(selectedAllergens) {
            const container = document.getElementById('allergen-checkboxes');
            if (!container) return;
            selectedAllergens = selectedAllergens || [];
            container.innerHTML = EU_ALLERGENS.map(allergen => {
                const isChecked = selectedAllergens.includes(allergen);
                return `
                    <label class="flex items-center gap-1.5 p-1.5 rounded-lg bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 cursor-pointer hover:border-amber-400 dark:hover:border-amber-600 transition-colors">
                        <input type="checkbox" class="allergen-checkbox rounded text-amber-700 focus:ring-0" value="${allergen}" ${isChecked ? 'checked' : ''}>
                        <span class="text-[10px] font-bold text-zinc-700 dark:text-zinc-600">${allergen}</span>
                    </label>
                `;
            }).join('');
        }

        // UPSPELLING: Rendert Checkbox-Liste aller Produkte (außer dem aktuellen)
        // für die "Passende Extras" Verknüpfung im Produkt-Editor.
        function renderUpsellCheckboxes(currentProductId, selectedIds) {
            const container = document.getElementById('upsell-product-list');
            if (!container) return;
            selectedIds = selectedIds || [];

            // Alle Produkte außer dem aktuellen, sortiert nach Name
            const otherProducts = (allProducts || [])
                .filter(p => String(p.id) !== String(currentProductId))
                .sort((a, b) => (a.name || '').localeCompare(b.name || ''));

            if (otherProducts.length === 0) {
                container.innerHTML = '<p class="text-[10px] text-zinc-500 italic">Keine weiteren Produkte vorhanden.</p>';
                return;
            }

            container.innerHTML = otherProducts.map(p => {
                const isChecked = selectedIds.includes(p.id);
                const priceStr = (p.price || 0).toFixed(2).replace('.', ',') + ' €';
                const catLabel = p.category || '';
                return `
                    <label class="flex items-center gap-2 p-2 rounded-lg bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 cursor-pointer hover:border-emerald-400 dark:hover:border-emerald-600 transition-colors">
                        <input type="checkbox" class="upsell-product-checkbox rounded text-gastro focus:ring-0" value="${p.id}" ${isChecked ? 'checked' : ''}>
                        <div class="flex-1 min-w-0">
                            <span class="text-[11px] font-bold text-zinc-800 dark:text-zinc-200 block truncate">${escapeHtml(p.name)}</span>
                            <span class="text-[9px] text-zinc-500 dark:text-zinc-400">${escapeHtml(catLabel)} · ${priceStr}</span>
                        </div>
                    </label>
                `;
            }).join('');
        }

        function closeEditProductModal() {
            closeEditSlideOver();
            // Live-Preview zurücksetzen
            const previewPanel = document.getElementById('live-preview-panel');
            if (previewPanel) previewPanel.classList.add('hidden');
        }

        // ═══ LIVE PREVIEW FUNKTIONEN ═══
        // Zeigt live wie das Produkt im Gästemenü aussieht während der Admin es bearbeitet.
        // Update passiert oninput via updateLivePreview() auf den Input-Feldern.

        function toggleLivePreview() {
            const panel = document.getElementById('live-preview-panel');
            const btn = document.getElementById('preview-toggle-btn');
            if (!panel || !btn) return;
            const isHidden = panel.classList.contains('hidden');
            if (isHidden) {
                panel.classList.remove('hidden');
                btn.classList.add('bg-emerald-100', 'text-emerald-700', 'border-emerald-300', 'dark:bg-emerald-950/30', 'dark:text-emerald-400', 'dark:border-emerald-800');
                updateLivePreview();
            } else {
                panel.classList.add('hidden');
                btn.classList.remove('bg-emerald-100', 'text-emerald-700', 'border-emerald-300', 'dark:bg-emerald-950/30', 'dark:text-emerald-400', 'dark:border-emerald-800');
            }
        }

        function updateLivePreview() {
            // Name
            const nameEl = document.getElementById('edit-product-name');
            const previewName = document.getElementById('preview-product-name');
            if (nameEl && previewName) {
                previewName.textContent = nameEl.value || 'Produktname';
            }
            // Beschreibung
            const descEl = document.getElementById('edit-product-description');
            const previewDesc = document.getElementById('preview-product-desc');
            if (descEl && previewDesc) {
                previewDesc.textContent = descEl.value || '';
            }
            // Preis
            const priceEl = document.getElementById('edit-product-price');
            const previewPrice = document.getElementById('preview-product-price');
            if (priceEl && previewPrice) {
                const price = parseFloat(priceEl.value) || 0;
                previewPrice.textContent = price.toFixed(2).replace('.', ',') + ' €';
            }
            // Bild
            const imageUrlEl = document.getElementById('edit-product-image-url');
            const fileInput = document.getElementById('edit-product-image-file');
            const previewImg = document.getElementById('preview-product-image');
            const placeholder = document.getElementById('preview-image-placeholder');
            if (previewImg && placeholder) {
                // File-Upload hat Vorrang
                if (fileInput && fileInput.files && fileInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        previewImg.src = e.target.result;
                        previewImg.style.display = '';
                        placeholder.style.display = 'none';
                    };
                    reader.readAsDataURL(fileInput.files[0]);
                } else if (imageUrlEl && imageUrlEl.value) {
                    previewImg.src = imageUrlEl.value;
                    previewImg.style.display = '';
                    placeholder.style.display = 'none';
                } else {
                    previewImg.style.display = 'none';
                    placeholder.style.display = 'flex';
                }
            }
            // Allergene
            const allergenCheckboxes = document.querySelectorAll('.allergen-checkbox:checked');
            const previewAllergens = document.getElementById('preview-allergens');
            if (previewAllergens) {
                if (allergenCheckboxes.length > 0) {
                    previewAllergens.classList.remove('hidden');
                    previewAllergens.innerHTML = Array.from(allergenCheckboxes).map(cb =>
                        `<span class="text-[8px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 dark:bg-amber-900 dark:text-amber-300 font-bold">${escapeHtml(cb.value)}</span>`
                    ).join('');
                } else {
                    previewAllergens.classList.add('hidden');
                }
            }
        }

        // File-Input Listener für Live-Preview (sobald ein Bild gewählt wird)
        document.addEventListener('change', (e) => {
            if (e.target && e.target.id === 'edit-product-image-file') {
                updateLivePreview();
            }
            if (e.target && e.target.id === 'edit-product-image-url') {
                updateLivePreview();
            }
            if (e.target && e.target.classList && e.target.classList.contains('allergen-checkbox')) {
                updateLivePreview();
            }
        });

        function switchSlideTab(tabId, btn) {
            document.querySelectorAll('.slide-tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.slide-tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('slide-tab-' + tabId).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        // Quick-create modal
        function openQuickCreateModal() {
            document.getElementById('quick-create-product-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeQuickCreateModal() {
            document.getElementById('quick-create-product-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        async function quickCreateProduct(createAndNext = false) {
            const form = document.getElementById('quick-create-form');
            const formData = new FormData(form);
            // Client-seitige Vorab-Validierung: Name + Preis Pflicht
            const name = (formData.get('name') || '').toString().trim();
            const preis = (formData.get('preis') || '').toString().trim();
            if (!name) {
                showToast('Bitte Produkt-Name eingeben', 'error');
                return;
            }
            if (!preis) {
                showToast('Bitte Preis eingeben (z.B. 3.50 oder 3,50)', 'error');
                return;
            }
            try {
                const response = await fetch('/admin/produkt-erstellen', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json', 'X-Requested-With': 'fetch' }
                });
                if (response.ok) {
                    showToast('Produkt erfolgreich erstellt!', 'success');
                    if (createAndNext) {
                        form.reset();
                    } else {
                        closeQuickCreateModal();
                    }
                    refreshProductsUI();
                } else {
                    // Freundliche Fehlermeldung aus Backend detail extrahieren
                    let detail = 'Fehler beim Erstellen des Produkts';
                    try {
                        const err = await response.json();
                        if (err.detail) detail = err.detail;
                    } catch (_) {}
                    showToast(detail, 'error');
                }
            } catch (err) {
                showToast('Verbindungsfehler', 'error');
            }
        }

        // Product filter functions (works on both table rows and mobile cards)
        function filterProducts(searchTerm) {
            // Sync mit _productFilterState für Aktive-Filter-Pills
            _productFilterState.search = searchTerm || '';
            // Nutze kombinierte applyProductFilters() falls vorhanden (mit Pills + Saved Views)
            if (typeof applyProductFilters === 'function') {
                applyProductFilters();
                if (typeof updateActiveFilterPills === 'function') updateActiveFilterPills();
                return;
            }
            // Fallback: einfache Filterung
            const items = document.querySelectorAll('.product-row, .product-tile, .product-card');
            const term = (searchTerm || '').toLowerCase();
            items.forEach(item => {
                const name = item.dataset.name;
                item.style.display = name.includes(term) ? '' : 'none';
            });
        }

        // ═══════════════════════════════════════════════════════
        // NEUE PRODUKT-FILTER (Chip-basiert, kombiniert mit Search)
        // ═══════════════════════════════════════════════════════
        let _productFilterState = { status: 'all', hh: 'all', cat: 'all', search: '' };
        // Pagination: 25 Produkte initial, "Load More" für nächste 25
        const PRODUCTS_PER_PAGE = 25;
        let _productVisibleCount = 0;
        let _productShownCount = 0;

        function setProductFilter(type, value, btn) {
            _productFilterState[type] = value;
            // Active state on chips
            document.querySelectorAll('.filter-chip[data-filter-type="' + type + '"]').forEach(c => c.classList.remove('active'));
            if (btn) btn.classList.add('active');
            applyProductFilters();
            updateActiveFilterPills();
        }

        // ═══ PHASE 4: Aktive Filter Pills + Saved Views ═══
        // Aktive Filter als visuell entfernbare Pills anzeigen (Notion/Airtable-Stil)
        // + Saved Views im localStorage speichern (pro Tenant via slug aus URL)

        const _filterTypeLabels = {
            'status': 'Status',
            'hh': 'Aktion',
            'cat': 'Kategorie',
            'search': 'Suche'
        };

        function _getFilterValueLabel(type, value) {
            if (type === 'status') return value === 'true' ? 'Aktiv' : value === 'false' ? 'Ausverkauft' : 'Alle';
            if (type === 'hh') return value === 'true' ? 'Mit Aktion' : value === 'false' ? 'Ohne Aktion' : 'Alle';
            return value;
        }

        function updateActiveFilterPills() {
            const row = document.getElementById('active-filters-row');
            const container = document.getElementById('active-filter-pills');
            if (!row || !container) return;

            const pills = [];
            ['status', 'hh', 'cat', 'search'].forEach(type => {
                const value = _productFilterState[type];
                if (value && value !== 'all' && value !== '') {
                    pills.push({
                        type,
                        value,
                        label: `${_filterTypeLabels[type]}: ${_getFilterValueLabel(type, value)}`
                    });
                }
            });

            if (pills.length === 0) {
                row.classList.add('hidden');
                container.innerHTML = '';
                return;
            }

            row.classList.remove('hidden');
            container.innerHTML = pills.map(p => `
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300 text-[10px] font-bold border border-amber-200 dark:border-amber-800">
                    ${escapeHtml(p.label)}
                    <button onclick="removeFilterPill('${p.type}')" class="hover:text-amber-900 dark:hover:text-amber-100 ml-0.5">
                        <span class="material-symbols-outlined" style="font-size:11px;">close</span>
                    </button>
                </span>
            `).join('');
        }

        function removeFilterPill(type) {
            _productFilterState[type] = 'all';
            // Reset chip active state für diesen Type
            document.querySelectorAll('.filter-chip[data-filter-type="' + type + '"]').forEach(c => {
                c.classList.toggle('active', c.dataset.filterValue === 'all');
            });
            // Search-Feld leeren falls type=search
            if (type === 'search') {
                const searchInput = document.getElementById('product-search');
                if (searchInput) searchInput.value = '';
            }
            applyProductFilters();
            updateActiveFilterPills();
        }

        function clearAllProductFilters() {
            ['status', 'hh', 'cat', 'search'].forEach(type => {
                _productFilterState[type] = 'all';
            });
            // Alle Chips zurücksetzen
            document.querySelectorAll('.filter-chip').forEach(c => {
                c.classList.toggle('active', c.dataset.filterValue === 'all');
            });
            // Search leeren
            const searchInput = document.getElementById('product-search');
            if (searchInput) searchInput.value = '';
            applyProductFilters();
            updateActiveFilterPills();
            // Saved-View Select zurücksetzen
            const select = document.getElementById('saved-views-select');
            if (select) select.value = '';
            // Phase 14 P1-Fix: Null-Check fehlte — brach ab wenn Button nicht im DOM
            const deleteViewBtn = document.getElementById('delete-view-btn');
            if (deleteViewBtn) deleteViewBtn.classList.add('hidden');
        }

        // ── Saved Views (localStorage pro Tenant) ──
        function _getSavedViewsKey() {
            const slug = window.location.pathname.split('/')[1] || 'default';
            return `digi_gastro_saved_views_${slug}`;
        }

        function _loadSavedViews() {
            try {
                const raw = localStorage.getItem(_getSavedViewsKey());
                return JSON.parse(raw) || {};
            } catch { return {}; }
        }

        function _saveSavedViewsToStorage(views) {
            try {
                localStorage.setItem(_getSavedViewsKey(), JSON.stringify(views));
            } catch (e) { console.warn('Failed to save views:', e); }
        }

        function refreshSavedViewsSelect() {
            const select = document.getElementById('saved-views-select');
            if (!select) return;
            const views = _loadSavedViews();
            const currentVal = select.value;
            // Behalte "—" Option, füge gespeicherte Views hinzu
            select.innerHTML = '<option value="">— Gespeicherte Ansicht —</option>' +
                Object.keys(views).map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');
            select.value = currentVal;
        }

        function saveCurrentView() {
            const name = prompt('Name für diese Ansicht:', 'Meine Ansicht');
            if (!name || !name.trim()) return;
            const views = _loadSavedViews();
            views[name.trim()] = { ..._productFilterState };
            _saveSavedViewsToStorage(views);
            refreshSavedViewsSelect();
            const select = document.getElementById('saved-views-select');
            if (select) select.value = name.trim();
            document.getElementById('delete-view-btn').classList.remove('hidden');
            showToast('Ansicht gespeichert: ' + name.trim(), 'success');
        }

        function loadSavedView(name) {
            if (!name) {
                document.getElementById('delete-view-btn').classList.add('hidden');
                return;
            }
            const views = _loadSavedViews();
            const view = views[name];
            if (!view) return;

            // Filter-State setzen
            _productFilterState.status = view.status || 'all';
            _productFilterState.hh = view.hh || 'all';
            _productFilterState.cat = view.cat || 'all';
            _productFilterState.search = view.search || '';

            // Chips aktualisieren
            ['status', 'hh', 'cat'].forEach(type => {
                document.querySelectorAll('.filter-chip[data-filter-type="' + type + '"]').forEach(c => {
                    c.classList.toggle('active', c.dataset.filterValue === _productFilterState[type]);
                });
            });

            // Search-Feld aktualisieren
            const searchInput = document.getElementById('product-search');
            if (searchInput) searchInput.value = _productFilterState.search;

            applyProductFilters();
            updateActiveFilterPills();
            document.getElementById('delete-view-btn').classList.remove('hidden');
            showToast('Ansicht geladen: ' + name, 'success');
        }

        function deleteSavedView() {
            const select = document.getElementById('saved-views-select');
            if (!select || !select.value) return;
            const name = select.value;
            if (!confirm('Ansicht "' + name + '" löschen?')) return;
            const views = _loadSavedViews();
            delete views[name];
            _saveSavedViewsToStorage(views);
            refreshSavedViewsSelect();
            document.getElementById('delete-view-btn').classList.add('hidden');
            showToast('Ansicht gelöscht', 'success');
        }

        // Initialisiere Saved Views beim Laden
        document.addEventListener('DOMContentLoaded', () => {
            refreshSavedViewsSelect();
        });

        function applyProductFilters() {
            const items = document.querySelectorAll('#product-grid-view .product-tile, #product-table-container .product-row');
            const term = (_productFilterState.search || '').toLowerCase();
            // Phase 1: Sichtbarkeit bestimmen (display none/'' setzen)
            items.forEach(item => {
                let visible = true;
                // Status filter
                if (_productFilterState.status !== 'all' && item.dataset.available !== _productFilterState.status) visible = false;
                // HH filter
                if (_productFilterState.hh !== 'all' && item.dataset.hasHh !== _productFilterState.hh) visible = false;
                // Category filter
                if (_productFilterState.cat !== 'all' && item.dataset.category !== _productFilterState.cat) visible = false;
                // Search
                if (term && !(item.dataset.name || '').includes(term)) visible = false;
                // Merke Sichtbarkeit in data-visible, aber setze display noch nicht
                item.dataset.matchesFilter = visible ? 'true' : 'false';
            });
            // Phase 2: Pagination anwenden — nur die ersten N sichtbar machen
            applyProductPagination();
            // BUG FIX: Update count - VORHER wurden Grid-Tiles UND Table-Rows gezählt (502 statt 251)
            // Jetzt: nur die Items der aktuell sichtbaren View zählen
            const gridContainer = document.getElementById('product-grid-container');
            const isGridView = gridContainer && gridContainer.style.display !== 'none';
            const visibleItems = isGridView
                ? document.querySelectorAll('#product-grid-view .product-tile[data-matches-filter="true"]')
                : document.querySelectorAll('#product-table-container .product-row[data-matches-filter="true"]');
            _productVisibleCount = visibleItems.length;
            // Update BOTH counters (Toolbar + Grid-Header). Früher hatten beide dieselbe ID,
            // was getElementById nur das erste Element zurückgeben ließ → Grid-Counter blieb stale.
            const totalEl = document.getElementById('product-filter-result-count');
            const totalElGrid = document.getElementById('product-filter-result-count-grid');
            if (totalEl) totalEl.textContent = _productVisibleCount;
            if (totalElGrid) totalElGrid.textContent = _productVisibleCount;
        }

        // ── Pagination: zeigt nur die ersten _productShownCount sichtbaren Items ──
        function applyProductPagination() {
            // BUG FIX: Pagination muss NUR für die aktuell sichtbare View gelten.
            // Vorher: beide Views wurden iteriert → 502 Items → 25 angezeigt (aber in
            // verstecktem Grid). Table-Rows bekamen display:none weil Counter bei 25 voll war.
            // Jetzt: nur Items der sichtbaren View behandeln.
            const gridContainer = document.getElementById('product-grid-container');
            const isGridView = gridContainer && gridContainer.style.display !== 'none';
            const items = isGridView
                ? document.querySelectorAll('#product-grid-view .product-tile')
                : document.querySelectorAll('#product-table-container .product-row');
            let shownSoFar = 0;
            items.forEach(item => {
                if (item.dataset.matchesFilter !== 'true') {
                    item.style.display = 'none';
                    return;
                }
                if (shownSoFar < _productShownCount) {
                    item.style.display = '';
                    shownSoFar++;
                } else {
                    item.style.display = 'none';
                }
            });
            // Versteckte View auch verstecken (Sicherheit)
            if (isGridView) {
                document.querySelectorAll('#product-table-container .product-row').forEach(r => r.style.display = 'none');
            } else {
                document.querySelectorAll('#product-grid-view .product-tile').forEach(t => t.style.display = 'none');
            }
            // Load-More Bar aktualisieren
            updateLoadMoreBar();
        }

        function updateLoadMoreBar() {
            const bar = document.getElementById('product-load-more-bar');
            const info = document.getElementById('product-load-more-info');
            if (!bar) return;
            if (_productVisibleCount > _productShownCount) {
                bar.style.display = 'flex';
                const remaining = _productVisibleCount - _productShownCount;
                if (info) {
                    info.textContent = `${_productShownCount} von ${_productVisibleCount} Produkten · ${remaining} weitere verfügbar`;
                }
            } else {
                bar.style.display = 'none';
            }
            // Page-Info (Desktop)
            const pageInfo = document.getElementById('product-page-info');
            if (pageInfo) {
                if (_productVisibleCount > PRODUCTS_PER_PAGE) {
                    pageInfo.textContent = `· ${_productShownCount}/${_productVisibleCount}`;
                    pageInfo.classList.remove('hidden');
                } else {
                    pageInfo.textContent = '';
                    pageInfo.classList.add('hidden');
                }
            }
        }

        function loadMoreProducts() {
            _productShownCount = Math.min(_productShownCount + PRODUCTS_PER_PAGE, _productVisibleCount);
            applyProductPagination();
            // Sanft zum neuen Bereich scrollen

                setTimeout(() => bar.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);

        // Override the old search input to also update state
        // Phase 14 P1-Fix: Doppeltes Feuern von filterProducts() + applyProductFilters()
        // verhindern. Input-Feld hat bereits oninput="filterProducts(this.value)" inline.
        // Statt zusätzlichem addEventListener rufen wir applyProductFilters() direkt aus
        // filterProducts() auf (siehe Funktion filterProducts).
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('product-search');
            // Phase 14: keinen zweiten listener mehr registrieren — wird über filterProducts() gehandelt
            // Init filter chip counts
            updateProductFilterCounts();
            // Initiale Pagination: zeige erste 25 Produkte
            _productShownCount = PRODUCTS_PER_PAGE;
            // Verzögert, damit die Tiles gerendert sind
            setTimeout(() => {
                // BUG FIX: Vorher wurden NUR Grid-Tiles initialisiert.
                // → Table-Rows hatten kein matchesFilter=true → alle versteckt beim Wechsel zu Table.
                // Jetzt: beide Views initialisieren.
                const items = document.querySelectorAll('#product-grid-view .product-tile, #product-table-container .product-row');
                items.forEach(item => item.dataset.matchesFilter = 'true');
                _productVisibleCount = items.length;
                applyProductPagination();
                // Result-Count zurücksetzen — beide Counter synchron halten
                const totalEl = document.getElementById('product-filter-result-count');
                const totalElGrid = document.getElementById('product-filter-result-count-grid');
                if (totalEl) totalEl.textContent = items.length;
                if (totalElGrid) totalElGrid.textContent = items.length;

        // Wenn Filter geändert wird, Pagination zurücksetzen
        const _origSetProductFilter = setProductFilter;
        setProductFilter = function(type, value, btn) {
            _productShownCount = PRODUCTS_PER_PAGE;
            _origSetProductFilter(type, value, btn);
        };

        function updateProductFilterCounts() {
            try {
                const products = allProducts || [];
                const totalAll = products.length;
                const totalActive = products.filter(p => p.is_available).length;
                const totalInactive = products.filter(p => !p.is_available).length;
                const cAll = document.getElementById('count-status-all');
                const cActive = document.getElementById('count-status-true');
                const cInactive = document.getElementById('count-status-false');
                if (cAll) cAll.textContent = totalAll;
                if (cActive) cActive.textContent = totalActive;
                if (cInactive) cInactive.textContent = totalInactive;
            } catch (err) { /* ignore */ }
        }

        // View toggle (Grid / Table) — verwendet style.display statt .hidden-Klasse,
        // weil .hidden (Tailwind) durch andere CSS-Regeln überschrieben werden kann.
        function setProductView(view) {
            const grid = document.getElementById('product-grid-container');
            const table = document.getElementById('product-table-container');
            const gridBtn = document.getElementById('view-btn-grid');
            const tableBtn = document.getElementById('view-btn-table');
            if (view === 'grid') {
                if (grid) grid.style.display = '';
                if (table) table.style.display = 'none';
                if (gridBtn) gridBtn.classList.add('active');
                if (tableBtn) tableBtn.classList.remove('active');
            } else {
                if (grid) grid.style.display = 'none';
                if (table) table.style.display = '';
                if (gridBtn) gridBtn.classList.remove('active');
                if (tableBtn) tableBtn.classList.add('active');
            }
            try { localStorage.setItem('dl_product_view', view); } catch(e) {}
            // Re-init Sortable, falls es noch nicht initialisiert war
            if (typeof initProductSortable === 'function') {
                setTimeout(initProductSortable, 50);
            }
            // BUG FIX: Filter/Pagination neu anwenden — sonst werden beim View-Wechsel
            // aktive Filter nicht auf die neu sichtbare View angewendet.
            setTimeout(() => {
                if (typeof applyProductFilters === 'function') {
                    applyProductFilters();
                }
            }, 60);
        }

        // Restore last view preference
        document.addEventListener('DOMContentLoaded', function() {
            const savedView = localStorage.getItem('dl_product_view') || 'grid';
            setProductView(savedView);
        });

        function filterProductsByCategory(category) {
            const items = document.querySelectorAll('.product-row, .product-card');
            items.forEach(item => {
                if (category === 'all') { item.style.display = ''; return; }
                item.style.display = item.dataset.category === category ? '' : 'none';

        }

        function filterProductsByStatus(status) {

        // Toggle product availability via fetch (no page redirect)
        async function toggleProductAvailability(productId, isChecked) {
            try {
                const res = await fetch('/admin/product-toggle/' + productId, { method: 'POST' });
                if (res.ok) {
                    showToast(isChecked ? 'Produkt aktiviert' : 'Produkt deaktiviert', 'success');
                } else {
                    showToast('Fehler beim Umschalten', 'error');
                    // Revert checkbox - find the checkbox by product id
                    const cb = document.querySelector(`.switch input[type="checkbox"][onchange*="${productId}"]`);
                    if (cb) cb.checked = !isChecked;
                }
            } catch (err) {
                showToast('Verbindungsfehler', 'error');
                const cb = document.querySelector(`.switch input[type="checkbox"][onchange*="${productId}"]`);
                if (cb) cb.checked = !isChecked;
            }
        }

        // Delete product via fetch (stays on produkte tab)
        async function deleteProduct(productId, productName) {
            if (!confirm('Produkt "' + productName + '" löschen?')) return;
            try {
                const res = await fetch('/admin/produkt-loeschen/' + productId, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'X-Requested-With': 'fetch' }
                });
                if (res.ok) {
                    showToast('Produkt gelöscht', 'success');
                    refreshProductsUI();
                } else {
                    showToast('Fehler beim Löschen', 'error');
                }
            } catch (err) {
                showToast('Verbindungsfehler', 'error');
            }
        }

            // → Wenn Filter aktiv war, wurden auch ausgeblendete Produkte beim Bulk-Delete erfasst.

        // ── Bulk move to category ──
        function toggleBulkCategoryDropdown() {
            const dd = document.getElementById('bulk-category-dropdown');
            dd.classList.toggle('hidden');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            const wrapper = document.getElementById('bulk-category-dropdown-wrapper');
            const dd = document.getElementById('bulk-category-dropdown');
            if (wrapper && dd && !wrapper.contains(e.target)) {

        async function bulkMoveToCategory(categoryName) {
            const dd = document.getElementById('bulk-category-dropdown');
            if (dd) dd.classList.add('hidden');
            const checked = document.querySelectorAll('.product-checkbox:checked');
            if (checked.length === 0) return;
            let successCount = 0;
            for (const cb of checked) {
                const pid = cb.dataset.productId;
                const product = allProducts.find(p => String(p.id) === String(pid));
                if (!product) continue;
                const formData = new FormData();
                formData.append('name', product.name);
                formData.append('price', product.price);
                formData.append('description', product.description || '');
                formData.append('category', categoryName);
                formData.append('category_type', product.category_type || 'küche');
                formData.append('name_en', product.name_en || '');
                formData.append('description_en', product.description_en || '');
                formData.append('image_url', product.image || '');
                formData.append('is_vegan', product.is_vegan ? 'true' : 'false');
                formData.append('is_glutenfree', product.is_glutenfree ? 'true' : 'false');
                formData.append('is_available', product.is_available !== false ? 'true' : 'false');
                if (product.happy_hour_price) formData.append('happy_hour_price', product.happy_hour_price);
                try {
                    const res = await fetch('/api/products/' + pid, { method: 'PUT', body: formData });
                    if (res.ok) successCount++;
                } catch(e) {}
            }
            showToast(successCount + ' Produkte nach "' + categoryName + '" verschoben', 'success');
            refreshProductsUI();
        }

        // ─── Events System JavaScript ───
        // NOTE: allEvents is already declared above (line ~3462) from server data

        const ALL_DAYS = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
        const DAY_ABBR = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

        // Initialize events from server data
        function initEvents() {
            try {
                const eventsData = document.querySelector('[data-events-json]');
                if (eventsData) {
                    allEvents = JSON.parse(eventsData.getAttribute('data-events-json') || '[]');
                } else {
                    // Try to get from global variable
                    allEvents = window._eventsData || [];
                }
            } catch(e) {
                allEvents = [];

            renderEventsList();
        }

        function renderEventsList() {
            const container = document.getElementById('events-list');
            const emptyState = document.getElementById('events-empty');
            if (!container) return;

            // Update count badge
            const badge = document.getElementById('events-count-badge');
            if (badge) {
                const activeCount = allEvents.filter(e => e.is_active !== false).length;
                badge.textContent = allEvents.length + ' Event' + (allEvents.length === 1 ? '' : 's') + ' · ' + activeCount + ' aktiv';
            }

            if (allEvents.length === 0) {
                container.innerHTML = '';
                if (emptyState) emptyState.classList.remove('hidden');
                return;
            }

            if (emptyState) emptyState.classList.add('hidden');

            container.innerHTML = allEvents.map((ev, idx) => {
                const isActive = ev.is_active !== false;
                const dayStr = (ev.days || []).map(d => d.substring(0,2)).join(', ');
                const prodCount = (ev.products || []).length;
                const comboCount = (ev.combos || []).length;
                const modeLabel = ev.mode === 'discount' ? `${escapeHtml(String(ev.discount))}% auf alles` : `${prodCount} Produkte`;
                const statusColor = isActive ? 'emerald' : 'zinc';
                const statusBg = isActive ? 'bg-emerald-50 border-emerald-200' : 'bg-zinc-100 border-zinc-200';
                const statusDot = isActive ? 'bg-emerald-500' : 'bg-zinc-400';
                const statusText = isActive ? 'Aktiv' : 'Inaktiv';

                const cardBg = isActive ? 'border-purple-200 dark:border-purple-800/40 bg-purple-50/50 dark:bg-purple-900/15' : 'border-gray-200 dark:border-zinc-700 bg-gray-50/50 dark:bg-zinc-800/40';
                const iconBg = isActive ? 'bg-purple-100 dark:bg-purple-900/40' : 'bg-gray-200 dark:bg-zinc-700';
                const iconColor = isActive ? 'text-purple-600 dark:text-purple-400' : 'text-gray-400 dark:text-zinc-500';

                // SECURITY FIX (audit 4.12): Alle nutzerkontrollierten Felder escapen, weil
                // sie per innerHTML gerendert werden. Verhindert Stored-XSS über Event-Name,
                // -Beschreibung, -Zeiten, -Tage und -Modus-Label.
                const evDisplayName = escapeHtml(ev.display_name || ev.name || '');
                const evStartTime   = escapeHtml(ev.start_time || '18:00');
                const evEndTime     = escapeHtml(ev.end_time || '20:00');
                const evDayStr      = escapeHtml(dayStr || 'Keine Tage');
                const evDescription = ev.description ? escapeHtml(ev.description) : '';

                return `
                <div class="p-4 rounded-xl border ${cardBg} transition-all hover:shadow-md">
                    <div class="flex items-start gap-3">
                        <div class="w-10 h-10 rounded-xl ${iconBg} flex items-center justify-center flex-shrink-0">
                            <span class="material-symbols-outlined ${iconColor}" style="font-size:20px;">celebration</span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1 flex-wrap">
                                <span class="font-extrabold text-sm text-zinc-800 dark:text-zinc-100 break-words">${evDisplayName}</span>
                                <span class="text-[9px] font-bold ${statusBg} dark:bg-zinc-800 dark:border-zinc-600 px-2 py-0.5 rounded-full border flex items-center gap-1">
                                    <span class="w-1.5 h-1.5 rounded-full ${statusDot}"></span>
                                    <span class="dark:text-zinc-400">${statusText}</span>
                                </span>
                            </div>
                            <div class="flex items-center gap-3 text-[10px] text-zinc-500 dark:text-zinc-500 font-medium flex-wrap">
                                <span class="flex items-center gap-0.5">
                                    <span class="material-symbols-outlined" style="font-size:12px;">schedule</span>
                                    ${evStartTime} – ${evEndTime}
                                </span>
                                <span class="flex items-center gap-0.5">
                                    <span class="material-symbols-outlined" style="font-size:12px;">calendar_today</span>
                                    ${evDayStr}
                                </span>
                                <span class="flex items-center gap-0.5">
                                    <span class="material-symbols-outlined" style="font-size:12px;">lunch_dining</span>
                                    ${modeLabel}
                                </span>
                                ${comboCount > 0 ? (() => {
                                    const combosWithOwnTime = (ev.combos || []).filter(c => (c.days && c.days.length > 0) || (c.start_time && c.end_time));
                                    let comboHtml = `<span class="flex items-center gap-0.5 text-teal-700 dark:text-teal-400">
                                        <span class="material-symbols-outlined" style="font-size:12px;">loyalty</span>
                                        ${comboCount} Kombi${comboCount > 1 ? 's' : ''}
                                    </span>`;
                                    if (combosWithOwnTime.length > 0) {
                                        comboHtml += `<span class="flex items-center gap-0.5 text-teal-700 dark:text-teal-400">
                                            <span class="material-symbols-outlined" style="font-size:12px;">schedule</span>
                                            ${combosWithOwnTime.length} mit eigener Zeit
                                        </span>`;
                                    }
                                    return comboHtml;
                                })() : ''}
                            </div>
                            ${evDescription ? `<p class="text-[10px] text-zinc-500 dark:text-zinc-500 mt-1 break-words">${evDescription}</p>` : ''}
                        </div>
                        <div class="flex items-center gap-1 flex-shrink-0">
                            <button onclick="openEventEditModal(${parseInt(ev.id, 10)})" class="text-zinc-500 dark:text-zinc-500 hover:text-purple-600 dark:hover:text-purple-400 transition-colors p-2.5 rounded-lg hover:bg-purple-50 dark:hover:bg-purple-900/30 min-w-[44px] min-h-[44px] flex items-center justify-center" title="Bearbeiten">

                                <span class="material-symbols-outlined" style="font-size:18px;">delete</span>
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('event-save-text').textContent = 'Event erstellen';

            document.getElementById('event-display-name').value = '';

        function openEventEditModal(eventId) {

            document.getElementById('event-edit-id').value = eventId;
            document.getElementById('event-modal-title').textContent = 'Event bearbeiten';
            document.getElementById('event-save-text').textContent = 'Änderungen speichern';

            document.getElementById('event-display-name').value = ev.display_name || '';
            document.getElementById('event-description').value = ev.description || '';
