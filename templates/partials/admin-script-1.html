        function toggleEventProductRow(productId, isChecked) {
            const fields = document.getElementById('ep-fields-' + productId);
            const row = document.getElementById('ep-row-' + productId);
            if (isChecked) {
                if (fields) fields.classList.remove('hidden');
                if (row) {
                    row.classList.remove('border-gray-100', 'bg-gray-50', 'dark:border-zinc-700', 'dark:bg-zinc-800/60');
                    row.classList.add('border-purple-300', 'bg-purple-50', 'dark:border-purple-700', 'dark:bg-purple-900/20');
                }
                const priceInput = document.getElementById('ep-price-' + productId);
                if (priceInput) priceInput.focus();
            } else {
                if (fields) fields.classList.add('hidden');
                if (row) {
                    row.classList.remove('border-purple-300', 'bg-purple-50', 'dark:border-purple-700', 'dark:bg-purple-900/20');
                    row.classList.add('border-gray-100', 'bg-gray-50', 'dark:border-zinc-700', 'dark:bg-zinc-800/60');
                }
                const priceInput = document.getElementById('ep-price-' + productId);
                if (priceInput) priceInput.value = '';
            }
            updateEventProductCount();
        }

        function updateEventProductCount() {
            const checked = document.querySelectorAll('.ep-toggle:checked');
            const countEl = document.getElementById('event-product-count');
            if (countEl) countEl.textContent = checked.length + ' ausgewählt';
        }

        function toggleEventDiscountRow() {
            const mode = document.getElementById('event-mode').value;
            const discountRow = document.getElementById('event-discount-row');
            if (discountRow) {
                if (mode === 'discount') {
                    discountRow.classList.remove('hidden');
                } else {
                    discountRow.classList.add('hidden');
                }
            }
            // Meldungs-Hinweis nur im announcement-Modus anzeigen
            const hintEl = document.getElementById('event-announcement-hint');
            if (hintEl) {
                if (mode === 'announcement') {
                    hintEl.classList.remove('hidden');
                } else {
                    hintEl.classList.add('hidden');
                }
            }
            // Im announcement-Modus: Produkt-Liste + Combo-Liste verstecken (nicht relevant)
            const productList = document.getElementById('event-products-list');
            const productContainer = productList?.closest('.space-y-2');
            if (productContainer) {
                if (mode === 'announcement') {
                    productContainer.style.display = 'none';
                } else {
                    productContainer.style.display = '';
                }
            }
            const comboList = document.getElementById('event-combos-list');
            const comboContainer = comboList?.closest('.space-y-3');
            if (comboContainer) {
                if (mode === 'announcement') {
                    comboContainer.style.display = 'none';
                } else {
                    comboContainer.style.display = '';
                }
            }
        }

        function collectEventData() {
            const editId = document.getElementById('event-edit-id').value;
            const name = document.getElementById('event-name').value.trim();
            const displayName = document.getElementById('event-display-name').value.trim() || name;
            const description = document.getElementById('event-description').value.trim();
            const startTime = document.getElementById('event-start-time').value || '17:00';
            const endTime = document.getElementById('event-end-time').value || '20:00';
            const mode = document.getElementById('event-mode').value;
            const discount = parseInt(document.getElementById('event-discount').value || '0');
            const isActive = document.getElementById('event-is-active').checked;

            // Collect selected days
            const days = [];
            document.querySelectorAll('.event-day-check:checked').forEach(cb => {
                days.push(cb.value);
            });

            // Collect selected products with prices
            const products = [];
            document.querySelectorAll('.ep-toggle:checked').forEach(cb => {
                const pid = parseInt(cb.dataset.productId);
                const priceInput = document.getElementById('ep-price-' + pid);
                const eventPrice = priceInput && priceInput.value ? parseFloat(priceInput.value) : null;
                if (pid && eventPrice && eventPrice > 0) {
                    products.push({ product_id: pid, event_price: eventPrice });
                }
            });

            // Collect combos
            const combos = eventCombosData.filter(c => c.name && c.combo_price && (c.items || []).length > 0).map(c => ({
                name: c.name.trim(),
                combo_price: parseFloat(c.combo_price) || 0,
                days: (c.days && c.days.length > 0) ? c.days : null,
                start_time: c.start_time || null,
                end_time: c.end_time || null,
                items: (c.items || []).map(ci => ({
                    product_id: ci.product_id || null,
                    category_name: ci.category_name || null
                }))
            }));

            return {
                editId: editId ? parseInt(editId) : null,
                name: name || 'Neues Event',
                display_name: displayName,
                description,
                days,
                start_time: startTime,
                end_time: endTime,
                mode,
                discount: mode === 'discount' ? discount : 0,
                is_active: isActive,
                products,
                combos
            };
        }

        function saveEvent() {
            const data = collectEventData();

            // ── FIX: Combo-Tage als Event-Tage übernehmen ──
            // Wenn User Combo-Tage ausgewählt hat aber keine Event-Tage,
            // übernehme die Combo-Tage als Event-Tage (das Event muss ja
            // an diesen Tagen aktiv sein, damit die Combo verfügbar ist).
            if (data.days.length === 0 && data.combos && data.combos.length > 0) {
                const comboDays = data.combos
                    .filter(c => c.days && c.days.length > 0)
                    .flatMap(c => c.days);
                const uniqueComboDays = [...new Set(comboDays)];
                if (uniqueComboDays.length > 0) {
                    data.days = uniqueComboDays;
                    // Event-Day-Checkboxes ebenfalls setzen für visuelle Konsistenz
                    uniqueComboDays.forEach(day => {
                        const cb = document.querySelector(`.event-day-check[value="${day}"]`);
                        if (cb) cb.checked = true;
                    });
                    showToast(`Event-Tage automatisch von Kombi übernommen: ${uniqueComboDays.map(d => d.substring(0,2)).join(', ')}`, 'success');
                }
            }

            if (data.days.length === 0) {
                showToast('Bitte wähle mindestens einen Tag aus (entweder Event-Tage oder Kombi-Tage)', 'error');
                return;
            }

            if (data.mode === 'selected' && data.products.length === 0) {
                // FIX: Wenn Kombis mit Produkten vorhanden sind, ist das OK
                // — Kombi-Preise sind eine Alternative zu einzelnen Eventpreisen
                const hasValidCombos = data.combos && data.combos.length > 0;
                if (!hasValidCombos) {
                    showToast('Bitte wähle mindestens ein Produkt mit Eventpreis ODER erstelle ein Kombi-Angebot', 'error');
                    return;
                }
            }

            const isEdit = data.editId !== null;
            const url = isEdit ? `/admin/events/${data.editId}` : '/admin/events';
            const method = isEdit ? 'PUT' : 'POST';

            fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    showToast(isEdit ? 'Event aktualisiert!' : 'Event erstellt!', 'success');
                    closeEventModal();
                    // Reload events data
                    loadEventsData();
                } else {
                    showToast('Fehler: ' + (result.error || 'Unbekannt'), 'error');
                }
            })
            .catch(err => {
                console.error('Event save error:', err);
                showToast('Verbindungsfehler', 'error');
            });
        }

        function deleteEvent(eventId) {
            const ev = allEvents.find(e => e.id === eventId);
            if (!ev) return;
            if (!confirm(`Event "${ev.display_name || ev.name}" wirklich löschen?`)) return;

            fetch(`/admin/events/${eventId}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    showToast('Event gelöscht!', 'success');
                    loadEventsData();
                } else {
                    showToast('Fehler: ' + (result.error || 'Unbekannt'), 'error');
                }
            })
            .catch(err => {
                console.error('Event delete error:', err);
                showToast('Verbindungsfehler', 'error');
            });
        }

        async function loadEventsData() {
            try {
                const res = await fetch(window.location.pathname);
                const html = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                // Update allEvents from the fetched page using robust JSON extraction
                const scriptTags = doc.querySelectorAll('script');
                for (const s of scriptTags) {
                    const txt = s.textContent || '';
                    const eventsJson = extractJsonArray(txt, 'allEvents');
                    if (eventsJson) { try { allEvents = JSON.parse(eventsJson); } catch(e){} }
                    const productsJson = extractJsonArray(txt, 'allProducts');
                    if (productsJson) { try { allProducts = JSON.parse(productsJson); window._productsData = allProducts; } catch(e){} }
                }
                renderEventsList();
            } catch (err) {
                window.location.reload();
            }
        }

        // ═══════════════════════════════════════════════════
        // COMBO DEALS (Kombi-Angebote)
        // ═══════════════════════════════════════════════════
        let eventCombosData = [];
        let comboTempIdCounter = 0;

        function addEventCombo() {
            comboTempIdCounter++;
            eventCombosData.push({
                _tempId: comboTempIdCounter,
                name: '',
                combo_price: '',
                days: null,
                start_time: '',
                end_time: '',
                items: []
            });
            renderCombosList();
        }

        function removeEventCombo(tempId) {
            eventCombosData = eventCombosData.filter(c => c._tempId !== tempId);
            renderCombosList();
        }

        function updateComboField(tempId, field, value) {
            const combo = eventCombosData.find(c => c._tempId === tempId);
            if (combo) {
                combo[field] = value;
                renderCombosList();
            }
        }

        function toggleComboItem(tempId, productId, isChecked) {
            const combo = eventCombosData.find(c => c._tempId === tempId);
            if (!combo) return;
            if (!combo.items) combo.items = [];

            // Finde die Kategorie des Produkts
            const products = window._productsData || [];
            const product = products.find(p => p.id === productId);
            const categoryName = product ? product.category : 'Produkte';

            if (isChecked) {
                if (!combo.items.find(i => i.product_id === productId)) {
                    // NEU: Speichere product_id UND category_name als Gruppe
                    // Der Kunde wählt dann 1 aus allen Produkten derselben Kategorie
                    combo.items.push({ product_id: productId, category_name: categoryName });
                }
            } else {
                combo.items = combo.items.filter(i => i.product_id !== productId);
            }
            renderCombosList();
        }

        function toggleComboCategory(tempId, categoryName, isChecked) {
            const combo = eventCombosData.find(c => c._tempId === tempId);
            if (!combo) return;
            if (!combo.items) combo.items = [];

            if (isChecked) {
                // NEU: Kategorie als "Kunde wählt 1" speichern, NICHT alle Produkte
                // Statt alle Produkte einzeln hinzuzufügen, speichern wir nur den Kategorienamen
                // Der Kunde wählt dann im Menü ein Produkt aus dieser Kategorie
                if (!combo.items.find(i => i.category_name === categoryName)) {
                    combo.items.push({ category_name: categoryName, product_id: null });
                }
            } else {
                // Kategorie-Auswahl entfernen
                combo.items = combo.items.filter(i => i.category_name !== categoryName);
            }
            renderCombosList();
        }

        function toggleComboDay(tempId, day, isChecked) {
            const combo = eventCombosData.find(c => c._tempId === tempId);
            if (!combo) return;
            if (!combo.days) combo.days = [];

            if (isChecked) {
                if (!combo.days.includes(day)) combo.days.push(day);
            } else {
                combo.days = combo.days.filter(d => d !== day);
            }
            renderCombosList();
        }

        function renderCombosList() {
            const container = document.getElementById('event-combos-list');
            if (!container) return;

            const products = window._productsData || [];

            // Get unique categories from products
            const categories = [...new Set(products.filter(p => p.is_available !== false).map(p => p.category))].filter(Boolean).sort();

            if (eventCombosData.length === 0) {
                container.innerHTML = '<div class="text-center py-4 text-[10px] text-zinc-500">Keine Kombi-Angebote. Klicke "Neue Kombi" um eins zu erstellen.</div>';
                updateComboCount();
                return;
            }

            container.innerHTML = eventCombosData.map(combo => {
                // NEU: selectedIds nur für feste Produkte (category_items haben product_id=null)
                const selectedIds = (combo.items || []).filter(i => i.product_id).map(i => i.product_id);
                const selectedCategories = (combo.items || []).filter(i => i.category_name).map(i => i.category_name);
                const individualSum = selectedIds.reduce((sum, pid) => {
                    const p = products.find(x => x.id === pid);
                    return sum + (p ? parseFloat(p.price) : 0);
                }, 0);
                const savings = individualSum - (parseFloat(combo.combo_price) || 0);
                const comboDays = combo.days || [];
                const hasOwnDays = Array.isArray(combo.days) && combo.days.length > 0;
                const hasOwnTime = !!(combo.start_time && combo.end_time);

                // Determine which categories are selected (as category pick or individual products)
                const categoryStates = categories.map(cat => {
                    const catProducts = products.filter(p => p.is_available !== false && p.category === cat);
                    const catSelectedCount = catProducts.filter(p => selectedIds.includes(p.id)).length;
                    const isCategoryPick = selectedCategories.includes(cat);
                    return { name: cat, total: catProducts.length, selected: catSelectedCount, isCategoryPick };
                });

                return `
                <div class="p-3 rounded-xl border-2 border-teal-300 bg-teal-50 dark:border-teal-500 dark:bg-teal-900/30 space-y-2.5" id="combo-${combo._tempId}">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 flex-1 min-w-0">
                            <span class="material-symbols-outlined text-teal-700 dark:text-teal-300" style="font-size:16px;">loyalty</span>
                            <input type="text" placeholder="Kombi-Name, z.B. Cola + Shisha" value="${(combo.name || '').replace(/"/g, '&quot;')}"
                                   class="flex-1 bg-white dark:bg-zinc-700 border border-teal-200 dark:border-teal-600 rounded-lg px-2 py-1 text-[11px] font-bold text-zinc-900 dark:text-white focus:ring-teal-400 focus:border-teal-400"
                                   onchange="updateComboField(${combo._tempId}, 'name', this.value)">
                        </div>
                        <button type="button" onclick="removeEventCombo(${combo._tempId})" class="text-red-600 hover:text-red-600 p-1 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors ml-2" title="Kombi entfernen">
                            <span class="material-symbols-outlined" style="font-size:16px;">delete</span>
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="text-[10px] font-bold text-zinc-700 dark:text-zinc-200 shrink-0">Kombipreis:</label>
                        <input type="number" step="0.01" min="0" placeholder="18.00" value="${combo.combo_price || ''}"
                               class="w-24 bg-white dark:bg-zinc-700 border border-teal-200 dark:border-teal-600 rounded-lg px-2 py-1 text-[11px] font-mono font-bold text-zinc-900 dark:text-white focus:ring-teal-400 focus:border-teal-400"
                               onchange="updateComboField(${combo._tempId}, 'combo_price', this.value)">
                        <span class="text-[10px] text-zinc-600 dark:text-zinc-400 font-bold">€</span>
                        ${savings > 0 ? `<span class="text-[9px] font-bold text-emerald-700 bg-emerald-100 dark:text-emerald-300 dark:bg-emerald-800/50 px-1.5 py-0.5 rounded-full">Spare ${savings.toFixed(2).replace('.', ',')} €</span>` : ''}
                    </div>

                    <!-- Per-combo time/day restrictions -->
                    <div class="border-t border-teal-300/60 dark:border-teal-600/50 pt-2.5 space-y-2">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="material-symbols-outlined text-zinc-500 dark:text-zinc-400" style="font-size:14px;">schedule</span>
                            <label class="text-[10px] font-bold text-zinc-600 dark:text-zinc-200">Eigene Zeiten & Tage (optional)</label>
                        </div>
                        <p class="text-[9px] text-zinc-500 dark:text-zinc-400 -mt-1 mb-1">Leer = gelten die Zeiten/Tage des Events.</p>

                        <div class="flex flex-wrap gap-1.5">
                            ${ALL_DAYS.map(day => {
                                const isSelected = comboDays.includes(day);
                                return `
                                <label class="flex items-center gap-1 ${isSelected ? 'bg-teal-200 border-teal-400 text-teal-800 dark:bg-teal-600 dark:border-teal-400 dark:text-white' : 'bg-gray-100 border-gray-300 text-gray-600 dark:bg-zinc-700 dark:border-zinc-500 dark:text-zinc-200'} px-2 py-1 rounded-lg text-[9px] font-bold cursor-pointer select-none transition-colors hover:border-teal-400 border">
                                    <input type="checkbox" class="combo-day-check rounded text-teal-700 focus:ring-0"
                                           data-combo-temp-id="${combo._tempId}" value="${day}" ${isSelected ? 'checked' : ''}
                                           onchange="toggleComboDay(${combo._tempId}, '${day}', this.checked)">
                                    <span>${day.substring(0,2)}</span>
                                </label>`;
                            }).join('')}
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[9px] text-zinc-600 dark:text-zinc-400 font-bold block mb-0.5">Von</label>
                                <input type="time" value="${combo.start_time || ''}"
                                       class="w-full bg-white dark:bg-zinc-700 border border-teal-200 dark:border-teal-600 rounded-lg px-2 py-1 text-[10px] font-mono text-zinc-900 dark:text-white focus:ring-teal-400 focus:border-teal-400"
                                       onchange="updateComboField(${combo._tempId}, 'start_time', this.value)">
                            </div>
                            <div>
                                <label class="text-[9px] text-zinc-600 dark:text-zinc-400 font-bold block mb-0.5">Bis</label>
                                <input type="time" value="${combo.end_time || ''}"
                                       class="w-full bg-white dark:bg-zinc-700 border border-teal-200 dark:border-teal-600 rounded-lg px-2 py-1 text-[10px] font-mono text-zinc-900 dark:text-white focus:ring-teal-400 focus:border-teal-400"
                                       onchange="updateComboField(${combo._tempId}, 'end_time', this.value)">
                            </div>
                        </div>
                        ${hasOwnDays || hasOwnTime ? `<div class="text-[9px] font-bold text-teal-700 dark:text-teal-300 bg-teal-100 dark:bg-teal-800/50 px-2 py-1 rounded-lg border border-teal-300 dark:border-teal-600">Nur ${hasOwnDays ? comboDays.map(d => d.substring(0,2)).join(', ') + ' ' : ''}${hasOwnTime ? (combo.start_time || '...') + '–' + (combo.end_time || '...') : ''}</div>` : ''}
                    </div>

                    <!-- Category Quick-Select -->
                    <div>
                        <label class="text-[10px] font-bold text-zinc-600 dark:text-zinc-200 mb-1.5 block">Ganze Kategorie auswählen <span class="text-teal-600 dark:text-teal-400">(Kunde wählt 1 aus aller Produkte)</span></label>
                        <div class="flex flex-wrap gap-1.5 mb-2">
                            ${categoryStates.map(cs => {
                                const allSelected = cs.total > 0 && cs.selected === cs.total;
                                const someSelected = cs.selected > 0 && cs.selected < cs.total;
                                const isCatPick = cs.isCategoryPick;
                                const stateClass = (isCatPick || allSelected)
                                    ? 'bg-teal-200 border-teal-400 text-teal-800 dark:bg-teal-600 dark:border-teal-400 dark:text-white'
                                    : someSelected
                                        ? 'bg-teal-100 border-teal-300 text-teal-700 dark:bg-teal-700/60 dark:border-teal-500 dark:text-teal-200'
                                        : 'bg-gray-100 border-gray-300 text-gray-600 dark:bg-zinc-700 dark:border-zinc-500 dark:text-zinc-200';
                                return `
                                <label class="flex items-center gap-1 ${stateClass} px-2 py-1 rounded-lg text-[9px] font-bold cursor-pointer select-none transition-colors hover:border-teal-400 border">
                                    <input type="checkbox" class="combo-cat-toggle rounded text-teal-700 focus:ring-0"
                                           data-combo-temp-id="${combo._tempId}" value="${cs.name}" ${(isCatPick || allSelected) ? 'checked' : ''} ${someSelected ? 'style="opacity:0.5"' : ''}
                                           onchange="toggleComboCategory(${combo._tempId}, '${cs.name.replace(/'/g, "\\'")}', this.checked)">
                                    <span>${cs.name}</span>
                                    <span class="text-[8px] opacity-70">${isCatPick ? '(Kunde wählt)' : '(' + cs.selected + '/' + cs.total + ')'}</span>
                                </label>`;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Individual Products -->
                    <div>
                        <label class="text-[10px] font-bold text-zinc-600 dark:text-zinc-200 mb-1.5 block">Einzelne Produkte auswählen <span class="text-teal-600 dark:text-teal-400">(Kunde wählt 1 pro Kategorie)</span></label>
                        <div class="space-y-1 max-h-[200px] overflow-y-auto">
                            ${products.filter(p => p.is_available !== false).map(p => {
                                const isSelected = selectedIds.includes(p.id);
                                return `
                                <label class="flex items-center gap-2 px-2 py-1.5 rounded-lg ${isSelected ? 'bg-teal-200 dark:bg-teal-700/60 border border-teal-400 dark:border-teal-500' : 'bg-gray-100 dark:bg-zinc-700/50 border border-transparent'} cursor-pointer transition-colors text-[10px]">
                                    <input type="checkbox" class="combo-item-toggle rounded text-teal-700 focus:ring-teal-400 shrink-0"
                                           data-combo-temp-id="${combo._tempId}" data-product-id="${p.id}"
                                           ${isSelected ? 'checked' : ''}
                                           onchange="toggleComboItem(${combo._tempId}, ${p.id}, this.checked)">
                                    <span class="font-bold text-zinc-800 dark:text-white">${p.name}</span>
                                    <span class="text-zinc-500 dark:text-zinc-400 font-mono ml-auto">${parseFloat(p.price).toFixed(2)} €</span>
                                </label>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
            }).join('');

            updateComboCount();
        }

        function updateComboCount() {
            const countEl = document.getElementById('event-combo-count');
            if (countEl) countEl.textContent = eventCombosData.length + ' Kombi' + (eventCombosData.length !== 1 ? 's' : '');
        }

        // Initialize events list on DOMContentLoaded
        // NOTE: allEvents and allProducts are already initialized from server-side Jinja2 data above
        document.addEventListener('DOMContentLoaded', function() {
            renderEventsList();

            // SortableJS für Landingpage Custom Sections (Drag & Drop Sortierung)
            const lpContainer = document.getElementById('landing-sections-container');
            if (lpContainer && typeof Sortable !== 'undefined') {
                Sortable.create(lpContainer, {
                    handle: '.lp-drag-handle',
                    animation: 200,
                    ghostClass: 'opacity-30',
                    filter: 'input, textarea, button, .form-field',
                    preventOnFilter: false,
                });
            }
        });

        // closeEditProductModal is defined above (delegates to closeEditSlideOver)

        function openCsvImportModal() {
            document.getElementById('csv-import-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeCsvImportModal() {
            document.getElementById('csv-import-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function submitEditProduct(event) {
            event.preventDefault();
            const id = document.getElementById('edit-product-id').value;

            // ── Client-seitige Validierung (statt HTML required) ──
            // Bug-Fix: HTML required auf versteckten Tabs blockt den Submit
            // unsichtbar (Browser kann required in display:none nicht prüfen).
            // Jetzt: explizite Prüfung + Toast-Meldung.
            const nameVal = (document.getElementById('edit-product-name').value || '').trim();
            const priceVal = (document.getElementById('edit-product-price').value || '').trim();
            if (!nameVal) {
                showToast('Bitte Produkt-Name eingeben', 'error');
                // Zum Details-Tab wechseln, damit User das Feld sieht
                switchSlideTab('details', document.querySelector('.slide-tab-btn'));
                document.getElementById('edit-product-name').focus();
                return;
            }
            if (!priceVal) {
                showToast('Bitte Preis eingeben (z.B. 3.50)', 'error');
                switchSlideTab('details', document.querySelector('.slide-tab-btn'));
                document.getElementById('edit-product-price').focus();
                return;
            }

            // Submit-Button visuelles Feedback (Loading-State)
            const submitBtn = document.querySelector('#edit-product-form button[type="submit"]');
            const origHtml = submitBtn ? submitBtn.innerHTML : '';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '⏳ Speichern...';
                submitBtn.classList.add('opacity-60', 'cursor-not-allowed');
            }

            const formData = new FormData();
            formData.append('name', document.getElementById('edit-product-name').value);
            formData.append('price', parseFloat(document.getElementById('edit-product-price').value));
            formData.append('description', document.getElementById('edit-product-description').value);
            formData.append('category', document.getElementById('edit-product-category').value);
            formData.append('name_en', document.getElementById('edit-product-name-en').value);
            formData.append('description_en', document.getElementById('edit-product-description-en').value);
            formData.append('image_url', document.getElementById('edit-product-image-url').value);

            const fileInput = document.getElementById('edit-product-image-file');
            if (fileInput.files.length > 0) {
                formData.append('image_file', fileInput.files[0]);
            }
            formData.append('is_vegan', document.getElementById('edit-product-is-vegan').checked ? 'true' : 'false');
            formData.append('is_glutenfree', document.getElementById('edit-product-is-glutenfree').checked ? 'true' : 'false');
            formData.append('category_type', document.getElementById('edit-product-type').value);

            // Aktionspreis entfernt — Event-Preise über Events-Tab verwalten

            // Upselling: Verwandte Produkte sammeln und als JSON-Array senden
            const upsellCheckboxes = document.querySelectorAll('.upsell-product-checkbox:checked');
            const relatedIds = Array.from(upsellCheckboxes).map(cb => parseInt(cb.value));
            formData.append('related_product_ids', JSON.stringify(relatedIds));

            // Allergene: Ausgewählte Allergene sammeln und als JSON-Array senden
            const allergenCheckboxes = document.querySelectorAll('.allergen-checkbox:checked');
            const allergens = Array.from(allergenCheckboxes).map(cb => cb.value);
            formData.append('allergens', JSON.stringify(allergens));

            fetch(`/api/products/${id}`, {
                method: 'PUT',
                body: formData
            })
            .then(res => {
                if (res.ok) {
                    closeEditProductModal();
                    showToast('Produkt erfolgreich gespeichert!', 'success');
                    refreshProductsUI();
                } else {
                    // Freundliche Fehlermeldung aus Backend
                    res.json().then(err => {
                        const detail = err.detail || err.error || 'Fehler beim Aktualisieren';
                        showToast(detail, 'error');
                    }).catch(() => showToast('Fehler beim Aktualisieren des Produkts', 'error'));
                }
            })
            .catch(err => {
                console.error("Edit-Fehler:", err);
                showToast('Verbindungsfehler bei der Übertragung', 'error');
            })
            .finally(() => {
                // Button-Reset (falls Modal nicht geschlossen wurde wegen Fehler)
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = origHtml;
                    submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                }
            });
        }

            const sections = [];
            const sectionItems = document.querySelectorAll('.landing-section-item');
            sectionItems.forEach(item => {

                    const sectionData = {
                        type: type,
                        title: titleInput ? titleInput.value.trim() : '',
                        content: contentTextarea ? contentTextarea.value.trim() : ''
                    };
                    if (type === 'custom') {
                        sectionData.image = existingImage || '';

        async function generateSingleImage(btn, targetInputId, nameInputId, typeInputId) {
            const productName = document.getElementById(nameInputId).value.trim();
            if (!productName) {
                showToast("Bitte geben Sie zuerst einen Produktnamen ein.", "error");
                return;
            }
            
            // ── Detailed step-by-step logging for debugging ────────────────
            // Each log line is prefixed with [KI-Bild <elapsed>ms] so we can
            // see exactly where the flow stalls or fails in the user's console.
            const t0 = performance.now();
            const log = (msg, ...args) => console.log(`%c[KI-Bild ${(performance.now()-t0).toFixed(0)}ms] ${msg}`, 'color:#6366f1', ...args);
            const logErr = (msg, ...args) => console.error(`[KI-Bild ${(performance.now()-t0).toFixed(0)}ms] ${msg}`, ...args);
            
            log('Start — version:', window.__DG_VERSION, '| product:', productName);
            
            // Check if Puter.js is loaded (it's loaded synchronously in <head>)
            if (typeof puter === 'undefined') {
                logErr('Puter.js NOT loaded. Script tag:', document.querySelector('script[src*="puter"]'));
                showToast("KI-Service noch nicht bereit. Bitte lade die Seite neu und versuche es erneut.", "error");
                return;
            }
            log('Puter.js loaded. puter.auth:', !!puter.auth, '| puter.ai:', !!puter.ai, '| puter.ai.txt2img:', typeof puter.ai?.txt2img);
            
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined text-[10px] animate-spin">sync</span> Laden...`;
            
            try {
                const prompt = `Professional studio food photography of ${productName} on a clean neutral background, centered, delicious`;
                log('Prompt:', prompt);
                
                // Check if user is signed in to Puter first
                let isSignedIn = false;
                try {
                    isSignedIn = puter.auth.isSignedIn();
                    log('puter.auth.isSignedIn() →', isSignedIn);
                } catch (e) {
                    logErr('isSignedIn check threw:', e);
                }
                
                if (!isSignedIn) {
                    showToast("Login-Popup öffnet sich. Bitte einloggen (kostenloser Puter-Account). Nach Login automatisch weiter.", "success");
                    try {
                        log('Calling puter.auth.signIn()...');
                        // puter.auth.signIn() opens a popup and resolves when login completes.
                        // NOTE: Puter.js internally logs a 401 "Unauthorized" error to console
                        // BEFORE the user completes login — this is NORMAL and NOT an actual error.
                        // The signIn() promise still resolves correctly after login.
                        // We must NOT treat the 401 console log as a failure.
                        await puter.auth.signIn();
                        // Wait a moment for auth state to propagate
                        await new Promise(r => setTimeout(r, 500));
                        isSignedIn = puter.auth.isSignedIn();
                        log('After signIn → isSignedIn:', isSignedIn);
                        if (!isSignedIn) {
                            // Don't throw — just inform user and let them click again
                            btn.disabled = false;
                            btn.innerHTML = originalContent;
                            showToast("Bitte im Popup einloggen, dann erneut auf KI-Bild klicken.", "success");
                            return;
                        }
                    } catch (signInErr) {
                        btn.disabled = false;
                        btn.innerHTML = originalContent;
                        logErr('Sign in error:', signInErr);
                        // Check if it's just the 401 that Puter logs internally
                        if (signInErr?.status === 401) {
                            showToast("Login-Popup ist offen. Bitte einloggen, dann erneut klicken.", "success");
                        } else {
                            showToast("Login abgebrochen. Bitte erneut klicken und im Popup einloggen.", "error");
                        }
                        return;
                    }
                }
                
                showToast("KI-Bild wird generiert... (bis zu 60s)", "success");
                
                // ── Diagnostic: log current monthly AI usage before the call ──
                // This helps diagnose the "new account with 0MB storage still
                // gets upgrade popup" issue. Note: 0MB STORAGE ≠ 0 AI credits.
                // Puter tracks AI usage separately from storage, and the free
                // monthly AI allowance is small. Also, Puter applies IP-based
                // anti-abuse rate limiting that can block even brand-new
                // accounts if the IP has been used heavily.
                try {
                    if (typeof puter.auth?.getMonthlyUsage === 'function') {
                        const usage = await puter.auth.getMonthlyUsage();
                        log('Monthly usage (per Puter account):', usage);
                    }
                } catch (usageErr) {
                    log('getMonthlyUsage() not available or failed:', usageErr);
                }
                
                // ── Generate the image using Puter.js ──────────────────────
                // CORRECTED 2026-11: gpt-image-2 IS officially supported by Puter
                // and is in fact the recommended default model per Puter's own
                // docs (https://docs.puter.com/AI/txt2img) and developer page
                // (https://developer.puter.com/ai/gpt-image — "Start with GPT
                // Image 2 as your default"). The previous comment claiming
                // gpt-image-2 was unsupported was WRONG — it was based on a
                // misreading of the minified puter.js bundle (which only
                // remaps 'nano-banana'/'nano-banana-pro' aliases client-side
                // and otherwise passes the model name straight through to the
                // Puter backend).
                //
                // Model cost per image (Puter developer page, 2026):
                //   gpt-image-1-mini : $0.005   (cheapest, lower quality)
                //   gpt-image-2      : $0.0059  (recommended default)
                //   gpt-image-1.5    : $0.009
                //   gpt-image-1      : $0.011   (MOST EXPENSIVE — what we
                //                                previously used by mistake)
                //
                // Quality tiers: 'low' (default, cheapest) | 'medium' | 'high' | 'auto' (gpt-image-2 only)
                // We use 'medium' instead of 'high' to roughly halve credit
                // burn per image — Puter's free monthly AI allowance is small
                // and 'high' was burning through it ~2x faster than necessary.
                //
                // We wrap the call in a 60-second timeout via Promise.race so
                // the user gets a clear error message instead of an infinite
                // spinner if the Puter backend hangs.
                log('Calling puter.ai.txt2img(prompt, {model: "gpt-image-2", quality: "medium"}) — OpenAI GPT-Image 2, 60s timeout...');
                let imgElement;
                let timeoutId = null;
                try {
                    // gpt-image-2: OpenAI's latest image model (released Apr 2026),
                    // officially recommended by Puter, cheapest non-mini option.
                    // quality: 'medium' balances quality vs. credit usage so the
                    // user's small free monthly AI allowance lasts longer.
                    const txt2imgPromise = puter.ai.txt2img(prompt, {
                        model: 'gpt-image-2',
                        quality: 'medium'
                    });
                    const timeoutPromise = new Promise((_, reject) => {
                        timeoutId = setTimeout(() => {
                            reject(new Error('TIMEOUT: puter.ai.txt2img() hat nach 60 Sekunden nicht geantwortet. Vermutlich Netzwerk- oder Backend-Problem.'));
                        }, 60000);
                    });
                    imgElement = await Promise.race([txt2imgPromise, timeoutPromise]);
                } finally {
                    if (timeoutId) clearTimeout(timeoutId);
                }
                log('txt2img returned. Type:', typeof imgElement,
                    '| constructor:', imgElement?.constructor?.name,
                    '| has src:', !!imgElement?.src,
                    '| src preview:', imgElement?.src ? String(imgElement.src).substring(0, 80) : '(none)');
                
                // ── Normalise the result into a usable image src ───────────
                // Puter.js may return:
                //   • an HTMLImageElement with .src (blob: or https: URL)
                //   • a plain object { src, toString, valueOf } (fallback when
                //     no Image constructor is available)
                //   • a string URL (rare, but the transform supports it)
                let imgSrc = null;
                if (typeof imgElement === 'string' && imgElement.length > 0) {
                    imgSrc = imgElement;
                } else if (imgElement && typeof imgElement === 'object') {
                    imgSrc = imgElement.src || imgElement.url ||
                             (typeof imgElement.toString === 'function'
                              && imgElement.toString() !== '[object Object]'
                              ? imgElement.toString() : null);
                }
                if (!imgSrc) {
                    logErr('txt2img returned no usable src. Full return value:', imgElement);
                    throw new Error('Puter.js lieferte kein Bild-Element (kein src gefunden). Rückgabewert: ' + JSON.stringify(imgElement)?.substring(0, 200));
                }
                log('Resolved image src:', imgSrc.substring(0, 100) + (imgSrc.length > 100 ? '…' : ''));
                
                // ── Convert image src to Blob ──────────────────────────────
                // CRITICAL FIX: https:// URLs to Puter's storage fail with CORS
                // when fetched from our domain. We must use the Image+canvas
                // approach for ALL URL types (https:, blob:, data:).
                let blob;
                try {
                    log('Converting image to blob via Image+canvas...');
                    blob = await new Promise((resolve, reject) => {
                        const img = new Image();
                        // crossOrigin = 'anonymous' allows canvas.toBlob for cross-origin images
                        img.crossOrigin = 'anonymous';
                        img.onload = () => {
                            try {
                                const canvas = document.createElement('canvas');
                                canvas.width = img.naturalWidth || img.width || 1024;
                                canvas.height = img.naturalHeight || img.height || 1024;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0);
                                canvas.toBlob(resolve, 'image/png');
                                log('Canvas conversion OK — size:', canvas.width, 'x', canvas.height);
                            } catch (e) {
                                logErr('Canvas conversion failed:', e);
                                reject(e);
                            }
                        };
                        img.onerror = (e) => {
                            logErr('Image.onload failed for src:', imgSrc.substring(0, 100), e);
                            reject(new Error('Bild konnte nicht geladen werden (CORS oder Netzwerk). src: ' + imgSrc.substring(0, 80)));
                        };
                        img.src = imgSrc;
                    });
                    log('Blob created via canvas:', blob?.size, 'bytes | type:', blob?.type);
                } catch (canvasErr) {
                    logErr('Canvas approach failed, trying direct fetch...', canvasErr);
                    // Fallback: try direct fetch (works for blob: and data: URLs)
                    try {
                        const resp = await fetch(imgSrc);
                        if (!resp.ok) {
                            throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
                        }
                        blob = await resp.blob();
                        log('Direct fetch fallback OK — blob:', blob.size, 'bytes');
                    } catch (fetchErr) {
                        logErr('Both canvas and fetch failed:', fetchErr);
                        throw new Error('Bild konnte nicht geladen werden. Puter hat das Bild generiert (siehe Puter Dashboard), aber der Transfer zu unserem Server ist fehlgeschlagen. Bitte erneut versuchen.');
                    }
                }
                
                if (!blob || blob.size === 0) {
                    logErr('Blob is empty after conversion. blob:', blob);
                    throw new Error('Generiertes Bild ist leer (0 Bytes) — Puter hat wahrscheinlich kein Bild geliefert.');
                }
                
                // ── Upload blob to server (background removal + auto-trim) ──
                log('Uploading blob to /api/products/process-generated-image — size:', blob.size, 'bytes');
                const formData = new FormData();
                formData.append('file', blob, 'ai-generated.jpg');
                
                const uploadResp = await fetch('/api/products/process-generated-image', {
                    method: 'POST',
                    body: formData
                });
                log('Upload response status:', uploadResp.status, uploadResp.statusText);
                
                if (!uploadResp.ok) {
                    const errData = await uploadResp.json().catch(() => ({}));
                    logErr('Upload failed. Status:', uploadResp.status, '| body:', errData);
                    throw new Error(errData.detail || `Serverfehler ${uploadResp.status} bei der Bildverarbeitung`);
                }
                
                const data = await uploadResp.json();
                log('Upload OK. Server response:', data);
                
                btn.disabled = false;
                btn.innerHTML = originalContent;
                if (data.success && data.image_url) {
                    document.getElementById(targetInputId).value = data.image_url;
                    // Live-Vorschau aktualisieren
                    if (typeof updateLivePreview === 'function') {
                        updateLivePreview();
                    }
                    // Vorschau im Bilder-Tab aktualisieren
                    const editPreview = document.getElementById('edit-product-preview-img');
                    const editPreviewContainer = document.getElementById('edit-product-image-preview');
                    if (editPreview) {
                        editPreview.src = data.image_url;
                        if (editPreviewContainer) editPreviewContainer.classList.remove('hidden');
                    }
                    showToast("KI-Bild erfolgreich generiert!", "success");
                    log('SUCCESS — image_url:', data.image_url);
                } else {
                    logErr('Server responded 2xx but no success/image_url:', data);
                    showToast("Fehler beim Generieren des KI-Bildes (Serverantwort ungültig).", "error");
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = originalContent;
                
                // ── Comprehensive error logging ────────────────────────────
                // Log the FULL error object so we can see message, status,
                // code, stack — Puter.js errors often carry extra fields.
                logErr('━━━ KI-Bild FEHLER ━━━');
                logErr('Error object:', err);
                logErr('  message :', err?.message);
                logErr('  status  :', err?.status);
                logErr('  code    :', err?.code);
                logErr('  stack   :', err?.stack);
                logErr('  JSON    :', (() => { try { return JSON.stringify(err); } catch { return '(not serialisable)'; } })());
                logErr('━━━ /KI-Bild FEHLER ━━━');
                
                const actualMsg = (err?.message || String(err) || 'Unbekannter Fehler').toString();
                let userMsg;
                
                // Timeout (our own 60s wrapper)
                if (actualMsg.startsWith('TIMEOUT:')) {
                    userMsg = 'Zeitüberschreitung: Die KI brauchte länger als 60 Sekunden. Bitte erneut versuchen.';
                }
                // Auth-Fehler
                else if (err?.status === 401 || /unauthorized|not.*signed.*in|auth.*required|login.*required/i.test(actualMsg)) {
                    userMsg = 'Puter-Login erforderlich. Bitte klicke erneut auf KI-Bild und schließe das Login-Popup ab (kostenloser Account).';
                }
                // Rate-Limit / Usage-Limit / Insufficient funds (HTTP 402)
                // IMPORTANT: Puter.js itself ALREADY shows an upgrade popup
                // when the server returns HTTP 402, `insufficient_funds`, or
                // `usage_limited` (see puter.js source — it calls
                // puter.ui.requestUpgrade() automatically). So by the time we
                // reach this catch block, the user has usually already seen
                // Puter's own upgrade dialog. Our toast is just a backup.
                //
                // A common cause for new accounts seeing this is IP-based
                // anti-abuse rate limiting (Puter temporarily blocks IPs that
                // open many connections, even across different fresh accounts).
                // So we tell the user to wait AND try a different network.
                else if (err?.status === 402 || err?.status === 429 ||
                         err?.code === 'insufficient_funds' ||
                         err?.code === 'usage_limited' ||
                         /usage|rate.*limit|quota|limit.*reached|insufficient|exceeded|not.*enough.*fund/i.test(actualMsg)) {
                    userMsg = 'Puter-Nutzungslimit erreicht. Das kann am monatlichen Freikontingent liegen ODER an einer temporären IP-Sperre (zu viele Anfragen von dieser IP). Bitte 10–30 Min. warten, anderes WLAN/Netzwerk versuchen oder Puter-Account upgraden.';
                }
                // Network errors (Safari: 'Load failed', Chrome: 'Failed to fetch')
                else if (/Load failed|Failed to fetch|NetworkError|ERR_NETWORK|ERR_CONNECTION|ERR_INTERNET/i.test(actualMsg)) {
                    userMsg = 'Netzwerkfehler. Bitte Popup-Blocker deaktivieren, Internetverbindung prüfen und erneut versuchen.';
                }
                // Invalid model (rare — gpt-image-2 IS valid per Puter docs).
                // If we see this, Puter's backend is likely having a transient
                // routing issue. Tell the user to retry and report the error.
                else if (/model.*not.*found|invalid.*model|unknown.*model|unsupported.*model|no.*such.*model/i.test(actualMsg)) {
                    userMsg = 'KI-Modell-Fehler (selten). Bitte in 1–2 Min. erneut versuchen. Wenn der Fehler bleibt, bitte Console-Log melden — gpt-image-2 ist laut Puter-Doku gültig.';
                }
                // Login aborted (handled separately above, but just in case)
                else if (/Login abgebrochen/i.test(actualMsg)) {
                    userMsg = 'Login abgebrochen. Bitte erneut auf KI-Bild klicken und im Popup einloggen.';
                }
                // Default: show the ACTUAL error so the user can report it
                else {
                    userMsg = actualMsg;
                }
                
                // Always log the mapping so we can correlate user reports with
                // the underlying error in the console.
                logErr('User-facing message:', userMsg, '| Underlying:', actualMsg);
                showToast('Fehler: ' + userMsg, 'error');
            }
        }

        // Copy magic link (relative path → absolute URL) to clipboard
        function copyMagicLink(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const relativePath = el.textContent.trim().replace(/&amp;/g, '&');
            const fullUrl = window.location.origin + relativePath;
            navigator.clipboard.writeText(fullUrl).then(() => {
                const btn = el.parentElement.querySelector('button[onclick]');
                if (btn) {
                    const icon = btn.querySelector('.material-symbols-outlined');
                    if (icon) { icon.textContent = 'check'; setTimeout(() => { icon.textContent = 'content_copy'; }, 2000); }
                }
            }).catch(() => { alert('Link:\n' + fullUrl); });
        }

        function updatePosFields() {
            const select = document.getElementById('pos-system-select');
            const fields = document.getElementById('pos-fields');
            const saveBtn = document.getElementById('pos-save-btn');
            const secretField = document.getElementById('pos-secret-field');
            const locationField = document.getElementById('pos-location-field');
            const urlHint = document.getElementById('pos-url-hint');
            const urlInput = document.getElementById('pos-api-url');
            if (!select) return;

            const system = select.value;
            if (system === 'none') {
                if (fields) fields.style.display = 'none';
                if (saveBtn) saveBtn.style.display = 'none';
                return;
            }
            if (fields) fields.style.display = '';
            if (saveBtn) saveBtn.style.display = '';

            // System-spezifische Hinweise und Default-URLs
            const hints = {
                lightspeed: 'Lightspeed Restaurant API: https://api.lightspeedapp.com/api/v1/ — Webhook-Endpoint eingeben',
                sumup: 'SumUp API: https://api.sumup.com — Webhook-Endpoint eingeben',
                tillhub: 'Tillhub API: https://api.tillhub.com/v1/ — Webhook-Endpoint eingeben',
                custom: 'Beliebige URL die JSON-POST akzeptiert (Webhook-Endpoint deines Kassensystems)'
            };
            if (urlHint) urlHint.textContent = hints[system] || '';

            // Secret + Location nur für Lightspeed/Tillhub
            const needsSecret = ['lightspeed', 'tillhub'].includes(system);
            if (secretField) secretField.classList.toggle('hidden', !needsSecret);
            if (locationField) locationField.classList.toggle('hidden', !needsSecret);
        }

        async function testPosConnection() {
            const btn = document.getElementById('pos-test-btn');
            const result = document.getElementById('pos-test-result');
            if (!btn || !result) return;

            // Erst speichern, dann testen
            const form = document.getElementById('pos-config-form');
            if (form) {
                const formData = new FormData(form);
                btn.disabled = true;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin" style="font-size:14px;">sync</span> Speichere & teste...';
                try {
                    // 1. Save config
                    const saveResp = await fetch('/admin/pos-config', { method: 'POST', body: formData, redirect: 'manual' });
                    // 2. Test connection
                    const testResp = await fetch('/api/pos/test-connection', { method: 'POST', credentials: 'same-origin' });
                    const data = await testResp.json();
                    result.classList.remove('hidden');
                    if (data.success) {
                        result.className = 'p-3 rounded-xl text-xs font-bold bg-emerald-50 dark:bg-emerald-950/30 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-900';
                        result.innerHTML = '✓ ' + (data.message || 'Verbindung erfolgreich!');
                    } else {
                        result.className = 'p-3 rounded-xl text-xs font-bold bg-red-50 dark:bg-red-950/30 text-red-700 dark:text-red-600 border border-red-200 dark:border-red-900';
                        result.innerHTML = '✗ ' + (data.message || 'Verbindung fehlgeschlagen.');
                    }
                } catch (err) {
                    result.classList.remove('hidden');
                    result.className = 'p-3 rounded-xl text-xs font-bold bg-red-50 dark:bg-red-950/30 text-red-700 dark:text-red-600 border border-red-200 dark:border-red-900';
                    result.innerHTML = '✗ Fehler: ' + err.message;
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px;">wifi_find</span> Verbindung testen';
                }
            }
        }

                const data = await res.json();

                // Analytics
                const a = data.analytics || {};
                document.getElementById('loyalty-stat-total').textContent = a.total_customers ?? '—';
                document.getElementById('loyalty-stat-active').textContent = a.active_customers_30d ?? '—';
                document.getElementById('loyalty-stat-rewards').textContent = a.rewards_redeemed ?? '—';
                document.getElementById('loyalty-stat-pushs').textContent = (a.pushs_sent_30d ?? 0) + '✓ / ' + (a.pushs_failed_30d ?? 0) + '✗';

                // Setup-Warning (falls Apple/Google nicht konfiguriert)
                const warning = document.getElementById('loyalty-setup-warning');
                const configStatus = document.getElementById('loyalty-config-status');
                if (warning) {
                    if (!data.apple_configured || !data.google_configured) {
                        warning.classList.remove('hidden');
