<script>

        // Version stamp for cache-busting verification
        window.__DG_VERSION = '2026-07-12-v13';
        console.log('[digi-gastro] JS Version:', window.__DG_VERSION);
        
        const slug = "{{ slug }}";
        const currentUserRole = "{{ current_user.role if current_user else 'kellner' }}";
        function escHtml(s) { const d = document.createElement('div'); d.textContent = String(s || ''); return d.innerHTML; }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.className = `toast ${type === 'success' ? 'toast-success' : 'toast-error'} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        async function editCategoryInline(fullCatName, displayPart) {
            if (!fullCatName) return;
            
            const newName = prompt(`Neuen Namen für "${displayPart}" eingeben:`, displayPart);
            if (newName === null) return; // Cancel
            
            const trimmed = newName.trim();
            if (!trimmed) {
                showToast("Name darf nicht leer sein.", "error");
                return;
            }
            
            try {
                const response = await fetch(`/api/categories/edit`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ old_name: fullCatName, new_name: trimmed })
                });
                
                const data = await response.json();
                if (response.ok) {
                    showToast(`Kategorie erfolgreich aktualisiert! (${data.affected} Produkte angepasst)`, "success");
                    
                    // Update UI without reload
                    // Find all elements with this category name and update them
                    const elements = document.querySelectorAll(`[data-category-name="${fullCatName}"]`);
                    const newFullName = data.new_name;
                    
                    elements.forEach(el => {
                        el.setAttribute('data-category-name', newFullName);
                        const nameEl = el.querySelector('.category-display-name');
                        if (nameEl) nameEl.textContent = trimmed;

                        // Update the edit button's onclick call for future edits.
                        // SECURITY FIX (audit 4.1): Verwende addEventListener statt setAttribute('onclick', ...),
                        // weil newFullName vom Backend html-encodiert kommt (z. B. &#x27; für ')
                        // und der Attribut-Parser das zurück in ' decodiert, was einen JS-String-Kontext bricht
                        // und Stored-XSS ermöglichen würde. Übergeben wird der String als Closure-Variable,
                        // nicht als Code-Interpolation.
                        const editBtn = el.querySelector('button[onclick^="editCategoryInline"]');
                        if (editBtn) {
                            editBtn.removeAttribute('onclick');
                            // Closure-Variablen kopieren, damit spätere Iterationen sie nicht überschreiben
                            const fn = newFullName;
                            const tr = trimmed;
                            editBtn.addEventListener('click', () => editCategoryInline(fn, tr));
                        }
                    });

                    // Also update any other references in the DOM if needed
                    // (e.g. product filter headings, dropdowns, etc.)
                    // Simplest for now: update all [data-category] or [data-category-name]
                    document.querySelectorAll(`[data-category="${fullCatName}"]`).forEach(el => {
                        el.setAttribute('data-category', newFullName);
                    });
                    
                    // Note: For a fully consistent state without reload,
                    // more complex state management would be needed.
                    // But for this MVP dashboard, updating the visible names and data attrs is a great start.
                    
                } else {
                    showToast(data.detail || "Fehler beim Aktualisieren", "error");
                }
            } catch (error) {
                console.error("Error updating category:", error);
                showToast("Verbindungsfehler.", "error");
            }
        }

        // Prevent pinch-zoom (multi-touch) on mobile browsers
        document.addEventListener('touchstart', function (e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        }, { passive: false });

        function toggleSidebar() {
            const aside = document.querySelector('aside');
            const backdrop = document.getElementById('sidebar-backdrop');
            const main = document.querySelector('main');
            if (aside && backdrop) {
                if (window.innerWidth >= 1024) {
                    // Desktop/tablet landscape: use closed class
                    aside.classList.toggle('closed');
                    if (main) main.classList.toggle('sidebar-closed');
                } else {
                    // Mobile: use open class
                    aside.classList.toggle('open');
                    backdrop.classList.toggle('show');
                }
            }
        }

        function closeSidebar() {
            const aside = document.querySelector('aside');
            const backdrop = document.getElementById('sidebar-backdrop');
            const main = document.querySelector('main');
            if (aside && backdrop) {
                aside.classList.remove('open');
                backdrop.classList.remove('show');
                // Also close on desktop
                aside.classList.add('closed');
                if (main) main.classList.add('sidebar-closed');
            }
        }

        // REMOVED: openSidebar() — nirgends aufgerufen (toggleSidebar() wird stattdessen verwendet)

        function switchAdminTab(tabId, updateHash = true) {
            closeSidebar();
            // Validate tabId — only allow known tabs
            const validTabs = ['cms', 'live', 'finanzen', 'produkte', 'kategorien', 'happyhour', 'personal', 'landingpage', 'einstellungen', 'loyalty', 'schichtplan', 'lager'];
            if (!validTabs.includes(tabId)) tabId = 'live';

            // Rollen-basierte Zugriffskontrolle:
            // Kellner dürfen 'live' (Sitzplan), 'finanzen' (Bons & Drucken) und 'produkte' sehen
            const currentUserRole = "{{ current_user.role if current_user else 'kellner' }}";
            if (currentUserRole !== 'chef' && !['live', 'finanzen', 'produkte'].includes(tabId)) {
                tabId = 'live'; // Kellner wird immer auf Sitzplan umgeleitet
            }

            document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('aside nav button.nav-btn, aside nav button.nav-sub-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Phase 14 P1-Fix: Null-Check vor classList-Access.
            // Vorher: Wenn Tab-ID ungültig oder DOM noch nicht geladen, TypeError → ganze Funktion bricht ab.
            const tabContent = document.getElementById('admin-tab-' + tabId);
            const tabBtn = document.getElementById('tab-btn-' + tabId);
            if (!tabContent) {
                console.error('switchAdminTab: Tab-Inhalt nicht gefunden:', tabId);
                return;
            }
            tabContent.classList.add('active');
            if (tabBtn) tabBtn.classList.add('active');
            
            // Dynamically update Topbar Breadcrumbs
            const tabNames = {
                'cms': 'Inhalte',
                'live': 'Sitzplan',
                'finanzen': 'Bestellungen & Reports',
                'produkte': 'Produkte',
                'kategorien': 'Kategorien',
                'happyhour': 'Events',
                'personal': 'Personal & Account',
                'landingpage': 'Landingpage',
                'einstellungen': 'Einstellungen',
                'loyalty': 'Loyalty & Newsletter',
                'schichtplan': 'Schichtplan',
                'lager': 'Lagerverwaltung'
            };
            const breadcrumb = document.getElementById('breadcrumb-current');
            if (breadcrumb) {
                breadcrumb.textContent = tabNames[tabId] || tabId;
            }
            
            localStorage.setItem('dl_admin_active_tab', tabId);
            if (updateHash) {
                history.replaceState(null, '', '#' + tabId);
            }

            if (tabId === 'cms') {
                updateCmsOverviewStats();
            }
            if (tabId === 'live') {
                renderSitzplanTiles();
                renderServiceCallsAlerts();
            }
            if (tabId === 'finanzen') {
                renderOrdersTable();
            }
            if (tabId === 'produkte') {
                initProductSortable();
                updateProductFilterCounts();
            }
            if (tabId === 'kategorien') {
                loadSuperGroups();
                renderCategoryTree();
            }
            if (tabId === 'landingpage') {
                initLandingpagePreview();
            }
            if (tabId === 'loyalty') {
                loadLoyaltyDashboard();
            }
            if (tabId === 'schichtplan') {
                loadSchichtplan();
            }
            if (tabId === 'lager') {
                loadLagerDashboard();
            }

            // Live-Badge nur auf operativen Tabs anzeigen
            const liveBadge = document.getElementById('dash-live-badge');
            if (liveBadge) {
                if (tabId === 'live' || tabId === 'finanzen') {
                    liveBadge.style.display = '';
                } else {
                    liveBadge.style.display = 'none';
                }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const hashTab = window.location.hash.replace('#', '');
            const activeTab = hashTab || localStorage.getItem('dl_admin_active_tab') || 'live';
            switchAdminTab(activeTab, false);
            // Tisch-Filter + Sort-Icons initialisieren
            populateTableFilter();
            updateSortIcons();
            // Hauptgruppen immer laden — wird für Kasse-Popup & Bon-Detail-Modal gebraucht
            loadSuperGroups();
            
            // ── Custom File-Upload: Dateiname anzeigen, wenn eine Datei ausgewählt wird ──
            // Globales Event-Delegation — funktioniert für alle file-inputs in .file-upload-wrap
            document.body.addEventListener('change', (e) => {
                if (e.target.matches('input[type="file"]')) {
                    const wrap = e.target.closest('.file-upload-wrap');
                    if (!wrap) return;
                    const nameEl = wrap.querySelector('.file-upload-name');
                    if (!nameEl) return;
                    if (e.target.files && e.target.files.length > 0) {
                        const file = e.target.files[0];
                        // Dateiname kürzen, wenn zu lang
                        const maxLen = 28;
                        let displayName = file.name;
                        if (displayName.length > maxLen) {
                            displayName = displayName.slice(0, maxLen - 3) + '...';
                        }
                        nameEl.textContent = displayName;
                        nameEl.style.color = '#16a34a';
                    } else {
                        nameEl.textContent = nameEl.dataset.default || 'Keine Datei gewählt';
                        nameEl.style.color = '';
                    }
                }
            });
        });

        // Handle browser back/forward
        window.addEventListener('hashchange', () => {
            const hashTab = window.location.hash.replace('#', '');
            if (hashTab) switchAdminTab(hashTab, false);
        });

        // ═══════════════════════════════════════════════════════
        // CMS OVERVIEW STATS (live berechnet aus allProducts/allCategories/allEvents)
        // ═══════════════════════════════════════════════════════
        function updateCmsOverviewStats() {
            try {
                // Produkte
                const totalProducts = (allProducts || []).length;
                const outOfStock = (allProducts || []).filter(p => !p.is_available).length;
                const withHH = (allProducts || []).filter(p => p.happy_hour_price).length;
                document.getElementById('cms-stat-products').textContent = totalProducts;
                const pSub = document.getElementById('cms-substat-products');
                if (outOfStock > 0) {
                    pSub.innerHTML = '<span class="alert">' + outOfStock + ' ausverkauft</span> · ' + withHH + ' mit Aktion';
                } else {
                    pSub.innerHTML = '<span class="ok">Alle aktiv</span> · ' + withHH + ' mit Aktion';
                }

                // Kategorien
                const totalCats = (allCategories || []).length;
                document.getElementById('cms-stat-categories').textContent = totalCats;
                const cSub = document.getElementById('cms-substat-categories');
                const superGroupsCount = (window._superGroups || []).length;
                if (superGroupsCount > 0) {
                    cSub.textContent = 'In ' + superGroupsCount + ' Hauptgruppen';
                } else {
                    cSub.textContent = 'Keine Hauptgruppen zugewiesen';
                }

                // Events
                const events = (allEvents || []);
                const activeEvents = events.filter(e => e.is_active !== false);
                document.getElementById('cms-stat-events').textContent = events.length;
                const eSub = document.getElementById('cms-substat-events');
                if (activeEvents.length > 0) {
                    eSub.innerHTML = '<span class="ok">' + activeEvents.length + ' aktiv</span>';
                } else if (events.length > 0) {
                    eSub.textContent = events.length + ' (alle pausiert)';
                } else {
                    eSub.textContent = 'Noch keine Events';
                }

                // Landingpage Sektionen
                const lp = {{ (restaurant.landing_page or {}) | tojson | safe }};
                let sectionCount = 0;
                if (lp.welcome_title || lp.welcome_subtitle) sectionCount++;
                if (lp.title_about || lp.what_we_offer) sectionCount++;
                if (lp.title_hours || lp.oeffnungszeiten) sectionCount++;
                if (lp.custom_sections && lp.custom_sections.length) sectionCount += lp.custom_sections.length;
                if (lp.title_what_we_offer || (lp.offer_images && lp.offer_images.length)) sectionCount++;
                if (lp.slideshow_enabled || (lp.slideshow_images && lp.slideshow_images.length)) sectionCount++;
                if (lp.title_gallery || (lp.gallery_images && lp.gallery_images.length)) sectionCount++;
                if (lp.title_videos || (lp.gallery_videos && lp.gallery_videos.length)) sectionCount++;
                document.getElementById('cms-stat-landingpage').textContent = sectionCount;
                const lSub = document.getElementById('cms-substat-landingpage');
                if (lp.welcome_title) {
                    lSub.textContent = 'Haupttitel: "' + lp.welcome_title.substring(0, 30) + (lp.welcome_title.length > 30 ? '…' : '') + '"';
                } else {
                    lSub.textContent = 'Noch kein Willkommenstext';
                }
            } catch (err) {
                console.warn('CMS stats error:', err);
            }
        }

        // (LOW-3 Cleanup) switchConfigTab() entfernt — war toter Code (keine .config-tab-content/.config-subtab-btn im HTML)

        // ── SITZPLAN / WAITER POS GLOBAL STATE ──
        let allOrders  = {{ orders_json | safe }} || [];
        let allTables  = {{ tables_json | safe }} || [];
        let allProducts = {{ restaurant.products | tojson | safe }} || [];
        let allCategories = {{ restaurant.categories | tojson | safe }} || [];
        let allEvents = {{ events_json | safe }} || [];
        window._productsData = allProducts;
        window._eventsData = allEvents;
        let allCalls   = [];
        let isEditMode = false;

        // Helper: get category name for an order item by matching product_id
        function getProductCategory(item) {
            const pid = item.product_id || item.id;
            const prod = allProducts.find(p => p.id === pid);
            return prod ? prod.category : 'Sonstiges';
        }
        let tempTables = [];
        
        // ── ORDERS TABLE: FILTER + PAGINATION + SORT STATE ──
        let _ordersDateFilter = 'today';    // today | 7d | 30d | all | custom
        let _ordersStatusFilter = 'all';    // all | aktiv | bezahlt | storniert
        let _ordersPage = 1;
        const _ordersPerPage = 25;
        let _ordersSortField = 'timestamp'; // id | table | timestamp | total
        let _ordersSortDir = 'desc';        // asc | desc
        let _ordersCustomFrom = null;       // YYYY-MM-DD or null
        let _ordersCustomTo = null;         // YYYY-MM-DD or null
        // Preis-Modus (netto/brutto) — bestimmt MwSt-Spalten-Sichtbarkeit
        // ── Bug-Fix: Defensive Normalisierung — falls Backend leer/None/Großbuchstaben
        // liefert, normalisieren wir auf lowercase 'brutto'/'netto'. Verhindert
        // dass MwSt im Netto-Modus angezeigt wird weil PRICE_MODE === 'Netto' (mit N).
        const _RAW_PRICE_MODE = {{ (restaurant.price_mode or 'brutto') | tojson }};
        const PRICE_MODE = (_RAW_PRICE_MODE || '').toString().trim().toLowerCase() === 'netto'
            ? 'netto'
            : 'brutto';

        // ═══════════════════════════════════════════════════════════════
        // NEUE REPORTS-FUNKTIONEN (Redesign)
        // ═══════════════════════════════════════════════════════════════

        // Setzt das heutige Datum in das kpi-day-date Element
        function updateDayDateLabel() {
            const el = document.getElementById('kpi-day-date');
            if (!el) return;
            const now = new Date();
            const days = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
            const day = days[now.getDay()];
            const dateStr = now.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
            el.textContent = `${day}, ${dateStr}`;
        }

        // Quick-Range Buttons für Zeitraum-Report
        function setQuickRange(range) {
            const fromEl = document.getElementById('report-date-from');
            const toEl = document.getElementById('report-date-to');
            if (!fromEl || !toEl) return;

            const now = new Date();
            const fmt = (d) => d.toISOString().split('T')[0];

            if (range === 'today') {
                fromEl.value = fmt(now);
                toEl.value = fmt(now);
            } else if (range === 'thisMonth') {
                const first = new Date(now.getFullYear(), now.getMonth(), 1);
                fromEl.value = fmt(first);
                toEl.value = fmt(now);
            } else if (range === 'lastMonth') {
                const first = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                const last = new Date(now.getFullYear(), now.getMonth(), 0);
                fromEl.value = fmt(first);
                toEl.value = fmt(last);
            } else if (range === 'last7d') {
                const from = new Date(now);
                from.setDate(from.getDate() - 6);
                fromEl.value = fmt(from);
                toEl.value = fmt(now);
            } else if (range === 'last30d') {
                const from = new Date(now);
                from.setDate(from.getDate() - 29);
                fromEl.value = fmt(from);
                toEl.value = fmt(now);
            } else if (range === 'thisYear') {
                const first = new Date(now.getFullYear(), 0, 1);
                fromEl.value = fmt(first);
                toEl.value = fmt(now);
            }
        }

        // Generiert den Zeitraum-PDF-Report
        function generateZeitraumReport() {
            const fromEl = document.getElementById('report-date-from');
            const toEl = document.getElementById('report-date-to');
            const btn = document.getElementById('btn-generate-report');

            if (!fromEl || !toEl) {
                showToast('Datumsfelder nicht gefunden.', 'error');
                return;
            }
            if (!fromEl.value || !toEl.value) {
                showToast('Bitte sowohl Von- als auch Bis-Datum auswählen.', 'error');
                return;
            }

            // Loading state
            const originalHtml = btn ? btn.innerHTML : '';
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<span class="material-symbols-outlined animate-spin" style="font-size:16px;">progress_activity</span> Generiere...`;
            }

            const url = `/admin/monatsreport/pdf?frm=${encodeURIComponent(fromEl.value)}&to=${encodeURIComponent(toEl.value)}`;

            fetch(url, { method: 'GET', credentials: 'same-origin' })
                .then(resp => {
                    if (!resp.ok) {
                        return resp.json().then(err => {
                            throw new Error(err.detail || 'Export fehlgeschlagen: ' + resp.status);
                        });
                    }
                    const cd = resp.headers.get('content-disposition') || '';
                    let filename = 'umsatzreport.pdf';
                    const match = cd.match(/filename="?([^";]+)"?/);
                    if (match) filename = match[1];
                    return resp.blob().then(blob => ({ blob, filename }));
                })
                .then(({ blob, filename }) => {
                    const objUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = objUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(objUrl), 1000);
                })
                .catch(err => {
                    console.error('Zeitraum-Report error:', err);
                    showToast('Report-Erstellung fehlgeschlagen: ' + err.message, 'error');
                })
                .finally(() => {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = originalHtml;
                    }
                });
        }

        // Export-Dropdown toggle
        function toggleExportMenu() {
            const menu = document.getElementById('export-menu');
            if (!menu) return;
            menu.classList.toggle('hidden');
            // Schließen bei Klick außerhalb
            if (!menu.classList.contains('hidden')) {
                setTimeout(() => {
                    const closeHandler = (e) => {
                        if (!menu.contains(e.target) && !e.target.closest('button[onclick="toggleExportMenu()"]')) {
                            menu.classList.add('hidden');
                            document.removeEventListener('click', closeHandler);
                        }
                    };
                    document.addEventListener('click', closeHandler);
                }, 10);
            }
        }

        // Init Reports: Default-Datum setzen
        function initReportsDefaults() {
            // Default: Dieser Monat
            setQuickRange('thisMonth');
            updateDayDateLabel();
            // MwSt-Tabellen-Header nur im Brutto-Modus anzeigen
            // (Netto-Modus: Spalte wird via PRICE_MODE-Check im Body auch ausgeblendet)
            const thMwst = document.getElementById('th-mwst');
            if (thMwst) {
                thMwst.style.display = (PRICE_MODE === 'netto') ? 'none' : '';
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // ENDE NEUE REPORTS-FUNKTIONEN
        // ═══════════════════════════════════════════════════════════════

        function setOrdersDateFilter(filter) {
            _ordersDateFilter = filter;
            _ordersPage = 1;
            // Update active button
            document.querySelectorAll('.orders-filter-btn[data-filter]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            // Wenn ein Preset gewählt wird, benutzerdefinierten Zeitraum zurücksetzen
            if (filter !== 'custom') {
                _ordersCustomFrom = null;
                _ordersCustomTo = null;
                const fromEl = document.getElementById('orders-date-from');
                const toEl = document.getElementById('orders-date-to');
                if (fromEl) fromEl.value = '';
                if (toEl) toEl.value = '';
            }
            renderOrdersTable();
        }

        function onCustomDateChanged() {
            // Automatisch aktivieren sobald beide Daten gesetzt sind
            const fromEl = document.getElementById('orders-date-from');
            const toEl = document.getElementById('orders-date-to');
            if (fromEl && toEl && fromEl.value && toEl.value) {
                applyCustomDateRange();
            }
        }

        function applyCustomDateRange() {
            const fromEl = document.getElementById('orders-date-from');
            const toEl = document.getElementById('orders-date-to');
            if (!fromEl || !toEl) return;
            if (!fromEl.value || !toEl.value) {
                showToast('Bitte Start- und Enddatum wählen.', 'error');
                return;
            }
            // Sicherstellen, dass from <= to
            if (fromEl.value > toEl.value) {
                const tmp = fromEl.value;
                fromEl.value = toEl.value;
                toEl.value = tmp;
            }
            _ordersCustomFrom = fromEl.value;
            _ordersCustomTo = toEl.value;
            _ordersDateFilter = 'custom';
            _ordersPage = 1;
            // Preset-Buttons deaktivieren
            document.querySelectorAll('.orders-filter-btn[data-filter]').forEach(btn => {
                btn.classList.remove('active');
            });
            renderOrdersTable();
        }

        function clearCustomDateRange() {
            _ordersCustomFrom = null;
            _ordersCustomTo = null;
            const fromEl = document.getElementById('orders-date-from');
            const toEl = document.getElementById('orders-date-to');
            if (fromEl) fromEl.value = '';
            if (toEl) toEl.value = '';
            // Auf "Heute" zurücksetzen als Default
            setOrdersDateFilter('today');
        }

        function setOrdersSort(field) {
            if (_ordersSortField === field) {
                _ordersSortDir = (_ordersSortDir === 'asc') ? 'desc' : 'asc';
            } else {
                _ordersSortField = field;
                _ordersSortDir = (field === 'timestamp' || field === 'id') ? 'desc' : 'asc';
            }
            updateSortIcons();
            renderOrdersTable();
        }

        function updateSortIcons() {
            const fields = ['id', 'table', 'timestamp', 'total'];
            fields.forEach(f => {
                const el = document.getElementById('sort-icon-' + f);
                if (!el) return;
                if (f === _ordersSortField) {
                    el.textContent = _ordersSortDir === 'asc' ? '▲' : '▼';
                    el.classList.add('active');
                } else {
                    el.textContent = '';
                    el.classList.remove('active');
                }
            });
        }

        function populateTableFilter() {
            const select = document.getElementById('orders-table-filter');
            if (!select || !allOrders) return;
            // Eindeutige Tische sammeln
            const tables = new Set();
            allOrders.forEach(o => {
                if (o.table) tables.add(String(o.table));
            });
            // Tisch-Nummer für Sortierung extrahieren
            const tableList = Array.from(tables).sort((a, b) => {
                const numA = parseInt(a.match(/\d+/)?.[0] || '0', 10);
                const numB = parseInt(b.match(/\d+/)?.[0] || '0', 10);
                return numA - numB;
            });
            // Aktuelle Auswahl merken
            const currentVal = select.value;
            select.innerHTML = '<option value="all">Alle Tische</option>';
            tableList.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                select.appendChild(opt);
            });
            // Auswahl wiederherstellen falls noch gültig
            if (currentVal && (currentVal === 'all' || tableList.includes(currentVal))) {
                select.value = currentVal;
            }
        }

        function setOrdersStatusFilter(filter) {
            _ordersStatusFilter = filter;
            _ordersPage = 1;
            // Update active button
            document.querySelectorAll('.orders-filter-btn[data-status]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.status === filter);
            });
            renderOrdersTable();
        }

        function getFilteredOrders() {
            if (!allOrders || !allOrders.length) return [];
            
            const now = new Date();
            const searchEl = document.getElementById('orders-search');
            const searchVal = searchEl ? searchEl.value.trim().toLowerCase() : '';
            const tableFilterEl = document.getElementById('orders-table-filter');
            const tableFilterVal = tableFilterEl ? tableFilterEl.value : 'all';
            
            return allOrders.filter(o => {
                // 1. Date filter
                if (_ordersDateFilter !== 'all') {
                    if (o.timestamp) {
                        try {
                            const ts = o.timestamp.replace(' ', 'T');
                            const orderDate = new Date(ts);
                            if (!isNaN(orderDate.getTime())) {
                                if (_ordersDateFilter === 'today') {
                                    if (orderDate.getFullYear() !== now.getFullYear() ||
                                        orderDate.getMonth() !== now.getMonth() ||
                                        orderDate.getDate() !== now.getDate()) {
                                        return false;
                                    }
                                } else if (_ordersDateFilter === '7d') {
                                    const diffDays = (now - orderDate) / (1000 * 60 * 60 * 24);
                                    if (diffDays > 7) return false;
                                } else if (_ordersDateFilter === '30d') {
                                    const diffDays = (now - orderDate) / (1000 * 60 * 60 * 24);
                                    if (diffDays > 30) return false;
                                } else if (_ordersDateFilter === 'custom') {
                                    // Benutzerdefinierter Zeitraum (von-bis inkl. Enddatum)
                                    if (_ordersCustomFrom) {
                                        const fromDate = new Date(_ordersCustomFrom + 'T00:00:00');
                                        if (orderDate < fromDate) return false;
                                    }
                                    if (_ordersCustomTo) {
                                        const toDate = new Date(_ordersCustomTo + 'T23:59:59');
                                        if (orderDate > toDate) return false;
                                    }
                                }
                            }
                        } catch (e) {
                            // Wenn timestamp nicht parsebar: in Preset-Filtern anzeigen, in custom ausblenden
                            if (_ordersDateFilter === 'custom') return false;
                        }
                    } else if (_ordersDateFilter === 'custom') {
                        // Kein Timestamp + custom Filter → ausblenden
                        return false;
                    }
                }
                
                // 2. Status filter
                if (_ordersStatusFilter !== 'all') {
                    const oStatus = (o.status || '').toLowerCase();
                    if (_ordersStatusFilter === 'aktiv') {
                        if (oStatus === 'bezahlt' || oStatus === 'storniert') return false;
                    } else if (_ordersStatusFilter === 'bezahlt') {
                        if (oStatus !== 'bezahlt') return false;
                    } else if (_ordersStatusFilter === 'storniert') {
                        if (oStatus !== 'storniert') return false;
                    }
                }
                
                // 3. Tisch filter
                if (tableFilterVal && tableFilterVal !== 'all') {
                    if (String(o.table || '') !== tableFilterVal) return false;
                }
                
                // 4. Search filter
                if (searchVal) {
                    const bonId = String(o.id).toLowerCase();
                    const tableStr = String(o.table || '').toLowerCase();
                    const nameMatch = bonId.includes(searchVal) || tableStr.includes(searchVal);
                    if (!nameMatch) return false;
                }
                
                return true;
            }).sort((a, b) => {
                // Sortierung — Default: timestamp desc (neueste zuerst)
                const field = _ordersSortField || 'timestamp';
                const dir = _ordersSortDir === 'asc' ? 1 : -1;
                
                let valA, valB;
                if (field === 'id') {
                    valA = a.id || 0;
                    valB = b.id || 0;
                } else if (field === 'table') {
                    valA = String(a.table || '');
                    valB = String(b.table || '');
                    // Numerische Tisch-Sortierung
                    const numA = parseInt(valA.match(/\d+/)?.[0] || '0', 10);
                    const numB = parseInt(valB.match(/\d+/)?.[0] || '0', 10);
                    return (numA - numB) * dir;
                } else if (field === 'timestamp') {
                    valA = a.timestamp ? a.timestamp.replace(' ', 'T') : '';
                    valB = b.timestamp ? b.timestamp.replace(' ', 'T') : '';
                    return valB.localeCompare(valA) * dir;
                } else if (field === 'total') {
                    // original_total berücksichtigen — nie 0€ für sort
                    const getSortVal = (o) => {
                        const t = typeof o.total === 'number' ? o.total : 0;
                        const ot = typeof o.original_total === 'number' ? o.original_total : 0;
                        return Math.max(t, ot);
                    };
                    valA = getSortVal(a);
                    valB = getSortVal(b);
                    return (valA - valB) * dir;
                }
                return 0;
            });
        }

        function renderOrdersTable() {
            const tbody = document.getElementById('orders-tbody');
            const mobileCards = document.getElementById('orders-cards-mobile');
            const emptyState = document.getElementById('orders-empty-state');
            const paginationEl = document.getElementById('orders-pagination');
            const countBadge = document.getElementById('orders-count-badge');
            
            if (!tbody) return;
            
            const filtered = getFilteredOrders();
            const totalItems = filtered.length;
            const totalPages = Math.max(1, Math.ceil(totalItems / _ordersPerPage));
            
            // Clamp current page
            if (_ordersPage > totalPages) _ordersPage = totalPages;
            if (_ordersPage < 1) _ordersPage = 1;
            
            // Update count badge
            if (countBadge) {
                countBadge.textContent = totalItems;
            }
            
            // Paginate
            const startIdx = (_ordersPage - 1) * _ordersPerPage;
            const endIdx = Math.min(startIdx + _ordersPerPage, totalItems);
            const pageItems = filtered.slice(startIdx, endIdx);
            
            // Render table rows
            if (pageItems.length === 0) {
                tbody.innerHTML = '';
                if (mobileCards) mobileCards.innerHTML = '';
                if (emptyState) emptyState.classList.remove('hidden');
            } else {
                if (emptyState) emptyState.classList.add('hidden');
                
                tbody.innerHTML = pageItems.map(o => {
                    const oStatus = (o.status || '').toLowerCase();
                    let statusHtml = '';
                    if (oStatus === 'bezahlt') {
                        statusHtml = '<span class="bg-emerald-500/10 text-emerald-700 font-extrabold px-2.5 py-1 rounded-md text-[10px] uppercase tracking-wide">Bezahlt</span>';
                    } else if (oStatus === 'storniert') {
                        statusHtml = '<span class="bg-rose-500/10 text-rose-600 font-extrabold px-2.5 py-1 rounded-md text-[10px] uppercase tracking-wide">Storniert</span>';
                    } else {
                        statusHtml = '<span class="bg-amber-500/10 text-amber-700 font-extrabold px-2.5 py-1 rounded-md text-[10px] uppercase tracking-wide animate-pulse">Aktiv</span>';
                    }
                    
                    const total = typeof o.total === 'number' ? o.total.toFixed(2).replace('.', ',') : '0,00';
                    // ── Fix 6e: original_total anzeigen, wenn total durch Teilzahlung/Storno/Transfer reduziert wurde ──
                    // Nie wieder 0€ im Report — der Chef sieht immer den ursprünglich bestellten Warenwert.
                    const originalTotal = typeof o.original_total === 'number' ? o.original_total : null;
                    let totalHtml;
                    if (originalTotal !== null && originalTotal > 0 && o.total === 0) {
                        // Bestellung wurde per Einzelartikel-Zahlung/Storno/Transfer komplett abgearbeitet
                        // → zeige original_total als durchgestrichenen + finalen Wert
                        totalHtml = `<span class="text-zinc-900 font-mono">${originalTotal.toFixed(2).replace('.', ',')} €</span>`;
                    } else if (originalTotal !== null && originalTotal > o.total && o.total > 0) {
                        // Teilzahlung: zeige Restbetrag + (ursprünglich)
                        totalHtml = `<span class="text-zinc-900 font-mono">${total} €</span>` +
                                    `<div class="text-[9px] text-zinc-500 font-mono">orig: ${originalTotal.toFixed(2).replace('.', ',')} €</div>`;
                    } else {
                        totalHtml = `<span class="text-zinc-900 font-mono">${total} €</span>`;
                    }
                    const mwst = o.mwst_rate || 19;
                    const displayTable = String(o.table || '');
                    const timestamp = o.timestamp || '';
                    const mwstCell = (PRICE_MODE === 'netto') ? '' : `<td class="text-zinc-500">${mwst}%</td>`;
                    
                    return `<tr onclick="openBonDetail(${o.id})" class="bon-row">
                        <td class="font-bold text-zinc-800">Bon #${o.daily_bon_number || o.id}</td>
                        <td class="font-extrabold">${displayTable}</td>
                        <td class="text-zinc-500 font-mono">${timestamp}</td>
                        <td class="font-extrabold text-zinc-900 font-mono">${totalHtml}</td>
                        ${mwstCell}
                        <td>${statusHtml}</td>
                        <td><span class="material-symbols-outlined bon-detail-chevron">chevron_right</span></td>
                    </tr>`;
                }).join('');
                
                // ── Mobile Card-View rendern (parallel zur Tabelle, gleiche Daten) ──
                // Verhindert horizontalen Scroll auf iPhone — jede Bestellung = eine Karte.
                if (mobileCards) {
                    mobileCards.innerHTML = pageItems.map(o => {
                        const oStatus = (o.status || '').toLowerCase();
                        let statusHtml = '';
                        if (oStatus === 'bezahlt') {
                            statusHtml = '<span class="bg-emerald-500/10 text-emerald-700 font-extrabold px-2.5 py-1 rounded-md text-[10px] uppercase tracking-wide">Bezahlt</span>';
                        } else if (oStatus === 'storniert') {
                            statusHtml = '<span class="bg-rose-500/10 text-rose-600 font-extrabold px-2.5 py-1 rounded-md text-[10px] uppercase tracking-wide">Storniert</span>';
                        } else {
                            statusHtml = '<span class="bg-amber-500/10 text-amber-700 font-extrabold px-2.5 py-1 rounded-md text-[10px] uppercase tracking-wide animate-pulse">Aktiv</span>';
                        }
                        const total = typeof o.total === 'number' ? o.total.toFixed(2).replace('.', ',') : '0,00';
                        const originalTotal = typeof o.original_total === 'number' ? o.original_total : null;
                        let totalMobile = `${total} €`;
                        if (originalTotal !== null && originalTotal > o.total) {
                            totalMobile = `${total} € <span class="text-[9px] text-zinc-400 line-through">${originalTotal.toFixed(2).replace('.', ',')} €</span>`;
                        }
                        const mwst = o.mwst_rate || 19;
                        const mwstRow = (PRICE_MODE === 'netto') ? '' : `
                            <div class="dash-card-row">
                                <span class="dash-card-label">MwSt</span>
                                <span class="dash-card-value">${mwst}%</span>
                            </div>`;
                        return `<div class="dash-card" onclick="openBonDetail(${o.id})">
                            <div class="dash-card-row">
                                <span class="dash-card-label">Bon</span>
                                <span class="dash-card-value">#${o.id}</span>
                            </div>
                            <div class="dash-card-row">
                                <span class="dash-card-label">Tisch</span>
                                <span class="dash-card-value">${String(o.table || '')}</span>
                            </div>
                            <div class="dash-card-row">
                                <span class="dash-card-label">Zeit</span>
                                <span class="dash-card-value" style="font-size:0.75rem;">${o.timestamp || ''}</span>
                            </div>
                            <div class="dash-card-row">
                                <span class="dash-card-label">Gesamt</span>
                                <span class="dash-card-value">${totalMobile}</span>
                            </div>
                            ${mwstRow}
                            <div class="dash-card-row">
                                <span class="dash-card-label">Status</span>
                                <span>${statusHtml}</span>
                            </div>
                            <div class="dash-card-actions">
                                <button onclick="event.stopPropagation(); openBonDetail(${o.id})" class="bg-zinc-100 text-zinc-800">
                                    <span class="material-symbols-outlined" style="font-size:16px;">receipt_long</span> Details
                                </button>
                            </div>
                        </div>`;
                    }).join('');
                }
            }
            
            // Render pagination
            if (paginationEl) {
                if (totalItems <= _ordersPerPage) {
                    // Auch ohne Paginierung: klare Anzeige der Gesamtanzahl
                    let infoText = '';
                    if (totalItems === 0) {
                        infoText = 'Keine Bestellungen';
                    } else if (totalItems === 1) {
                        infoText = '1 Bestellung gesamt';
                    } else {
                        infoText = `${totalItems} Bestellungen gesamt`;
                    }
                    // Aktiver Filter anzeigen, damit der Chef sieht was gefiltert ist
                    const filterDesc = buildFilterDescription();
                    if (filterDesc) {
                        infoText += ` · ${filterDesc}`;
                    }
                    paginationEl.innerHTML = `<span class="orders-pagination-info">${infoText}</span>`;
                } else {
                    let pageBtnsHtml = '';
                    
                    // Previous button
                    pageBtnsHtml += `<button class="orders-page-btn nav-arrow" onclick="goOrdersPage(${_ordersPage - 1})" ${_ordersPage <= 1 ? 'disabled' : ''}>&#8249;</button>`;
                    
                    // Smart page range: show first, last, current ± 1, with ellipsis
                    const pages = [];
                    if (totalPages <= 7) {
                        for (let i = 1; i <= totalPages; i++) pages.push(i);
                    } else {
                        pages.push(1);
                        if (_ordersPage > 3) pages.push('...');
                        for (let i = Math.max(2, _ordersPage - 1); i <= Math.min(totalPages - 1, _ordersPage + 1); i++) {
                            pages.push(i);
                        }
                        if (_ordersPage < totalPages - 2) pages.push('...');
                        pages.push(totalPages);
                    }
                    
                    pages.forEach(p => {
                        if (p === '...') {
                            pageBtnsHtml += `<span class="orders-page-btn" style="cursor:default;border:none;opacity:0.5;">…</span>`;
                        } else {
                            pageBtnsHtml += `<button class="orders-page-btn ${p === _ordersPage ? 'active' : ''}" onclick="goOrdersPage(${p})">${p}</button>`;
                        }
                    });
                    
                    // Next button
                    pageBtnsHtml += `<button class="orders-page-btn nav-arrow" onclick="goOrdersPage(${_ordersPage + 1})" ${_ordersPage >= totalPages ? 'disabled' : ''}>&#8250;</button>`;
                    
                    const startNum = startIdx + 1;
                    const endNum = endIdx;
                    const filterDesc = buildFilterDescription();
                    const filterSuffix = filterDesc ? ` · ${filterDesc}` : '';
                    paginationEl.innerHTML = `
                        <span class="orders-pagination-info">Seite ${_ordersPage} von ${totalPages} — ${startNum}–${endNum} von ${totalItems} Bestellungen${filterSuffix}</span>
                        <div class="orders-pagination-btns">${pageBtnsHtml}</div>
                    `;
                }
            }
        }

        function buildFilterDescription() {
            const parts = [];
            // Zeitraum
            if (_ordersDateFilter === 'today') parts.push('Heute');
            else if (_ordersDateFilter === '7d') parts.push('7 Tage');
            else if (_ordersDateFilter === '30d') parts.push('30 Tage');
            else if (_ordersDateFilter === 'all') parts.push('Alle Zeiträume');
            else if (_ordersDateFilter === 'custom' && _ordersCustomFrom && _ordersCustomTo) {
                // Format DD.MM.YYYY
                const fmt = (s) => {
                    const [y, m, d] = s.split('-');
                    return `${d}.${m}.${y}`;
                };
                parts.push(`${fmt(_ordersCustomFrom)} – ${fmt(_ordersCustomTo)}`);
            }
            // Status
            if (_ordersStatusFilter !== 'all') {
                const map = { aktiv: 'Aktiv', bezahlt: 'Bezahlt', storniert: 'Storniert' };
                if (map[_ordersStatusFilter]) parts.push(map[_ordersStatusFilter]);
            }
            // Tisch
            const tfEl = document.getElementById('orders-table-filter');
            if (tfEl && tfEl.value && tfEl.value !== 'all') {
                parts.push(tfEl.value);
            }
            return parts.join(' · ');
        }

        function goOrdersPage(page) {
            _ordersPage = page;
            renderOrdersTable();
            // Scroll to top of orders table smoothly
            const tableEl = document.getElementById('orders-tbody');
            if (tableEl) {
                tableEl.closest('.section-card')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // ── EXPORT: PDF + Excel — respektiert aktuellen Filter ──
        // Der Chef bekommt genau das exportiert, was er gerade auf dem Bildschirm sieht.
        function exportOrders(format) {
            const params = new URLSearchParams();
            // Zeitraum
            params.append('range', _ordersDateFilter || 'today');
            if (_ordersDateFilter === 'custom') {
                if (_ordersCustomFrom) params.append('frm', _ordersCustomFrom);
                if (_ordersCustomTo) params.append('to', _ordersCustomTo);
            }
            // Status
            if (_ordersStatusFilter && _ordersStatusFilter !== 'all') {
                params.append('status', _ordersStatusFilter);
            }
            // Tisch
            const tableEl = document.getElementById('orders-table-filter');
            if (tableEl && tableEl.value && tableEl.value !== 'all') {
                params.append('table', tableEl.value);
            }
            // Search
            const searchEl = document.getElementById('orders-search');
            if (searchEl && searchEl.value.trim()) {
                params.append('search', searchEl.value.trim());
            }
            // URL zusammenbauen und Download auslösen
            const url = `/admin/orders-export/${format}?${params.toString()}`;
            // loading state
            const btn = event?.currentTarget;
            let originalHtml = '';
            if (btn) {
                originalHtml = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `<span class="material-symbols-outlined animate-spin" style="font-size:14px;">progress_activity</span> Export…`;
            }
            // Fetch als Blob damit der Browser einen sauberen Download macht
            fetch(url, { method: 'GET', credentials: 'same-origin' })
                .then(resp => {
                    if (!resp.ok) throw new Error('Export fehlgeschlagen: ' + resp.status);
                    // Filename aus Content-Disposition extrahieren
                    const cd = resp.headers.get('content-disposition') || '';
                    let filename = `bestellreport.${format}`;
                    const match = cd.match(/filename="?([^";]+)"?/);
                    if (match) filename = match[1];
                    return resp.blob().then(blob => ({ blob, filename }));
                })
                .then(({ blob, filename }) => {
                    const objUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = objUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(objUrl), 1000);
                })
                .catch(err => {
                    console.error('Export error:', err);
                    showToast('Export fehlgeschlagen: ' + err.message, 'error');
                })
                .finally(() => {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = originalHtml;
                    }
                });
        }

        // ── BON DETAIL MODAL ──
        // Der Chef kann auf jeden Bon klicken und sieht die komplette Buchungshistorie:
        // Artikel, Mengen, Einzelpreise, Teilzahlungen, Stornos, Trinkgeld, Kellner, Zeit.
        function openBonDetail(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;
            _currentBonData = order; // Für Bon-Druck speichern
            const modal = document.getElementById('bon-detail-modal');
            const titleEl = document.getElementById('bon-detail-title');
            const bodyEl = document.getElementById('bon-detail-body');
            if (!modal || !titleEl || !bodyEl) return;

            titleEl.textContent = `Bon #${order.daily_bon_number || order.id}`;

            const oStatus = (order.status || '').toLowerCase();
            let statusLabel = 'Aktiv';
            let statusColor = 'amber';
            if (oStatus === 'bezahlt') { statusLabel = 'Bezahlt'; statusColor = 'emerald'; }
            else if (oStatus === 'storniert') { statusLabel = 'Storniert'; statusColor = 'rose'; }

            const fmtEUR = (v) => (typeof v === 'number' ? v.toFixed(2).replace('.', ',') : '0,00') + ' €';
            const total = typeof order.total === 'number' ? order.total : 0;
            const originalTotal = typeof order.original_total === 'number' ? order.original_total : null;
            const tip = typeof order.tip_amount === 'number' ? order.tip_amount : 0;
            const totalWithTip = typeof order.total_with_tip === 'number' ? order.total_with_tip : (total + tip);

            // Items-Liste nach Hauptgruppen gruppiert rendern
            const items = order.items || [];
            let itemsHtml = '';
            if (items.length === 0) {
                itemsHtml = '<div class="text-xs text-zinc-500 italic py-3 text-center">Keine Artikel mehr auf diesem Bon — alle Artikel wurden einzeln bezahlt, storniert oder auf einen anderen Tisch umbucht.</div>';
            } else {
                // Nutze die gleiche Gruppierungslogik wie das Kasse-Popup
                const groups = groupItemsBySuperGroup(items);
                itemsHtml = groups.map(group => {
                    const textColor = getContrastTextColor(group.color);
                    const lightBg = lightenColor(group.color, 94);
                    const iconHtml = group.icon ? `<span class="material-symbols-outlined" style="font-size:12px;vertical-align:middle;margin-right:3px;">${escapeHtml(group.icon)}</span>` : '';
                    const groupHeader = `
                        <div style="margin:8px 0 4px 0;padding:5px 10px;border-radius:8px;background:${escapeHtml(group.color)};color:${textColor};font-size:10px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;">
                            <span>${iconHtml}${escapeHtml(group.name)}</span>
                            <span style="font-size:9px;font-weight:700;opacity:.85;">${fmtEUR(group.subtotal)}</span>
                        </div>
                    `;
                    const itemsList = group.items.map(item => {
                        const qty = item.quantity || 1;
                        const price = item.price || 0;
                        const lineTotal = price * qty;
                        const itemStatus = (item.item_status || 'pending').toLowerCase();
                        const statusLabels = {
                            pending: 'offen',
                            confirmed: 'bestätigt',
                            delivered: 'serviert',
                            paid: 'bezahlt',
                            cancelled: 'storniert'
                        };
                        const statusLabel = statusLabels[itemStatus] || itemStatus;
                        // MwSt-Kennzeichnung (Bar/Shisha/Küche · 19%/7%) nur im Brutto-Modus anzeigen.
                        // Im Netto-Modus will der Chef reine Netto-Preise sehen — keine MwSt-Hinweise.
                        const categoryLabel = (PRICE_MODE === 'netto') ? '' : ((item.category_type === 'bar') ? 'Bar · 19%' : (item.category_type === 'shisha') ? 'Shisha · 19%' : 'Küche · 7%');
                        const metaLine = categoryLabel ? `${fmtEUR(price)} · ${categoryLabel}` : fmtEUR(price);
                        const noteHtml = item.note ? `<div class="text-[10px] text-zinc-500 italic mt-0.5">📝 ${escapeHtml(item.note)}</div>` : '';

                        // OPTION A: Kombi-Items speziell rendern
                        // - Zeige "Kombi: Name" als Hauptname (combo_name)
                        // - Zeige Produktname klein darunter
                        // - Badge "KOMBI" zur schnellen Erkennung
                        // - KONTRAST FIX: türkis Hintergrund + schwarze Schrift (statt teal-300)
                        //   → gut lesbar auf dunklem UND hellem Hintergrund
                        const isCombo = item.combo_id && item.combo_name;
                        const comboBadge = isCombo ? `<span style="display:inline-block;background:#14b8a6;color:#000;font-size:8px;font-weight:900;padding:1px 5px;border-radius:4px;margin-left:6px;letter-spacing:0.5px;vertical-align:middle;">KOMBI</span>` : '';
                        const comboSubName = isCombo ? `<div class="text-[10px] text-zinc-500 mt-0.5">↳ ${escapeHtml(item.name)}</div>` : '';

                        return `<div class="bon-detail-item" style="background:${lightBg};border-left:3px solid ${escapeHtml(group.color)};">
                            <div class="bon-detail-item-qty">${qty}×</div>
                            <div>
                                <div class="bon-detail-item-name">${isCombo ? escapeHtml(item.combo_name) : escapeHtml(item.name || 'Unbekannt')}${comboBadge}</div>
                                <div class="bon-detail-item-meta">${metaLine}</div>
                                ${comboSubName}
                                ${noteHtml}
                            </div>
                            <div class="bon-detail-item-price">${fmtEUR(lineTotal)}</div>
                            <span class="bon-detail-item-status ${itemStatus}">${statusLabel}</span>
                        </div>`;
                    }).join('');
                    return groupHeader + itemsList;
                }).join('');
            }

            // 0€-Hinweis: Wenn ein Bon 0€ anzeigt aber original_total > 0
            let zeroHintHtml = '';
            if (originalTotal !== null && originalTotal > 0 && total === 0) {

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // SECURITY FIX (audit 4.2): Helper zum Escapen von Strings, die in Inline-onclick-Handler
        // (JS-Code-Kontext innerhalb eines HTML-Attributs) interpoliert werden.
        // Verhindert Customer→Admin-XSS über item.note / item.name, die in `key` landen
        // und per `${key}` in onclick-Attribute interpoliert werden.
        // Backslash, Single-Quote, Double-Quote, < und > werden escaped — damit kann ein
        // Apostroph aus einer Kunden-Notiz den JS-String nicht mehr brechen und kein
        // HTML-Tag-Injection über <...> stattfinden.
        function escapeForJsAttr(s) {
            if (s === null || s === undefined) return '';
            return String(s)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/</g, '\\u003c')
                .replace(/>/g, '\\u003e')
                .replace(/&/g, '\\u0026');
        }

        // Kontrast-Funktion: gibt '#ffffff' oder '#1f2937' zurück je nach Hintergrund-Helligkeit
        function getContrastTextColor(hexColor) {
            if (!hexColor || typeof hexColor !== 'string') return '#ffffff';
            let c = hexColor.trim().replace('#', '');
            if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
            if (c.length !== 6) return '#ffffff';
            const r = parseInt(c.substr(0, 2), 16);
            const g = parseInt(c.substr(2, 2), 16);
            const b = parseInt(c.substr(4, 2), 16);
            // Relative luminance (WCAG)
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminance > 0.55 ? '#1f2937' : '#ffffff';
        }

        // Sanftes Pastell-Hintergrund-Derivat für Item-Zeilen (aus Hauptgruppen-Farbe)
        function lightenColor(hexColor, percent) {
            if (!hexColor || typeof hexColor !== 'string') return '#f9fafb';
            let c = hexColor.trim().replace('#', '');
            if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
            if (c.length !== 6) return '#f9fafb';
            const r = parseInt(c.substr(0, 2), 16);
            const g = parseInt(c.substr(2, 2), 16);
            const b = parseInt(c.substr(4, 2), 16);
            const factor = percent / 100;
            const nr = Math.min(255, Math.round(r + (255 - r) * factor));
            const ng = Math.min(255, Math.round(g + (255 - g) * factor));
            const nb = Math.min(255, Math.round(b + (255 - b) * factor));
            return '#' + [nr, ng, nb].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        let controlModalActiveTableNum = null;
        let _serveLock = false; // Prevents double-click / Ruckeln on serve buttons
        let _serveLockTimer = null; // Minimum lock duration to prevent rapid re-clicks
        let _optimisticServes = new Map(); // orderId -> Set of item_keys optimistically served
        // Tracks optimistic serve updates so the poll doesn't overwrite them with stale server data
        function _trackOptimisticServe(orderId, itemKey) {
            if (!_optimisticServes.has(orderId)) _optimisticServes.set(orderId, new Set());
            _optimisticServes.get(orderId).add(itemKey);
            // BUG FIX: Auto-expire von 3s auf 15s erhöht.
            // Vorher: nach 3s kam Live-Sync zurück und hat Item überschrieben
            // → "Item taucht wieder auf" Bug (Kellner muss nochmal servieren)
            // 15s ist lang genug dass Backend Cache invalidiert + Live-Sync
            // stabile committed Daten liefert.
            setTimeout(() => {
                const set = _optimisticServes.get(orderId);
                if (set) { set.delete(itemKey); if (set.size === 0) _optimisticServes.delete(orderId); }
            }, 15000);
        }
        function _trackOptimisticServeAll(orderId) {
            _optimisticServes.set(orderId, new Set(['__all__']));
            // BUG FIX: Auch hier 15s (vorher 3s) — gleicher Fix wie _trackOptimisticServe
            setTimeout(() => { _optimisticServes.delete(orderId); }, 15000);
        }

        // ── OPTIMISTIC SPLIT-PAY TRACKING ──
        // Bug 1 + Bug 2 Fix: Trackt Orders mit kürzlich gebuchter Teilzahlung,
        // damit der Live-Poll die lokalen (optimistischen) Items/Totals nicht
        // mit veralteten (gecachten) Server-Daten überschreibt.
        // Key: orderId, Value: expiry-timestamp (ms). Auto-expire nach 15s —
        // bis dahin ist der Backend-Cache sicher invalidiert und der Live-Poll
        // liefert committed-Daten, die mit dem lokalen Zustand übereinstimmen.
        let _optimisticSplitPays = new Map();
        function _trackOptimisticSplitPay(orderIds) {
            const expiry = Date.now() + 15000;
            orderIds.forEach(id => _optimisticSplitPays.set(id, expiry));
        }
        function _hasOptimisticSplitPay(orderId) {
            const expiry = _optimisticSplitPays.get(orderId);
            if (!expiry) return false;
            if (Date.now() > expiry) {
                _optimisticSplitPays.delete(orderId);
                return false;
            }
            return true;
        }
        function _clearOptimisticSplitPay(orderIds) {
            // Bei Fetch-Fehler: Protection sofort aufheben, damit der Resync
            // (checkLiveTischeUpdates) den echten Server-Zustand wiederherstellen kann.
            orderIds.forEach(id => _optimisticSplitPays.delete(id));
        }

        async function submitTableTransfer() {
            const sourceRaw = document.getElementById('transfer-source-table').value;
            const select = document.getElementById('transfer-target-select');
            if (!select) return;
            const targetRaw = select.value;
            
            if (!sourceRaw || !targetRaw) return;

            // SECURITY FIX (audit 4.7): Source und Target sind im Format "num:zone".
            // Wir bauen daraus die vollqualifizierten Tisch-Strings (z. B. "Tisch 1 (Drinnen)")
            // damit das Backend Drinnen/Draußen unterscheiden kann. Falls Zone leer ist,
            // fallback auf reine Nummer wie bisher (Abwärtskompatibilität).
            const [srcNum, srcZone] = sourceRaw.split(':');
            const [tgtNum, tgtZone] = targetRaw.split(':');
            const source = srcZone ? `Tisch ${srcNum} (${srcZone})` : `Tisch ${srcNum}`;
            const target = tgtZone ? `Tisch ${tgtNum} (${tgtZone})` : `Tisch ${tgtNum}`;

            // Gather selected item keys
            const listContainer = document.getElementById('transfer-items-container');
            const itemKeys = [];
            if (listContainer && !listContainer.classList.contains('hidden')) {
                const checkboxes = listContainer.querySelectorAll('input[type="checkbox"]:checked');
                checkboxes.forEach(cb => itemKeys.push(cb.value));
            }
            
            try {
                const payload = { 
                    source_table: source, 
                    target_table: target 
                };
                if (itemKeys.length > 0) {
                    payload.item_keys = itemKeys;
                }

                const res = await fetch('/admin/orders/transfer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    if (itemKeys.length > 0) {
                        showToast(`Ausgewählte Artikel erfolgreich auf Tisch ${target} umgebucht!`, 'success');
                    } else {
                        showToast(`Tisch ${source} erfolgreich auf Tisch ${target} umgebucht!`, 'success');
                    }
                    closeTransferModal();
                    await checkLiveTischeUpdates();
                } else {
                    const err = await res.json().catch(() => ({}));
                    showToast(err.detail || 'Fehler beim Umbuchen', 'error');
                }
            } catch (e) {
                showToast('Verbindungsfehler', 'error');
            }
        }

        // Helper für Notification-Karten: öffnet das Cockpit für den Tisch
        // einer bestimmten Order, anstatt das ältere order-popup zu öffnen.
        // Vermeidet Verwirrung durch zwei unterschiedliche Popups (Cockpit vs order-popup).
        function openCockpitForOrder(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) {
                showToast('Bestellung nicht mehr verfügbar', 'error');
                return;
            }
            const tableStr = String(order.table || '').trim();
            // Mögliche Formate: "1", "Tisch 1", "Tisch 1 (innen)", "Tisch 1 (drinnen)"
            let tableNum = null;
            let zone = '';
            const m1 = tableStr.match(/Tisch\s+(\d+)\s*(?:\(([^)]+)\))?/i);
            if (m1) {
                tableNum = m1[1];
                zone = m1[2] || '';
            } else {
                const m2 = tableStr.match(/^(\d+)\s*(?:\(([^)]+)\))?/);
                if (m2) {
                    tableNum = m2[1];
                    zone = m2[2] || '';
                }
            }
            if (!tableNum) {
                showToast('Tisch konnte nicht ermittelt werden', 'error');
                return;
            }
            openControlModal(tableNum, zone);
        }

        function refreshControlModal() {
            if (!controlModalActiveTableNum) return;
            
            const tableOrders = allOrders.filter(o => {
                const tableStr = String(o.table || '').trim();
                if (controlModalActiveTableZone) {
                    const exactTableStr = `Tisch ${controlModalActiveTableNum} (${controlModalActiveTableZone})`;
                    return (tableStr === exactTableStr || tableStr === controlModalActiveTableNum) && o.status !== 'bezahlt' && o.status !== 'storniert';
                } else {
                    const regex = new RegExp(`^Tisch\\s+${controlModalActiveTableNum}(\\s*\\(|$)`);
                    return regex.test(tableStr) && o.status !== 'bezahlt' && o.status !== 'storniert';
                }
            });
            
            // Dynamically set activeOrderId for cockpit actions
            if (tableOrders.length > 0) {
                activeOrderId = tableOrders[0].id;
            } else {
                activeOrderId = null;
            }
            
            let totalBalance = 0.0;
            let totalPending = 0;
            let totalDelivered = 0;
            
            // Build per-order data
            const orderData = tableOrders.map(order => {
                let orderTotal = 0;
                let pendingItems = [];
                let deliveredItems = [];
                // BUG FIX (Teilzahlung Bug 2): Items in ORIGINAL-Reihenfolge behalten
                // Vorher: [...pendingItems, ...deliveredItems] → beim Servieren rutscht
                // Item von oben nach unten (Kellner irritiert)
                // Jetzt: allItemsInOrder behält die Reihenfolge aus order.items bei
                let allItemsInOrder = [];
                
                if (order.items) {
                    order.items.forEach(item => {
                        const status = item.item_status || 'pending';
                        const noteSlug = (item.note || '').replace(/\s+/g, '_');
                        orderTotal += item.price * item.quantity;
                        
                        for (let idx = 0; idx < item.quantity; idx++) {
                            // BUG FIX: combo_id UND combo_instance_id in key aufnehmen
                            // Vorher: nur combo_id → 2 Kombis mit gleicher combo_id haben
                            // denselben key → beide werden zusammen checked angezeigt!
                            // Jetzt: combo_instance_id macht jeden Kombi-Item eindeutig.
                            const comboIdKey = item.combo_id || '';
                            const comboInstKey = item.combo_instance_id || '';
                            const key = `${order.id}_${item.product_id}_${noteSlug}_${status}_${comboIdKey}_${comboInstKey}_${idx}`;
                            const itemData = {
                                order_id: order.id,
                                product_id: item.product_id,
                                name: item.name,
                                price: item.price,
                                quantity: 1,
                                note: item.note || '',
                                status: status,
                                key: key,
                                unit_index: idx,
                                // OPTION A: Kombi-Felder übernehmen für Anzeige im Cockpit
                                combo_id: item.combo_id || null,
                                combo_name: item.combo_name || null,
                                // BUG FIX: combo_instance_id für eindeutige Kombi-Zuordnung
                                // bei Teilzahlung (sonst werden 2 gleiche Kombis zusammen getoggelt)
                                combo_instance_id: item.combo_instance_id || null
                            };

                            // BUG FIX: Item in allItemsInOrder pushen (für stabile Reihenfolge)
                            allItemsInOrder.push(itemData);
                            
                            if (status === 'pending') {
                                pendingItems.push(itemData);
                                totalPending++;
                            } else {
                                deliveredItems.push(itemData);
                                totalDelivered++;
                            }
                        }
                    });
                }
                
                totalBalance += orderTotal;
                return {
                    id: order.id,
                    // BUG FIX: daily_bon_number + bon_date übernehmen (vorher vergessen!)
                    // Sonst zeigt Kellner-Cockpit 'Bon #917' statt 'Bon #1'
                    daily_bon_number: order.daily_bon_number,
                    bon_date: order.bon_date,
                    total: orderTotal,
                    pendingItems,
                    deliveredItems,
                    allItemsInOrder,  // BUG FIX: stabile Reihenfolge für Anzeige
                    hasPending: pendingItems.length > 0,
                    hasDelivered: deliveredItems.length > 0,
                    allServed: pendingItems.length === 0 && deliveredItems.length > 0
                };
            });
            
            const hasActiveOrder = tableOrders.length > 0;
            const allItemsServed = hasActiveOrder && totalPending === 0 && totalDelivered > 0;
            
            // Update header total
            document.getElementById('control-modal-total-balance').textContent = `${totalBalance.toFixed(2).replace('.', ',')} €`;
            
            // Update footer buttons
            const elPayBtn = document.getElementById('btn-bezahlt-all');
            const elServeAllBtn = document.getElementById('btn-serve-all-cockpit');
            
            if (allItemsServed) {

            } else {

            }
            if (elServeAllBtn) {

            // Render orders container — each order as its own section
            const ordersContainer = document.getElementById('control-orders-container');
            if (!ordersContainer) return;
            
            if (!hasActiveOrder) {
                ordersContainer.innerHTML = `
                    <div class="text-center py-8 text-zinc-500 dark:text-zinc-500">

                const statusLabel = od.allServed ? 'Serviert' : od.hasPending ? 'In Vorbereitung' : '—';
                const statusColor = od.allServed ? 'emerald' : od.hasPending ? 'amber' : 'zinc';
                const bonBg = od.allServed ? 'border-emerald-200 dark:border-emerald-800/40' : 'border-amber-200 dark:border-amber-800/40';

                // Jetzt: allItemsInOrder aus orderData — stabile Reihenfolge!
