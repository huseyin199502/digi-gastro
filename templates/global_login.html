<!DOCTYPE html>
<html class="dark" lang="de">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>SaaS Plattform Login - digi-gastro</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #e5e2e1;
            font-family: 'Inter', sans-serif;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-[#1a1a1a] border border-outline-variant rounded-2xl p-8 shadow-2xl relative overflow-hidden">
        <!-- Accent light effect -->
        <div class="absolute -right-20 -top-20 w-48 h-48 bg-[#deff9a]/5 rounded-full blur-3xl"></div>
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-[#deff9a]/10 rounded-2xl border border-[#deff9a]/20 mb-4">
                <span class="material-symbols-outlined text-[#deff9a] text-3xl">hub</span>
            </div>
            <h2 class="text-2xl font-black text-on-surface tracking-tight">Global Plattform Admin</h2>
            <p class="text-xs text-on-surface-variant mt-1">digi-gastro SaaS Management</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 bg-red-950/40 border border-red-900/30 rounded-xl flex items-start gap-3 text-red-300 text-xs animate-pulse">
            <span class="material-symbols-outlined text-[18px] text-red-400">error</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/digi-gastro-admin/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2" for="email">E-Mail-Adresse</label>
                <input class="w-full bg-background border border-[#262626] rounded-xl px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-[#deff9a] focus:ring-1 focus:ring-[#deff9a] transition-all" id="email" name="email" placeholder="admin@digi-gastro.de" type="email" required>
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2" for="password">Passwort</label>
                <input class="w-full bg-background border border-[#262626] rounded-xl px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-[#deff9a] focus:ring-1 focus:ring-[#deff9a] transition-all" id="password" name="password" placeholder="••••••••" type="password" required>
            </div>

            <div class="pt-2">
                <button class="bg-[#deff9a] text-[#0a0a0a] hover:bg-[#c9e88b] active:scale-95 transition-all duration-150 rounded-xl py-4 font-bold flex items-center justify-center gap-2 w-full text-sm" type="submit">
                    <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">login</span>
                    Plattform verwalten
                </button>
            </div>
        </form>
        
        <div class="border-t border-[#262626] mt-8 pt-4 text-center">
            <a href="/" class="text-xs text-[#deff9a] hover:underline flex items-center justify-center gap-1.5">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                Zurück zur Startseite
            </a>
        </div>
    </div>
</body>
</html>
